
[program:aipedia]
directory=/srv/aipedia/app
command=/bin/bash -c 'set -a; . /etc/aipedia/aipedia.env; set +a; exec /srv/aipedia/venv/bin/python /srv/aipedia/app/tools/serve.py --port 18810'
user=aipedia
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/srv/aipedia/logs/app.log
stderr_logfile=/srv/aipedia/logs/app-error.log
stopasgroup=true
killasgroup=true
