[unix_http_server]
file=/srv/aipedia/aipedia-supervisor.sock
chmod=0700

[supervisord]
logfile=/srv/aipedia/logs/supervisord.log
pidfile=/srv/aipedia/aipedia-supervisord.pid
childlogdir=/srv/aipedia/logs
user=aipedia

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///srv/aipedia/aipedia-supervisor.sock

[program:aipedia]
directory=/srv/aipedia/app
environment=AIPEDIA_ENV="production",AIPEDIA_SECRET_KEY="%(ENV_AIPEDIA_SECRET_KEY)s",AIPEDIA_ALLOWED_HOSTS="aipediya.com,www.aipediya.com,127.0.0.1,localhost",AIPEDIA_TRUST_PROXY="1",AIPEDIA_TRUSTED_ORIGINS="https://aipediya.com,https://www.aipediya.com",AIPEDIA_DB="/srv/aipedia/data/aipedia.sqlite3"
command=/srv/aipedia/venv/bin/python /srv/aipedia/app/tools/serve.py --port 18810
user=aipedia
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/srv/aipedia/logs/app.log
stderr_logfile=/srv/aipedia/logs/app-error.log
stopasgroup=true
killasgroup=true

[program:aipedia-tunnel]
directory=/srv/aipedia
command=/srv/aipedia/bin/run-cloudflared
user=aipedia
autostart=true
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/srv/aipedia/logs/cloudflared.log
stderr_logfile=/srv/aipedia/logs/cloudflared-error.log
stopasgroup=true
killasgroup=true

[program:aipedia-indexnow]
; Periodic IndexNow dispatch of pending outbox events (deploy/indexnow-dispatch-loop.sh).
; environment = the same values as [program:aipedia] plus AIPEDIA_INDEXNOW_KEY and
; AIPEDIA_INDEXNOW_ENABLED="1"; AIPEDIA_INDEXNOW_INTERVAL_SECONDS="300".
directory=/srv/aipedia/app
command=/srv/aipedia/bin/indexnow-dispatch-loop
user=aipedia
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/srv/aipedia/logs/indexnow.log
stderr_logfile=/srv/aipedia/logs/indexnow-error.log
stopasgroup=true
killasgroup=true
