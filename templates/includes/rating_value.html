{% if rating %}<span class="rating-value-wrap" data-rating-model="{{ rating.model_id }}" data-score-type="{{ rating.score_type }}">
<button type="button" class="rating-trigger" data-rating-audit aria-label="{{ ui.rating_audit }}: {{ rating.name }}" aria-expanded="false"><bdi dir="ltr">{{ rating.value }}</bdi> <span title="{{ rating.status_label }}">{{ rating.icon }}</span></button>
<span class="rating-caption">{{ rating.context_label }}</span>
<template data-rating-tip>{% include 'includes/rating_tip.html' %}</template>
</span>{% else %}<span class="rating-caption">—</span>{% endif %}
