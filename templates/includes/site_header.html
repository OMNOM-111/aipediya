{% load static catalog_tags %}<header class="site-header"><a class="brand" href="{{ nav.home }}" aria-label="AIpediya"><img src="{% static 'brand.svg' %}" alt="" width="44" height="44"><span class="brand-word"><span class="brand-ai">AI</span><span>pediya</span></span></a>
{% if catalog_search %}
<label class="search"><i data-lucide="search" aria-hidden="true"></i><span class="sr-only">{{ ui.search }}</span><input type="search" id="catalog-search" name="q" form="catalog-filters" value="{{ q }}" placeholder="{{ ui.search_models }}" maxlength="200" autocomplete="off"><kbd class="search-kbd" aria-hidden="true">/</kbd></label>
{% else %}
<form class="search" method="get" action="{{ nav.home }}" role="search"><i data-lucide="search" aria-hidden="true"></i><span class="sr-only">{{ ui.search }}</span><input type="search" name="q" placeholder="{{ ui.search_models }}" maxlength="200"></form>
{% endif %}
<div class="orbit" aria-hidden="true"><img src="{% static 'orbit.svg' %}" alt="" width="230" height="160"></div>
<div class="header-end"><div class="header-controls">{% if local_nav and not catalog_search %}{% include 'includes/env_nav.html' %}{% endif %}<nav class="languages" aria-label="{{ ui.language }}"><details class="lang-menu"><summary class="lang-toggle" title="{{ ui.language }}"><i data-lucide="languages" aria-hidden="true"></i><span class="lang-current">{{ lang_native }}</span><i class="lang-caret" data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="lang-popover"><ul>{% for code, native, url in language_links %}<li><a href="{{ url }}" hreflang="{{ code }}" lang="{{ code }}" data-set-lang="{{ code }}"{% if code == lang %} aria-current="true"{% endif %}>{{ native }}</a></li>{% endfor %}</ul></div></details></nav><button type="button" id="theme" class="icon-button" title="{{ ui.theme }}" aria-label="{{ ui.theme }}" aria-pressed="false"><i data-lucide="sun" aria-hidden="true"></i></button></div></div></header>
