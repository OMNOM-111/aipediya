{% load catalog_tags %}<div class="rating" data-score="{{ e.score|money }}"><a href="{{ e.source.url }}" target="_blank" rel="noopener noreferrer">{{ e.evaluator }} · {{ e.benchmark.name }}</a> <strong>{{ e.score|money }} {{ e.benchmark.unit }}</strong><span class="secondary">{{ e.configuration|default:ui.unspecified_mode }}{% if e.result_kind == 'composite' %} · {{ ui.composite }}{% endif %}</span></div>
