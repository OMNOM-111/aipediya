{% extends 'base.html' %}{% block content %}<article class="prose"><a class="back" href="/?lang={{ lang }}">← {{ ui.back }}</a><h1>{{ ui.report }}</h1>{% if sent %}<p class="success" role="status">{{ ui.thanks }}</p>{% else %}{% if model %}<p>{{ model.name }} · {{ model.version }}</p>{% endif %}<form method="post" class="report-form">{% csrf_token %}<label for="id_message">{{ ui.report_message }}</label>{{ form.message.errors }}{{ form.message }}{{ form.website }}<button class="primary" type="submit">{{ ui.send }}</button></form>{% endif %}</article>{% endblock %}
