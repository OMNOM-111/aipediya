{% if model.released %}<span class="secondary release-date">{{ ui.released }}: <time datetime="{{ model.released|date:'Y-m-d' }}">{{ model.released|date:'d.m.Y' }}</time>{% if show_source and model.release_evidence.source_url %} · <a href="{{ model.release_evidence.source_url }}" target="_blank" rel="noopener noreferrer">{{ ui.source }}</a>{% endif %}</span>{% else %}<span class="secondary release-date missing">{{ ui.release_unknown }}</span>{% endif %}
