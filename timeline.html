GSC, Bing и Cloudflare вкладки вызовы Browser Use\nотклонили со ссылкой на сохранённое user-permission правило, при прежних allow\nнастройках; Yandex Browser в подключённом списке отсутствовал. Кабинетные метрики,\nдубликаты Cloudflare DNS, полный DNS record set, текущий IndexNow key-file HTTP\nстатус и outbox не заявляются свежепроверенными. Naver verification/sitemap ранее\nподтверждены скриншотами владельца; recovery request принят по сообщению владельца,\nномер не показан, email ожидается. Browser Use отказ остаётся отдельным инцидентом.\nПодробная таблица и content coverage находятся в `docs/SEARCH_DISCOVERY.md`.\n\nСледующий шаг: владелец визуально проверяет эту редакцию при открытии ярлыка; после\nдоступа к кабинетам снимается первый snapshot индексации/показов Google, Bing и\nYandex. Baidu / Китай остаётся отдельным следующим этапом и здесь не начинался.\n\n---\n\n## Причина\n\nСуществующий ярлык `AI_CONTEXT/AIpedia — История сайта.lnk` запускал\n`tools/local/start-local.ps1 -OpenPath /ru/history/`. Launcher подготавливал\nLocal-каталог, выполнял `migrate` и `check`, затем выбирал/запускал Waitress и\nоткрывал `http://127.0.0.1:&lt;port&gt;/ru/history/`. Поэтому просмотр зависел от Local,\nPython/Django и PowerShell.\n\n## Изменено\n\n- Добавлен сборщик `tools/build_product_history.py`: он рендерит существующий\n  Local history view на Django test client из `docs/timeline.json`, allowlist\n  `catalog/product_history.py` и разрешённых документов-источников. Базу не\n  меняет и Local-сервер не запускает.\n- Сгенерирован `timeline.html` в корне рабочей папки `C:\\Users\\dimon\\Documents\\AIpedia`,\n  не в отдельной копии/архиве AI_CONTEXT. Данные этапов, карточки, подробности,\n  источники, RU/EN, тема и локатор языков встроены. Картинки, CSS и JS встроены;\n  CSP запрещает сетевые fetch/resource-загрузки. Обновление HTML запускается\n  автоматически перед обычной сборкой AI_CONTEXT.\n- Существующий ярлык в `AI_CONTEXT` теперь указывает напрямую на корневой\n  `timeline.html`, без PowerShell arguments. Local `/ru/history/` и его\n  source routes сохранены.\n- История и новые статусы не содержат фото удостоверения, реквизитов или личных\n  полей Naver recovery. В источниках автономной страницы email-адреса и ID\n  сессии дополнительно редактируются для приватности.\n\n## Проверки\n\n- `manage.py test catalog --settings=aipedia.test_settings`: **224 PASS, 1 skip**;\n  Django test-client проверил существующие RU/EN/RTL Local routes и source allowlist.\n- Generated HTML содержит 4 milestones на каждую из двух editions и 10\n  встроенных templates source-документов; CSS/JS/SVG встроены. Статический аудит\n  нашёл 0 внешних asset requests; `connect-src &#x27;none&#x27;` и `default-src &#x27;none&#x27;`; все\n  3 inline scripts прошли `node --check`.\n- `tools/pack_ai_context.py` штатно пересобрал HTML после обновления\n  `docs/EXECUTION_STATE.md`; актуальный Naver recovery status появился в output,\n  а видимое UTC-время обновления поставлено в HTML.\n- Штатный stop script подтвердил остановку только AIpedia Local на\n  `127.0.0.1:18810`; PID-файл отсутствует, порт после остановки закрыт. Запуск\n  существующего `.lnk` через Windows file association создал в Edge вкладку\n  `file:///C:/Users/dimon/Documents/AIpedia/timeline.html` с заголовком страницы.\n  Target ярлыка — корневой HTML, arguments пустые, поэтому ярлык не запускает\n  PowerShell или Local.\n- Вызов Windows file association вернулся за **196 ms**; это время передачи файла\n  default browser, не время полной отрисовки. Чтение/взаимодействие с `file:///`\n  через Browser Use отказано политикой URL (разрешены только http/https; tool\n  запретил alternate browser/CDP/command workaround). Поэтому фактическая визуальная\n  отрисовка, работа кликов/переключателя темы/языков и секундомер в браузере не\n  проверены; требуется ручная визуальная приёмка владельцем.\n- Production deploy не выполнялся.\n\n## Разделение статусов\n\n- Реализация: Local-only автономная сборка; Production не менялся.\n- Owner approval: не заявлен и не выведен из автоматических тестов.\n- Production: действующий production release не содержит эту доработку.\n- Следующий шаг: после последней сборки владелец заново открывает ярлык, чтобы\n  получить актуальное содержимое, и визуально проверяет карточки, документы-источники,\n  языковой переключатель и тему; фактическое время полной отрисовки замеряется в\n  браузере владельца. Production release не разрешён.\n\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-26-offline-history-reference-match\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Доводка истории по эталону / History reference match<\/p><pre># Автономная история AIpediya — доводка по эталону, Local-only — 2026-09-26\n\n## Обновление: визуальная проверка владельца завершена 2026-09-26\n\nВладелец сообщил «готово я проверил» о текущей автономной истории. Пометка\n«визуальная проверка ожидается» в исходном снимке ниже более не актуальна.\nНовых замечаний не указано; отдельные скриншоты и агентская проверка через\n`file://` отсутствуют. История остаётся Local-only, это не разрешение на\nProduction и не меняет статус опубликованного каталога. Отдельный флаг\n`Owner Approved` для дизайна не выводится из отсутствия замечаний.\n\n## Уточнение маркеров после проверки владельца\n\nВладелец заметил, что жёлтая точка у завершённой автономной истории выглядела\nкак признак незаконченной работы. Готовность этапа теперь хранится отдельно от\nфакта Production-публикации: автономная история — `done` в Local, Paid Search —\n`planned`. Синяя галочка, жёлтое многоточие и жёлтый пунктирный круг с\nкраткой легендой различают выполненное, работу в процессе и план. Выполнение\nLocal не выдаётся за Production. Новое оформление ждёт отдельного просмотра\nвладельцем; агентская проверка `file://` ограничена политикой браузера.\n\n## Цель\n\nИсправить непринятый владельцем автономный просмотр и приблизить его интерфейс и\nповедение к существующему `timeline.html` StratForge AI, не меняя файлы StratForge.\nДанные AIpediya по-прежнему формируются из `docs/timeline.json` и разрешённых\nисточников истории.\n\n## Изменено\n\n- Отдельные CSS и шаблон AIpediya сверены с композицией эталона: широкая область\n  страницы, две карточки Local/Production, даты над узлами общей горизонтальной\n  линии, карточки с короткими метками, статусами и иконкой, правая панель подробностей\n  шириной 510 px с собственной прокруткой.\n- В панели отдельно показаны сделанное, проверка, решение владельца, остаток,\n  публикация и исходный отчёт. Основная карточка целиком открывает только свои\n  подробности; она поддерживает Enter/Space. Панель закрывается крестиком и Escape,\n  клик по фону закрывает её, Tab остаётся внутри диалога, фокус возвращается к карточке.\n- Сохранены русская локаль и тёмная тема при первом открытии, переключение темы и\n  языка, direct-open `timeline.html`, существующий ярлык и штатная пересборка.\n  Автономный HTML не получает внешние CSS/JS/данные по сети; Production, DNS,\n  каталожная база и StratForge не менялись.\n- Номера GSD-01…GSD-10 в списке функций отображаются только цифрами `01`…`10`,\n  как в присланном примере; внутренние идентификаторы и данные реестра сохранены.\n- Запись истории остаётся Local-only; `Owner Approved` не устанавливался.\n\n## Проверки\n\n- Точечный набор `catalog.tests.test_product_history`: 5/5 PASS; Django system check\n  чистый. JavaScript файла `static/product-history.js` прошёл `node --check`.\n- Полный `manage.py test catalog`: 238 тестов, 235 PASS, 2 FAIL, 1 skip.\n  Оба FAIL находятся в уже изменённых до этой задачи файлах хронологии:\n  `test_manifest_dry_run_idempotency_coverage_and_rollback` и\n  `test_same_day_uses_name_and_unknown_stays_last_both_directions`. История сайта\n  в обоих случаях отдельно проходит целевые тесты; хронологию в этой задаче не менял.\n- Автономная сборка содержит обе локали и полные записи из реестра; структурные\n  тесты проверяют число карточек, точки входа в детали, наличие закрытия, тему,\n  локализованные даты и отсутствие сетевых ресурсов.\n- Визуальные скриншоты и взаимодействия в настоящем окне браузера в этой проверке\n  не получены. Computer Use остановился до чтения страницы с точным сообщением:\n  `could not determine the current browser URL on Windows with enough confidence to enforce policy`.\n  Другой браузер, CDP и обходной запуск не использовались. Поэтому совпадение\n  реального рендеринга и работу кликов, тем, Escape, ленты и прокрутки не объявляем\n  подтверждёнными.\n\n## Статусы и следующий шаг\n\n- Реализация: обновлена в Local; быстрый HTML и привычный ярлык сохранены.\n- Автоматическая проверка: целевые тесты и системная проверка пройдены.\n- Визуальная проверка исполнителем: заблокирована инструментом и не выполнена.\n- Приёмка владельца: ожидается; `Owner Approved` отсутствует.\n- Production: не менялся; автономную историю публиковать не требуется.\n- Следующим выполнить: владелец открывает существующий ярлык и проверяет общий вид,\n  обе темы, выбор карточек, закрытие панели, горизонтальную ленту и прокрутку деталей.\n\n## Дополнение: изменения разнесены по отдельным карточкам\n\nПо примеру панели StratForge каждая строка изменения теперь показана отдельной\nкарточкой. В GSD-1.0 отображаются десять отдельных пунктов `01`…`10`; для остальных\nвех карточки соответствуют записанным change/capability пунктам. Критерии GSD\nнаходятся внутри раскрываемого блока своей карточки. Сами ID и факты из\n`docs/timeline.json` не менялись.\n\nПосле этого дополнения `catalog.tests.test_product_history` — 5/5 PASS. Структурная\nпроверка видит 23 карточки на каждую locale edition (46 с учётом RU и EN в одном\nHTML) и ровно 10 карточек в деталях GSD на язык. Визуальная проверка в браузере\nпо-прежнему ожидает владельца: screenshots не получены.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-26-catalog-master-v015\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Новые модели v015 / Catalog master v015<\/p><pre># catalog-master-v015 — новые модели 22–24.09.2026 (Local → Production)\n\nДата: 2026-09-26 (UTC 2026-09-27). Основание: поручение владельца обновить AIpediya\nпо master v015, импортировать подтверждённые модели в Local, проверить, внести в\nTimeline, затем опубликовать те же изменения на Production без копирования\nLocal SQLite. Статус «опубликовано и проверено» ставится только после реального\nвыпуска и публичной проверки (раздел 6).\n\n## 1. Master v015\n\n- Принятый файл `AI_CONTEXT/AIpediya_Model_Verification_Master_updated_2026-09-26.xlsx`\n  (sha256 `cc431f94468d…`, копия — `backups/catalog-master-v015-20260926/`)\n  установлен как канонический `AI_CONTEXT/AIpediya_Model_Verification_Master.xlsx`.\n  Расхождение: канонического файла v014 в `AI_CONTEXT/` на момент начала не было;\n  v015 собран поверх `AIpediya_Model_Verification_Master(6).xlsx` (Meta `RUN_V015_*`).\n- `check` отклонил два новых Record ID с точкой (`gemini-3.8-flash-tts`,\n  `gemini-3.8-flash-lite-tts`). Записи ещё не были ни в Local, ни в Production;\n  до первой синхронизации они приведены к `gemini-3-8-flash-tts` /\n  `gemini-3-8-flash-lite-tts` вместе с 22 связанными строками\n  (`tools/master_v015_import_2026_09_26.py`, всё в Changelog).\n- Задачи и модальности новых записей были свободным текстом («speech synthesis»,\n  «robot state»); приведены к словарю сайта (модальности text/image/audio/video/other,\n  существующие ключи задач), подробности остаются в описаниях — 16 полей, Changelog.\n- Итог: `check: OK`; Models 321 PUBLISHED / 474 NEEDS_REVIEW, Tools 143 / 2.\n\n## 2. Состав изменений\n\nНовые модели (номер — хронологическая позиция по подтверждённой дате выпуска):\n\n| № | Модель | Разработчик | Дата выпуска | Источник даты |\n|---|---|---|---|---|\n| 311 | Claude Opus 5.5 | Anthropic | 2026-09-22 | platform.claude.com/docs/en/models/opus-5-5 |\n| 312 | Gemini 3.8 Flash TTS | Google | 2026-09-22 | Gemini API changelog / model page |\n| 313 | Gemini 3.8 Flash-Lite TTS | Google | 2026-09-22 | Gemini API changelog / model page |\n| 314 | GPT-6 Luna | OpenAI | 2026-09-22 | OpenAI API changelog |\n| 315 | GPT-6 Sol | OpenAI | 2026-09-22 | OpenAI API changelog |\n| 316 | FLUX 3 Action DROID | Black Forest Labs | 2026-09-23 | Hugging Face model card / BFL blog |\n| 317 | FLUX 3 Action SO-101 | Black Forest Labs | 2026-09-23 | Hugging Face model card / BFL blog |\n| 318 | Nemotron 3 Diarization | NVIDIA | 2026-09-23 | Hugging Face model card |\n| 319 | GLiNER2.5-Decide | Fastino AI | 2026-09-24 | Fastino launch post |\n| 320 | Sarvam Vision 2.1 | Sarvam AI | 2026-09-24 | Sarvam blog |\n| 321 | Speech TTS Live | Yandex | 2026-09-24 | Yandex AI Studio docs |\n\nПри одинаковой дате порядок — по имени, затем Record ID (правило master).\nСуществующие номера 1–310 не сдвинулись.\n\nТакже из master v015 (статус PUBLISHED): четыре новых инструмента — Alice AI Pro for\nBusiness, Qwen Intelligence, Yandex AI Studio, SourceCraft (18 инструментов получили\nновый хронологический номер из-за вставки SourceCraft ≈2025 и Yandex AI Studio\n2025-09-24); исправления 9 существующих моделей (категория `image` → `text` у\nGPT-5.6 Sol/Terra/Luna, GPT-6 Astra, Claude Opus 5, Claude Fable 5.1, Claude Sonnet 5,\nClaude Haiku 4.5; задачи; контекст Claude Haiku 4.5 1M → 200K; alias `gpt-5.6`).\n\nНе публикуются (NEEDS_REVIEW): Speech Realtime Max TTS Live, CLM-v0.1-8B (модели),\nAX (инструмент) — на Local и Production отвечают 404 и не находятся поиском.\n\n## 3. Код: новые модели приходят с ценами и доступом\n\n`sync-local` / `release-plan` раньше создавали новую карточку без её строк Offers/Access\n(они уходили в `unsupported`). Теперь запись `create` новой модели несёт её строки\nmaster: 35 цен и 26 строк доступа 11 моделей, а также Suitable/Limitations EN/RU и\nRelease Evidence. Цена требует `Research Key` (по нему повторный запуск и `import`\nузнают строку); сервис переиспользуется при полном совпадении, иначе создаётся;\nединица проверяется по виду сервиса. `import`/`check` сопоставляют такие строки по\nсодержимому (`NATURAL_KEYS`: Research Key; владелец + сервис + ссылка). Строки\nсуществующих записей и новых инструментов по-прежнему только в отчёте `unsupported`.\n\nНайдено испытанием выпуска и исправлено: `final_state_problems` считал расхождением\nномера черновиков master (NEEDS_REVIEW), которых нет в базе; `apply-plan` правильно\nоткатил пробный перенос. Теперь отсутствующая запись без планового номера — верное\nсостояние. Регрессионные тесты — `NewModelLinkedRowsTests`.\n\n## 4. Local\n\n- Резервная копия рабочей базы: `backups/catalog-master-v015-20260926/aipedia-local-before-v015.sqlite3`\n  (sha256 `29d2c5dda826…`).\n- Пробный прогон на копии: `sync-local --apply` 56 изменений → `import` (+3 связи\n  платформ SourceCraft) → `check: OK` → повторный `sync-local` 0 записей.\n- Рабочий Local: те же 56 изменений, `check: OK`, повтор 0; переводы\n  `translate_catalog` (Azure, 41 580 символов, 440 переводов, 0 ошибок).\n- Сохранность (сравнение с резервной копией): pk/slug всех 920 прежних записей без\n  изменений; 0 изменённых или удалённых прежних строк цен, оценок, доступа, источников,\n  сервисов; журналы только выросли (Revision 4867 → 4957, PublicationRevision\n  4847 → 4879, ToolPublicationRevision 569 → 599).\n- Каталог: 321 модель / 143 инструмента; номера моделей 1–321 без пропусков и\n  повторов, по дате монотонны; дублей названий и алиасов среди публичных нет.\n- HTTP-проверка (`artifacts/catalog-master-v015/v015_check.py`) на Local с текущим\n  кодом: 144/144 PASS — карточки EN/RU 200, имя, номер, дата выпуска, цены\n  Claude/GPT-6/Gemini TTS; поиск по имени и алиасам (`claude-opus-5-5`, `Opus 5.5`,\n  `fastino/GLiNER2.5-Decide`, `nvidia/Nemotron-3-Diarization`,\n  `speech-realtime-tts-live`); 3 записи NEEDS_REVIEW — 404 и нет в поиске; счётчики\n  321/143; порядок по умолчанию 321 → 310; sitemap 321/143. Браузер: RU-поиск\n  «GPT-6», карточка Claude Opus 5.5; переводы ja/de/ar.\n- Тесты: `manage.py test catalog` — 272 (271 OK, 1 skip) в рабочем дереве.\n\n## 5. Кандидат выпуска\n\nВетка `release/catalog-master-v015` от опубликованного `0702405` (код Production\n`61adedd` + документы), только файлы из `data/release/v015/CANDIDATE_FILES.txt`;\nнезавершённая работа `main` (история сайта и др.) в выпуск не входит.\n\n- `data/release/v015/catalog_plan.json` — `release-plan` на копии исходного снимка\n  Local (310/139, сверен с публичным Production в v014; не копия серверной БД):\n  create 15, update 9, number 18.\n- `data/release/v015/translations.json` — 440 переводов 15 новых записей.\n- `data/release_state.json` — 321 Models / 143 Tools.\n- Пробный перенос (как на сервере): migrate → apply-plan 56 записей, итог = план →\n  import_translations 440 → sync_publication_state 0 изменений → повтор apply-plan\n  «already applied», повтор переводов 0. Результат совпал с рабочим Local по моделям,\n  инструментам, ценам, доступу, оценкам, странам, платформам и текстам\n  (`artifacts/catalog-master-v015/release_trial_vs_local.txt`).\n\n## 6. Production\n\nРазрешение владельца в этой задаче (2026-09-27, ответ «Да, весь пакет v015» на вопрос с\ncommit `e36acfa`, архивом и полным составом). Подключение — существующий SSH к общей\nмашине, только контур AIpediya (`D-2026-09-26-shared-server-ssh`).\n\n- Read-only: хост `1cdfd28f030e`, программа `aipedia` RUNNING, `/healthz` — `61adedd…`,\n  свободно 383 ГБ.\n- Архив `aipedia-code-e36acfa351b2.zip`, SHA-256\n  `d5225a113f5c48193bef5df508afac3282901983117292e6cb7d44a012488b09` (совпал на сервере);\n  317 файлов; распакованный архив в чистом окружении — 274 теста OK (1 skip).\n- Preflight на онлайн-копии боевой БД\n  `/srv/aipedia/backups/aipedia-preflight-v015-20260927T013521Z.sqlite3` (integrity ok,\n  было 310/139): pending → 56 записей, итог = план; переводы 440; манифест 0 изменений;\n  повтор плана «already applied», повтор переводов 0; стало 321/143, номера 1–321.\n- `deploy_code_release.py` (2026-09-27 01:35:48Z): backup\n  `/srv/aipedia/backups/aipedia-before-code-20260927T013548Z.sqlite3`; migrate — нет\n  миграций; `apply-plan` pending → 56 записей, итог = план; `import_translations` 440;\n  `sync_publication_state --apply` 0 изменений (321/143); `aipedia` запущена;\n  статус `deployed-origin-verified`, `copied_sqlite=false`; предыдущий код —\n  `/srv/aipedia/releases/before-code-20260927T013548Z`; после —\n  `aipedia-after-code-20260927T013548Z.sqlite3`. Остальные программы AIpediya и\n  StratForge не перезапускались. Откат — `docs/RELEASE.md`, «Откат кода».\n\n## 7. Публичная проверка https://aipediya.com\n\n- `/healthz`: release `e36acfa351b28f441ec7ad91587b67201cb8aa85`, production.\n- `v015_check.py` — 144/144 PASS (`artifacts/catalog-master-v015/public_check.json`):\n  11 карточек EN/RU — 200, имя, номер 311–321, дата 22/23/24.09.2026, цены\n  Claude Opus 5.5 / GPT-6 / Gemini TTS; поиск по именам и алиасам; Speech Realtime Max\n  TTS Live, CLM-v0.1-8B и AX — 404 и не находятся; счётчики 321/143; порядок по\n  умолчанию 321 → 310; sitemap 321/143; 4 новых инструмента — 200.\n- Прежний поисковый выпуск сохранён: `gsd_public_check.py` 34/34, `search_visibility_qa.py`\n  45/45 старых URL (25 × 301, 19 × 404, 1 × 200 noindex), 0 ошибок.\n- Браузер: карточка GPT-6 Sol №315, 22.09.2026; Models 321 / Tools 143.\n- Master: `catalog_master import --production` — новые модели On Production = YES,\n  записи NEEDS_REVIEW — NO; Meta Production Release `e36acfa…`, sitemap 321/143;\n  `check: OK`.\n\n**Статус: Local PASS → Timeline обновлён → Production опубликован → Public PASS. Этап закрыт.**\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-27-catalog-master-v015-final\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Финальная синхронизация v015 / v015 final sync<\/p><pre># catalog-master-v015 final — счётчики, страны и флаги, цены, независимые оценки, QA\n\nДата: 2026-09-27 (UTC). Основание: поручение владельца довести v015 до завершённого\nсостояния в master, Local, Timeline, GitHub и Production. Этот этап не меняет даты\nвыпуска моделей: номера 1–321 и все даты сохранены (проверка сохранности ниже).\n\n## 1. «143 Tools» и «116»\n\nУстановлено на Local и Production (серверный HTML и состояние после JS): вкладка\nTools = 143, счётчик «143 результата», «Показано 143 / 143», в DOM 143 строки,\nbackend-total 143 — один и тот же набор опубликованных инструментов. «116» — не\nколичество, а **номер в колонке №** первой строки: хронологический номер получают\nтолько 116 инструментов с подтверждённой датой выпуска, у 27 даты нет и номера нет.\nИсправление: рядом со счётчиком (Models и Tools, 22 языка) показывается\n«с датой выпуска (№): 116 · без подтверждённой даты, без №: 27», когда есть\nзаписи без даты; QA сверяет вкладку, счётчик, «Показано x / y», строки после\nзагрузки всех страниц и базу (EN/RU).\n\n## 2. Страны и флаги\n\n- Модели: у 11 опубликованных моделей не было страны (10 новых v015 и GigaChat 3.5\n  432B A28B Reasoning). Добавлены строки Origins с источником: США (Anthropic,\n  OpenAI, Google, NVIDIA, Fastino — пресс-релиз «based in Palo Alto, California»),\n  Германия (Black Forest Labs), Россия (Yandex, Sber — корпоративный блог).\n- Инструменты: страна разработчика заполнена для 15 инструментов (Cursor, Ollama,\n  LM Studio, Midjourney, Suno, ComfyUI, GitHub Copilot, 4 голосовых инструмента xAI,\n  Cline — США; Qwen Intelligence — Китай; Alice AI Pro for Business, SourceCraft —\n  Россия), источники — условия использования/страницы компаний (Facts `origin_status`).\n- Не установлено и не выдумано (очередь качества данных): Aider (проект\n  частного лица), llama.cpp (сообщество ggml-org), Roo Code (сайт перенаправляет на\n  roomote.dev без юрлица).\n- Правило (постоянное, `D-2026-09-27-release-qa-gate`): опубликованная запись с\n  известным происхождением без страны/флага — блокирующая ошибка QA; флаг должен\n  существовать в `static/flags.svg`.\n\n## 3. Цены\n\nОфициальные страницы проверены 2026-09-27. Добавлено 70 строк цен (валюта, единица,\nвход/выход, модальность, контекстный уровень, дата вступления, источник):\nGPT-5 Pro, 5.1, 5.2, 5.2 Pro, 5.3-Codex, 5.4, 5.4 Pro, 5.4 mini, 5.4 nano, 5.5, 5.5 Pro\n(Standard, &lt;272K; длинный контекст на странице не опубликован — не выдумывался),\nGemini 3.1 Flash-Lite Image, Qwen3-Coder-480B (три уровня контекста),\nQwen3.8-LiveTranslate, Kimi K2.6 / K2.7 Code / K3, Solar Pro 2, Sarvam Vision 2.1\n(₹ за страницу), Speech TTS Live ($ без НДС и ₽ с НДС за начатый блок 250 символов),\nSourceCraft (тарифы с 2026-10-01 — сохранены как запланированные, неактивные),\nAmazon Q Developer Pro и ElevenLabs burst (ранее собранные строки, добавлены RU-условия).\nЧетыре существующие строки $0 (Leanstral 1.5, Mistral Moderation 2, Cursor Hobby,\nSuno Free) — подтверждённые бесплатные тарифы; условия теперь это явно говорят.\nСайт показывает валюту строки (₹, ₽, $), сравнения цен остаются только в USD.\n\nПроверенные пробелы (факты `pricing_status`, не «$0»): Command A+ и North (цены по\nдоговору), Jamba 1.5 и PLaMo 2.x (API продаёт уже новые версии), Qwen-Image-2.1,\nPLaMo Translate, EXAONE 4.0, GLiNER2.5-Decide (нет официальной цены хостинга),\nNemotron 3 Diarization и FLUX 3 Action (открытые веса без API), Alice AI Pro for\nBusiness, Qwen Intelligence (цена не публикуется), Yandex AI Studio (оплата по моделям),\nMiniMax Speech Recognition (валюта не подтверждена — строка не опубликована).\nRetired/archived модели не требуют текущей цены.\n\n## 4. Независимые оценки\n\nИсточник с правом публикации — собственные прогоны Epoch AI (CC BY 4.0), снимок\n2026-09-27 (`artifacts/epoch-ai-2026-09-27/`). Сопоставление только с точной версией:\nдобавлено 25 результатов — Claude Opus 5.5 (EBR-bench, Furniture Assembly, max),\nGPT-6 Sol (те же, max), Qwen3.8-Max, Qwen3.8 Max (0902), DeepSeek V4 Flash 0731\n(GPQA Diamond, FrontierMath, SimpleQA и др.). Artificial Analysis, Arena, LiveBench и\nлидерборд SWE-bench не используются (условия запрещают републикацию); данные\nразработчиков не считаются независимыми. Честные пробелы (9, показываются в\nкарточке): GPT-6 Luna, Gemini 3.8 Flash TTS / Flash-Lite TTS, Speech TTS Live,\nNemotron 3 Diarization, Sarvam Vision 2.1, GLiNER2.5-Decide, FLUX 3 Action DROID / SO-101.\n\n## 5. Master, синхронизация и QA\n\n- Все изменения — сначала в master v015 (`tools/master_v015_final_2026_09_27.py`,\n  Changelog), затем `sync-local`. Резервные копии: master до этапа и Local до этапа —\n  `backups/catalog-master-v015-20260926/`.\n- `sync-local` / `release-plan` теперь переносят новые строки цен, доступа, стран и\n  независимых оценок существующих записей, страну разработчика (только когда в Local\n  её нет) и версию инструмента; у инструмента без legacy-строки создаётся контейнер\n  цен и доступа. Строки узнаются по содержимому (Research Key, Observation Key,\n  владелец + сервис, модель + страна) — повторный запуск и `import` дублей не дают.\n- `catalog_master qa` — блокирующие проверки (счётчики, страна/флаг, цена\n  коммерческого API, $0 без бесплатного тарифа, независимость и права источника\n  оценок, источники, дубли, master ↔ Local ↔ Production) и очередь качества данных\n  с применимостью по фактам `*_status`.\n\n## 6. Local\n\n- `sync-local`: 144 изменения (70 цен, 19 доступов, 25 оценок, 11 стран моделей,\n  11 стран разработчиков, 4 версии инструментов, 4 условия); `import` ничего не\n  добавил; `check: OK`; повтор 0 записей; переводы не требуются.\n- Сохранность: ни одна дата, номер, ID или публикация модели/инструмента не\n  изменились; прежние цены, оценки, доступы и страны не изменены и не удалены\n  (кроме 4 уточнений условий бесплатных тарифов); журналы выросли.\n- `catalog_master qa` — PASS (0 ошибок, очередь 29, предупреждений 17 — даты без\n  ссылки на доказательство у старых моделей); HTTP `final_check.py` — 207/207;\n  тесты — 290 (289 OK, 1 skip); браузер: счётчик Tools, флаги, цены ₹.\n\n## 7. Git и Local 18810\n\n`main` приведён к опубликованной линии: fast-forward до `00cb8f4`\n(`release/catalog-master-v015`), незакоммиченная работа сохранена (резервная копия\n`backups/main-wip-20260927/`), конфликты разрешены в пользу проверенного на\nProduction поискового кода. Local 18810 перезапущен штатными скриптами на\nактуальном коде.\n\n## 8. GitHub и Production\n\n- GitHub: `main` = `a51c0a1aed2f63047b0203b208eccf8def458ae7` (push), ветка\n  `release/catalog-master-v015` и tag `release-2026-09-26-catalog-master-v015`\n  опубликованы; tag этого выпуска — `release-2026-09-27-catalog-master-v015-final`.\n- Архив `aipedia-code-a51c0a1aed2f.zip`, SHA-256\n  `e2f5485db53988bd7d66fd9fa5542665d2e232d157aa12071b1ae2446b3a92e1`, 327 файлов (без\n  SQLite, секретов и XLSX); распакованный архив — 290 тестов (289 OK, 1 skip).\n- Пробный перенос плана на исходный снимок Local совпал с рабочим Local по моделям,\n  инструментам, организациям, ценам, доступу, оценкам и странам; QA на пробной базе PASS.\n- Preflight на онлайн-копии боевой БД\n  `/srv/aipedia/backups/aipedia-preflight-v015-final-20260927T032300Z.sqlite3`\n  (integrity ok, 321/143, 590 цен): pending -&gt; 144 записи, итог = план; манифест 0\n  изменений; повтор «already applied»; стало 660 цен, 906 оценок, 844 страны, номера 1–321.\n- `deploy_code_release.py` (2026-09-27 03:23:13Z): backup\n  `/srv/aipedia/backups/aipedia-before-code-20260927T032313Z.sqlite3`; миграций нет;\n  `apply-plan` 144 записи, итог = план; `sync_publication_state --apply` 0 изменений;\n  `deployed-origin-verified`, `copied_sqlite=false`; предыдущий код —\n  `/srv/aipedia/releases/before-code-20260927T032313Z`; после —\n  `aipedia-after-code-20260927T032313Z.sqlite3`. StratForge и другие программы не\n  затрагивались.\n\n## 9. Публичная проверка https://aipediya.com\n\n- `/healthz`: release `a51c0a1aed2f…`, production.\n- `final_check.py` — 207/207 (`artifacts/catalog-master-v015-final/public_final_check.json`):\n  все проверки v015 (144) + счётчики EN/RU после загрузки всех страниц (321 / 143),\n  пояснение № Tools 116 / 27, флаги 21 карточки, цены (USD, INR, RUB), независимые\n  оценки Opus 5.5 / GPT-6 Sol / Qwen3.8-Max / DeepSeek V4 Flash 0731, пробелы оценок.\n- `catalog_master qa --production` — PASS: публичные наборы master = Local = Production.\n- Поиск: `gsd_public_check` 34/34, `search_visibility_qa` 45/45 старых URL (25 × 301,\n  19 × 404, 1 × 200 noindex); `/history/` на Production — 404 (только Local).\n- Браузер: Tools 143 = счётчик = 143 строки, пояснение и флаги; оценки Claude Opus 5.5.\n\n**Статус: Local PASS → Timeline PASS → GitHub synced → Production PASS → Public PASS. Этап закрыт.**\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-27-adaptive-ui-release\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Адаптивный интерфейс / Adaptive UI release<\/p><pre># Выпуск release-2026-09-27-adaptive-ui — Adaptive Interface / Mobile &amp; Tablet UX\n\n- Дата выпуска: 2026-09-27, deploy 16:16:46Z, публичная проверка завершена ~16:30Z.\n- Разрешение владельца: 2026-09-27 — «Разрешаю опубликовать на Production утверждённое\n  текущее состояние AIpediya из `main`, commit `aa48e11`, строго по `docs/RELEASE.md`».\n  Приёмка Local — `D-2026-09-27-owner-acceptance-adaptive-ui`.\n- Release commit: `aa48e11bad7326340463654e33ba5e89769042b9`, tag\n  `release-2026-09-27-adaptive-ui`. Предыдущий Production: `a51c0a1aed2f63047b0203b208eccf8def458ae7`\n  (`release-2026-09-27-catalog-master-v015-final`).\n- Исполнитель серверной фазы: Claude Code в режиме Manual (подтверждение команд владельцем),\n  по `D-2026-09-27-claude-server-permission-mode`; первая попытка в `Auto` ожидаемо\n  заблокирована средой, сервер тогда не затрагивался.\n\n## 1. Состав\n\nCode-only выпуск: адаптивная вёрстка каталога (телефон — карточки строк и панель под шапкой;\nпланшет — сворачивание колонок и drawer; desktop — таблица и панель от 1280 nt-csp-trial-plan.json`: **6 release-date changes and 109\nnumber changes**, 0 publish/unpublish, 0 aliases/redirects/merges, 0 additions\nor deletions. It also reports 110 pre-existing unsupported master/Local field\ndifferences (16 public, 94 service/representation); they are not applied by\nthis sync. A repeated plan after trial apply and import had **0 supported\nchanges**.\n\nThe trial used an online SQLite backup at\n`backups/catalog-count-csp-20260927/aipedia-trial.sqlite3` and a separate\ncopy of the workbook. `catalog_master check` is OK; `catalog_master qa` is PASS\non that trial (143 public, 122 numbered). Against the unchanged working Local,\nQA correctly fails on 115 pending date/number differences. Working Local and\nProduction SQLite were not written. The working Local apply awaits acceptance\nof this exact diff under `AGENTS.md` and `docs/CATALOG_MASTER.md`.\n\n## CSP finding and code change\n\nThe current public response has `script-src &#x27;self&#x27;`. Cloudflare inserts\n`https://static.cloudflareinsights.com/beacon.min.js/v31…` into public HTML;\nthis URL is blocked by the public CSP. The injection is observed, but a\nCloudflare Dashboard setting and successful telemetry POST were not verified.\nThe code change is only in `catalog/middleware.py`: permit the exact\n`beacon.min.js` path and its versioned subpath in `script-src`, and state\n`connect-src &#x27;self&#x27;` for the documented same-origin `/cdn-cgi/rum` endpoint.\nNo wildcard, `unsafe-inline`, `unsafe-eval` or other directive relaxation was\nintroduced. [Cloudflare FAQ](https://developers.cloudflare.com/web-analytics/faq/)\ndocuments this CSP setup; the [CSP specification](https://www.w3.org/TR/CSP/)\ndefines the trailing-slash path-prefix match. `catalog/tests/test_csp.py`\nasserts these exact security properties.\n\nThe trial browser loaded EN Models (321) and EN/RU Tools (143, 122 numbered,\n21 undated) under the new CSP; no errors were recorded on the EN Models or\nTools tabs. The 3`.\n  Trial `migrate` (none), `catalog_master apply-plan` dry-run then apply: 167\n  writes; publication-state dry-run: 0 Models / 0 Tools flag changes. Trial\n  SQLite integrity `ok`, foreign keys 0. Trial Tool field diff was exactly\n  140 `public_number`, 4 `released`, 23 `approx_released`, 23\n  `approx_precision`; Model rows were unchanged.\n- Deploy dry-run PASS. Actual `tools/deploy_code_release.py` made\n  `/srv/aipedia/backups/aipedia-before-code-20260927T191327Z.sqlite3`, stopped\n  only `aipedia`, migrated with no schema changes, applied the same 167 writes,\n  applied publication manifest with 0 flag changes, switched app, started only\n  `aipedia`, and verified origin `/healthz` against the exact commit. Post-deploy\n  backup: `/srv/aipedia/backups/aipedia-after-code-20260927T191327Z.sqlite3`;\n  previous app: `/srv/aipedia/releases/before-code-20260927T191327Z`.\n\n## Production verification\n\n- Live server SQLite: 143 published Tools, 143 numbered, range 1–143 without\n  duplicate or gap; 60 exact, 83 approximate, 0 undated. 321 published Models.\n  `PRAGMA integrity_check=ok`; foreign-key violations 0. Production service\n  RUNNING; `/healthz` release `cf4ac9a33f8d4467510d6b76ebe115ce7e1803d3`.\n- Read-only `server.py verify-release` compared live SQLite with the\n  pre-deploy online backup. The only changed factual table is `catalog_tool`;\n  changed columns and counts are exactly 140 numbers, 4 exact dates, 23\n  approximate dates and 23 precisions. Model rows, offers, evaluations,\n  descriptions and other factual catalog tables are unchanged.\n- Public browser: RU and EN Tools each show 143 records, oldest 001→143 and\n  newest 143→001, with `≈` displayed for approximate dates. RU/EN Models\n  each show 321. Browser console reported no warning/error during checks.\n- Public HTTP CSP: `script-src &#x27;self&#x27;` plus exact Cloudflare beacon URL and\n  versioned path prefix, `connect-src &#x27;self&#x27;`; no wildcard or inline/eval\n  relaxation. Real browser network observed versioned beacon HTTP 200 and\n  same-origin `/cdn-cgi/rum` HTTP 204, with no CSP load failure.\n- `catalog_master check`: OK; `catalog_master qa --production`: PASS.\n  Local `manage.py check`: 0 issues; full catalog suite: 308 tests OK, one\n  expected skip. GSD public check: 34/34 PASS; full GSD Production QA:\n  1,657/1,657 PASS across 697 requests, no failures. No rollback required.\n\n## Scope and access contract\n\nThe release archive is the approved Tools/CSP code and data plan. The new\n`tools/server.py`, server preflight script, SSH config template, regression\ntests, and access documentation were added after the archive was built and\ndo not alter this published application release. The workstation user SSH\nconfig contains the `aipediya-prod` alias, without secret material. AIpediya\nserver scope stayed within `/srv/aipedia`, `/tmp/aipedia-*`, and its own service.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-27-catalog-325-147-release\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Каталог 325/147 / Catalog 325/147<\/p><pre># Выпуск каталога 325 Models / 147 Tools — 2026-09-27\n\nВладелец визуально проверил Local и разрешил выпуск этого состояния по\n`docs/RELEASE.md`. Выпуск выполнен 2026-09-27 около 22:00 UTC.\n\n## Состав и артефакты\n\n- Commit: `9ddba83c176aa3f6793362d6345b797c76ddf987`.\n- Tag: `release-2026-09-27-catalog-325-147`.\n- Code-only архив: `artifacts/code-release/aipedia-code-9ddba83c176a.zip`;\n  SHA-256 `7b8fa47b7c4da09f746b6ab17f4baa92efebab05bcebb140cefac94fb40020d7`.\n  В архиве нет Local SQLite, `.env`, ключей или `.venv`.\n- План каталога: `data/release/catalog-20260927-325-147/catalog_plan.json`.\n  Применено 283 операции; план включает 8 созданий, 7 обновлений и 260\n  пересчётов номеров. Переназначений ID и переписываний Offers не было.\n- Манифест состояния публикации: `data/release_state.json`;\n  SHA-256 `48d7dce740e6699c0e7def4d1f949dc6902316ef167798d8b2b7293cb7f94dc3`.\n  На сервере он не потребовал изменений видимости.\n\nНовые модели: LongCat-2.5-Preview и Qwen3Guard-Stream 0.6B, 4B, 8B.\nНовые инструменты: GPT Researcher, KoboldCpp, Darkbloom, vMLX.\nОбновлены семь существующих записей. Record ID и URL сохранены.\n\n## Preflight и backup\n\n- До выпуска Production: commit `cf4ac9a33f8d4467510d6b76ebe115ce7e1803d3`,\n  321 Models / 143 Tools; SQLite integrity OK, FK 0.\n- Read-only снимок исходной Production SQLite:\n  `artifacts/catalog-release-20260927/production-baseline-20260927T214621Z.sqlite3`,\n  SHA-256 `058873883e6e55db245860cc1cff6ba0ca4fc5dc5fd285f07c0654b1fc05834c`.\n- `tools/server.py release-preflight` с архивом, планом и манифестом: PASS.\n  Серверный backup preflight:\n  `/srv/aipedia/backups/aipedia-preflight-catalog-325-147-20260927T220018Z.sqlite3`.\n- Пробное применение к копии Production: 325/147, все номера непрерывны,\n  SQLite integrity OK, FK 0, `catalog_master qa`: PASS. Сверка с Local по\n  содержимому: 325 Models, 147 Tools, 614 Offers, 664 Access, 905 Evaluations,\n  344 Origins и 254 Tool Platforms совпали; технические PK игнорировались.\n- `tools/server.py deploy --dry-run`: PASS.\n\n## Production и проверки\n\n- Выполнен штатный `tools/server.py deploy` через SSH alias `aipediya-prod`,\n  строго в контуре `/srv/aipedia`; Local SQLite не копировалась.\n- Backup перед выпуском:\n  `/srv/aipedia/backups/aipedia-before-code-20260927T220041Z.sqlite3`.\n  Backup после выпуска:\n  `/srv/aipedia/backups/aipedia-after-code-20260927T220041Z.sqlite3`.\n  Предыдущий код:\n  `/srv/aipedia/releases/before-code-20260927T220041Z`.\n- `tools/server.py health`: PASS, release commit `9ddba83c176aa3f6793362d6345b797c76ddf987`.\n  `tools/server.py catalog`: PASS, 325/325 Models и 147/147 Tools с номерами,\n  SQLite integrity OK, FK 0. `tools/server.py verify-release` относительно\n  backup перед выпуском: PASS, изменены только ожидаемые таблицы каталога.\n- `catalog_master qa --production`: PASS. `gsd_public_check.py`: 34/34.\n  Полный `gsd_production_qa.py`: 1657/1657, 697 запросов, 0 failures.\n- В публичном браузере: RU Models 325, Tools 147; LongCat #325 с датой\n  25 сентября и ценами Vercel AI Gateway; новые Darkbloom и vMLX в Tools;\n  EN Tools 147 и локализованные подписи. Карточка LongCat открывается по\n  `/ru/models/longcat-2-5-preview`.\n- Local до выпуска: `catalog_master qa` PASS, 309 catalog tests OK (1 skip).\n\n## Остаток\n\nВ очереди качества master остаются 35 явно помеченных неполных фактов.\nПрямой тариф LongCat 2.5 API не подтверждён; отображаемые цены относятся\nк Vercel AI Gateway. Это не препятствовало текущему выпуску и не является\nнулевой ценой прямого API. Следующим этапом дополнять доказательства в master\nи проводить новый Local цикл перед следующим выпуском.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-28-unsupported-master-production-audit\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Аудит unsupported master / Production<\/p><pre># Read-only аудит 1 067 `unsupported` master ↔ Production\n\nДата: 2026-09-28 UTC. Статус Timeline: **review**, ожидает оценки владельца. Это аудит диагностики, не выпуск и не заявка на синхронизацию.\n\n## Основание и метод\n\n- Canonical master: `AI_CONTEXT/AIpediya_Model_Verification_Master.xlsx`; только чтение листов и Changelog. Production: штатный `tools/server.py preflight` (`/healthz` = `d349d6de42cb…`, `aipedia` RUNNING), затем `tools/server.py snapshot` в игнорируемый Local-артефакт `artifacts/catalog-release-20260927/production-baseline-20260928T193212Z.sqlite3` (SHA-256 `8393660832892e1f422358be892b86bb2050eba9745de82b6b972da093837cce`, integrity OK, FK 0). Команда `catalog_master sync-local` выполнена **без `--apply`**, с `AIPEDIA_DB` только на этот снимок; план: `artifacts/catalog-release-20260927/unsupported-audit-20260928-plan.json`.\n- План: 0 записываемых изменений, 1 067 `unsupported` (971 `public`, 96 `service`), плюс отдельные 415 непубличных записей вне этих 1 067. Сравнение каждого предупреждения с master и снимком — `artifacts/catalog-release-20260927/unsupported-audit-20260928-analysis.json`. `public` в плане означает техническую категорию поля, **не доказанное отсутствие значения на сайте**.\n- **954 предупреждения — ложные различия по числовому PK**: Master ссылается на Local `offer-N`, `origin-N`, `platform-N`, а в Production тот же PK у другой строки. Каждое из 954 значений найдено в Production у строки с тем же естественным ключом (`Research Key`, `Record ID + Country`, `Record ID + Platform`) под другим PK и совпадает с Master. Это 153 полей Offers, 203 Origins, 598 Tool Platforms. Содержательных различий остаётся **113**, столько же даёт рабочий Local. Один PK может порождать несколько предупреждений; 1 067 — число полей, не записей.\n\n## Разбивка и смысл полей\n\n`M → P` = Master → Production; примеры не заменяют полного плана. «Другой PK» означает, что соответствующая содержательная строка уже есть в Production с тем же значением поля. Причина `unsupported`: `catalog/master_sync.py::_unsupported` сравнивает вспомогательные строки по `Key` и не пишет перечисленные поля; общий Source/Service также не обновляется из отдельной карточки.\n\n| Лист / поле | N | M → P; почему `unsupported` | Появление / назначение | Категория |\n|---|---:|---|---|---|\n| Offers / Provider | 30 | Anthropic → OpenAI по `offer-506`; у правильного `Research Key` в Production Anthropic. Сравнение чужого PK; провайдер общего Service не синхронизируется. | 25–27.09, импорт/дополнения master и v015-релизы; значение уже на сайте. | PK-артефакт |\n| Offers / Research Key | 46 | Ключ Claude Haiku → ключ GPT-5.6 Luna по `offer-506`; ключ master найден под иным Production PK. Поле идентичности не переписывается. | 25–27.09, Local import / v015; уже есть. | PK-артефакт |\n| Offers / Service | 31 | Anthropic API → OpenAI API по тому же PK; правильный сервис есть под иным PK. Общий сервис не переписывается. | 25–27.09, Local import / v015; уже есть. | PK-артефакт |\n| Offers / Service Kind | 4 | `web` → `api` на чужом PK; правильный вид сервиса есть под иным PK. | 25–27.09, Local import / v015; уже есть. | PK-артефакт |\n| Offers / Service URL | 42 | Anthropic deprecations URL → OpenAI GPT-5.6 Luna URL на чужом PK; правильная строка найдена под другим PK. Общий URL сервиса не синхронизируется. | 25–27.09, Local import / v015; уже есть. | PK-артефакт |\n| Origins / Country | 53 | `CN` Tencent → `US` xAI у `origin-135`; `(модель, страна)` master уже есть под иным PK. Изменение существующей связи не поддержано. | 25.09 массовый import; 26–27.09 v015 страны и релизы; уже есть. | PK-артефакт |\n| Origins / Position | 4 | Порядок `1` → `0` у чужого PK; та же связь и Position найдены под иным PK. | 25–27.09, импорт/страны v015; уже есть. | PK-артефакт |\n| Origins / Record ID | 91 | `hy-motion-10…` → `grok-46…` у `origin-135`; правильный владелец есть под иным PK. | 25–27.09, импорт/страны v015; уже есть. | PK-артефакт |\n| Origins / Source URL | 55 | Tencent about → xAI company по чужому PK; источник правильной связи найден под иным PK. | 25–27.09, импорт/страны v015; уже есть. | PK-артефакт |\n| Tool Platforms / Platform | 164 | `web` → `ide` по `platform-14`; `(tool, platform)` уже есть под иным PK. Sync добавляет отсутствующие платформы, не заменяет существующие. | 25.09 импорт 224 связей; 26–27.09 ещё 19 по Changelog; уже есть. | PK-артефакт |\n| Tool Platforms / Record ID | 217 | Codex → Claude по `platform-15`; правильная связь есть под иным PK. | 25–27.09, импорт/дополнения; уже есть. | PK-артефакт |\n| Tool Platforms / Source URL | 217 | Codex pricing → Claude pricing по чужому PK; правильный URL связи есть под иным PK. | 25–27.09, импорт/дополнения; уже есть. | PK-артефакт |\n| Access / Service URL | 11 | Специфичная страница модели/API → общий URL сервиса (например, Llama-2-7b HF → Meta Llama); общий Service используется другими Access, поэтому sync не меняет его URL. | 25.09 Changelog `BATCH-002/049/064/068/069`; вероятно полезные более точные ссылки, нужна адресная проверка. | Полезное |\n| Access / Source URL | 46 | Специфичная страница-доказательство → общий профиль/страница в Production. Sync не переносит служебную ссылку Access. | 25.09; 42 прямых записи BATCH в Changelog, 4 без индивидуальной записи; evidence остаётся в master. | Master research |\n| Offers / Billing Unit | 46 | Например `USD / 1M tokens` → пусто. При стандартной `Unit` sync намеренно оставляет пусто: строка master справочная, сайт локализует стандартную единицу и сохраняет сравнение цен. | 25.09; 44 записи BATCH в Changelog, 2 без индивидуальной записи. | Master research |\n| Offers / new row | 1 | MiniMax Speech Recognition `$0.38/hour` есть только в master, в Production нет; `Research Key` пуст, ISO-валюта не подтверждена. Sync не создаёт строку без ключа. | 25.09 `BATCH-007`, явная Changelog row; исследовательский кандидат, до проверки на сайт не переносить. | Master research |\n| Evaluations / Source Model | 1 | `DeepSeek V4 Pro 0813` → `deepseek-v4-pro`, `evaluation-867`; обе версии строки `Public=NO`. Sync существующей оценки меняет только `Public`. | 27–28.09 evaluation audit stage 2, `tools/master_eval_audit_2026_09_27_stage2.py`; исправление идентичности скрытого округлённого дубля `evaluation-816`. | Устаревшее/дубль |\n| Models / Source Title | 2 | Для Qwen3Guard 4B/8B master ставит индивидуальные заголовки, Production показывает общий Source с заголовком 0.6B; URL источника у всех один. Sync не меняет общий Source title. | 27.09 пакет 325/147 создал три версии; индивидуального Changelog поля нет. Нужен выбор общего заголовка или отдельных источников. | Неясное |\n| Tools / Source Title | 2 | Antigravity CLI: title статьи → `Gemini CLI`; Semantic Kernel: README title → `Semantic Kernel`; URLs совпадают. Sync не меняет общий Source title. | 25.09 Changelog `BATCH-001`; потенциально более точная подпись источника. | Полезное |\n| Tools / Supported Models | 4 | Например GitHub Copilot: список моделей → пусто; три других значения — `Customer-selected model`, `Qwen mobile-optimized models`, список Yandex. Sync не переносит связь tool↔model. | 25–26.09 master/v015; отдельный Changelog только для Copilot 26.09. Часть значений свободный текст, требуется проверка точной модели/даты. | Неясное |\n\n## Происхождение, предшествующие задачи и следующий шаг\n\nChangelog фиксирует массовый `import from Local` 25.09 (555 Offers, 812 Origins и 224 Tool Platforms по исходному состоянию); последующие строки и `docs/history/2026-09-26-catalog-master-v013.md`, `2026-09-26-catalog-master-v015.md`, `2026-09-27-catalog-master-v015-final.md` связывают изменения с редакционными BATCH, `tools/master_editorial_2026_09_26.py`, `tools/master_v015_import_2026_09_26.py` и `tools/master_v015_final_2026_09_27.py`. Production пакет 325/147, commit `9ddba83` (Git author `Dimon_pro`, 27.09), документированно сверял содержание при **игнорировании технических PK**. Поэтому точный момент первого расхождения каждого числового PK из Changelog не восстанавливается; 954 подтверждены сравнением содержания на текущем снимке. Git author удостоверяет commit, но не личность исполнителя каждого BATCH: она в Changelog не указана. Evaluation stage 2 документирован отдельно.\n\nРанее была **частичная задача**: v013 (26.09) классифицировал тогдашние 124 предупреждения и отложил 30 публичных; v015 расширил поддержку новых строк; Release #012 (28.09) зафиксировал 1 067 и потребовал отдельный scoped plan. **Отдельной утверждённой задачи/решения на обработку всех 1 067 до этого аудита не найдено.** Текущая карточка `UNSUPPORTED-MASTER-PROD-AUDIT-2026-09-28` создана отдельно, без Release #, переведена в `review`, не `done`.\n\nИтог по **предупреждениям-полям**, без пересечения: вероятно полезные для сайта **13** (11 URL доступа, 2 заголовка источника Tool); явно Master-only/research **93** (46 доказательств доступа, 46 справочных единиц цены, 1 неподтверждённая цена); ошибочные сравнения/скрытый дубль **955** (954 PK-артефакта, 1 скрытая оценка); пока неясные **6** (2 общих заголовка Qwen, 4 свободных Supported Models). Следующий шаг — отдельно проверить 13 кандидатов и 6 неясных по источникам и публичному UI, затем рассмотреть исправление диагностики сопоставлением естественных ключей; никакие данные этим аудитом не менялись.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-28-language-switch\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Переключение 22 языков / Language switching<\/p><pre># Language switching across 22 locales — Local bugfix #014\n\nRelease #014 / v0.13.1. The owner reported that selecting Español on Production did not work correctly. This report separates the reproduced fault from menu paths that currently pass. The authorized #014 Production release subsequently passed Public QA and is recorded in `docs/history/2026-09-29-language-switch-release.md`; the pre-release checkpoints below are retained as historical evidence.\n\n## Owner acceptance and release authorization — 2026-09-29\n\nThe owner accepted the running Local at `127.0.0.1:18810`, the fresh 44/44\nlocale roots and 44/44 representative panels, 1,936 canonical server-rendered\nlanguage links, the full Django suite, and the earlier 88/88 browser menu matrix.\nThe loopback browser-tool policy is explicitly waived as a gate for this exact\nrelease. The owner authorized Production deployment of #014 / v0.13.1 from\nverified code baseline `77e7f53cd8aa621b392d52d5b5ae8851ab77456c` under\n`docs/RELEASE.md`. Performance work #015 remains separate.\n\nThe first isolated archive suite exposed a stale Timeline test that still\nexpected `owner_approved=false`. The archived runtime code was unaffected. The\nregression now validates the approved `review` state and the later verified\n`done` state; the candidate is rebuilt from the same base commit and must pass\nthe complete isolated suite before any server release trial.\n\n## Local availability correction, 2026-09-29\n\nThe first handoff failed owner visual acceptance: the advertised\n`http://127.0.0.1:18810/es/` returned `ERR_CONNECTION_REFUSED`. There was no\nlistener on port 18810 and the Local PID file named an absent process (`37480`).\nThe canonical `start-local.ps1` starts Waitress as a child and waits for it;\nthe earlier launch was tied to a temporary command session. That is the\nlikely lifecycle mechanism, though the old process&#x27;s exact exit event was not\nlogged. The direct cause of the refusal was the absent Local listener.\n\nThe same canonical launcher was started as a detached, hidden Local process.\nAfter the performance work was isolated to a separate #015 branch, the clean\n`main` code for #014 was restored and only AIpediya Local was restarted. The\nnew Waitress PID `32860` listened on **127.0.0.1:18810** after the start\ncommand returned. `/healthz`, `/`, `/es/`, `/ru/`, `/tools/`, and `/es/tools/`\nall returned HTTP 200. No SQLite copy or production change was made.\n\nThe owner confirmed that, after the first recovery, ES/RU pages opened in an\nordinary browser and the menu switch to Español worked from RU/EN and an open\nModel without losing the panel. A renewed owner check of the final clean #014\nLocal is pending. Codex&#x27;s browser-control tool refused loopback access under\nits security policy and explicitly prohibited an alternate browser route, so\nthe original 88/88 browser pass on #014 is preserved as earlier evidence but\nwas not rerun after this launcher recovery. The fix code itself did not change.\n\nProduction read-only preflight still showed #013. The owner has conditionally\nauthorized deployment of exactly #014 after Local is verified; Timeline owner\napproval, release archive, tag, deploy and public QA remain pending. The\nmeasured performance change lives only on `codex/aipedia-performance-015` and\nis outside this release.\n\n## Code-only release gate after Local recovery\n\n### Independent Local recheck after the owner requested self-verification\n\nThe browser-control tool rejected the existing Local tab again with its URL\npolicy, despite the `http://` URL, and explicitly disallowed alternate browser\nsurfaces or indirect browser commands. No fresh browser click is claimed. A\nnew, independent read-only check against the running Waitress service passed\n44/44 Models/Tools locale roots and 44/44 representative Model/Tool panel URLs.\nFor each response it checked final URL without redirect, HTTP 200, matching\n`&lt;html lang&gt;` and `dir`, visible table rows or an open panel with the same slug,\nand every language-menu link. Across those 88 responses, 1,936 menu `href`s\nmatched the canonical locale paths, with zero failures. The dedicated Django\nlanguage-switch tests passed 3/3. Local still listened on `127.0.0.1:18810`\nafter the commands. This covers live HTTP/SSR and server-rendered menu links;\nthe earlier 88/88 browser report remains the JS and click evidence from before\nthe Local launcher outage.\n\nThe release-tool review found that `tools/server.py` still defaulted to a\ncatalog plan from an earlier release, while server trial preflight accepted\nonly release sequences 12 and 13. A code-only #014 archive would have selected\nthe wrong data plan or failed before deployment. The wrapper now omits\n`--catalog-plan` unless requested explicitly, and the preflight treats #014 as\ncode-only. It runs check/migrate and publication-state dry-run on an online\nProduction backup and compares a deterministic SHA-256 of every `catalog_*`\ntable before and after the trial. This preparation does not write the live\nProduction database. Regression tests reject an implicit catalog plan and a\nchanged translation row. `manage.py test catalog` passed 332 tests with one\nWindows skip; Local GSD passed 33/33; Local SQLite integrity/FK and 325/147\ncounts were confirmed. The release gate remains closed pending the owner&#x27;s\nfinal visual check and the browser-control policy limitation noted above.\n\n## Public browser diagnosis before the fix\n\nChromium navigated by clicking rendered language controls, with JavaScript enabled. The standard expanded menu was opened and the Español item clicked from the English Models root, Tools root, and open Model/Tool panels. The resulting paths were `/es/`, `/es/tools/`, `/es/models/&lt;same slug&gt;` and `/es/tools/&lt;same slug&gt;` respectively. All returned HTTP 200, with no redirects, visible rows/panels, functioning JavaScript, zero console errors and zero critical failed requests. A separate click sweep passed Models and Tools roots for all 22 locales (44/44). The precise owner-observed menu failure has therefore not been reproduced in these states; the original browser URL and symptom are still useful to narrow it further.\n\nFor the direct Español menu click from `https://aipediya.com/`: the rendered `href` was `/es/`, the final URL was `https://aipediya.com/es/`, HTTP 200 with an empty redirect chain. The loaded document had `&lt;html lang=&quot;es&quot; dir=&quot;ltr&quot;&gt;`, 150 table rows and working card/theme JavaScript; console errors and failed network requests were both zero. From `https://aipediya.com/tools/`, the rendered `href` was `/es/tools/`, the final URL matched, HTTP 200, 147 rows and a working Tool panel. A few Cloudflare RUM requests were aborted by rapid test navigation in the multi-page pass; these were not critical application requests.\n\nThe normal expanded-menu click was also repeated at 375 px from `https://aipediya.com/models/longcat-2-5-preview`: `href=/es/models/longcat-2-5-preview`, final URL identical, HTTP 200, `&lt;html lang=&quot;es&quot; dir=&quot;ltr&quot;&gt;`, 150 rows, panel open, zero console errors and critical failed requests.\n\nA related user-visible fault **was** reproduced on Production when `aipedia_lang=es` was already saved. From `https://aipediya.com/`, opening `longcat-2-5-preview` changed the address through History API:\n\n| Field | Observed value |\n| --- | --- |\n| URL before language click | `https://aipediya.com/models/longcat-2-5-preview` |\n| Español in expanded menu | `/es/models/longcat-2-5-preview` |\n| Prominent saved-language link beside menu | `/es/` |\n| URL after clicking saved-language link | `https://aipediya.com/es/` |\n| HTTP / redirect chain | `200` / none |\n| Console errors / critical failed requests | `0` / `0` |\n| Loaded HTML / table | `&lt;html lang=&quot;es&quot;&gt;`, 150 rows, panel closed |\n| JavaScript | loaded and operational; wrong destination lost the open card |\n\nThe stale link was created once by `offerSavedLanguage()` and lay outside the `a[data-set-lang]` set updated by `syncLanguageLinks()` after `history.pushState`/`replaceState` and Back/Forward. The repair makes that same synchronization update the saved-language link from its corresponding menu target. It applies to every supported locale, with no Spanish branch or URL/translation contract change.\n\nThe new permanent browser test was run read-only against the unchanged Production #013 at 375 px with `es`: both baseline cases failed at exactly this check. Models: saved link `/es/` versus menu `/es/models/longcat-2-5-preview`; Tools: saved link `/es/tools/` versus menu `/es/tools/alice-ai-pro-business`. Evidence: `artifacts/locale-switch-production-es-baseline.json` (Local artifact). The same check passes against the repaired Local build.\n\n## Local verification\n\n- Permanent Django regression: all 22 explicit codes, Models and Tools roots, rendered `lang`/`dir` and rows, 22 generated menu links per page, final 200 for representative links, Model/Tool card preservation, UX query retention and dropping `lang`, `kind`, `partial`.\n- Permanent Playwright regression: actual menu clicks and saved-language link synchronization, 22 locales, Models/Tools, desktop 1440 px and mobile 375 px, open/close/history/search/filter/sort/theme/RTL and model infinite loading. Report: `artifacts/locale-switch-*.json` (Local, ignored by Git).\n- `manage.py test catalog`: 330 OK, one Windows skip. `gsd_public_check --local`: 33/33 PASS. JavaScript syntax and `git diff --check`: PASS.\n- The repaired saved-language link was clicked in Local Chromium at 375 px from `/models/longcat-2-5-preview`: both menu and saved link had `/es/models/longcat-2-5-preview`; final HTTP 200, Spanish document, panel open, zero console errors and failed requests.\n- Read-only Production baseline `gsd_production_qa` for the unchanged #013: 1657/1657 PASS (`artifacts/locale-switch-production-baseline-gsd.json`). This checks the published baseline, not the new Local code.\n- Full Local browser matrix: **88/88 PASS** (22 locales × Models/Tools × 1440/375 px). The combined report `artifacts/locale-switch-local-22.json` records 1,712 interaction checks, 264 actual menu navigations, 0 redirects, 0 non-200 menu responses, 0 console errors, 0 failed requests and 0 HTTP errors. Every locale passed root rendering, Model/Tool panels, X/Escape/outside closing, Back/Forward, search, active filter, sort, light/dark and switching to English and back. Models loaded further rows; Tools had all 147 rows in the initial page. `ar` and `fa` passed RTL direction and page-overflow checks on both viewports. Local visual acceptance by owner: pending. Production release: not authorized.\n- Visual screenshots inspected in Local: Spanish Models at 1440 px, Spanish Tool panel at 375 px, Arabic Model panel at 375 px and Persian Tool panel at 1440 px (`artifacts/locale-switch-visual/`). The table, panel and controls are visible without page overflow. This is executor QA; owner visual acceptance remains pending.\n- The running Local Waitress process was restarted through the project Local stop/start scripts after Python history changes. `prepare_local_catalog.py` kept the existing SQLite, no migrations applied, and `/ru/history/` showed #014 in review with its source report returning 200. Post-restart Español Models and Tools browser cases at 375 px: 2/2 PASS, zero console errors and failed requests (`artifacts/locale-switch-post-restart-es.json`).\n- The verified Local code and regression tests were committed as `5ba0a4e` and pushed to `origin/main`. This GitHub state is code storage, not a Production deployment. The #014 release tag is reserved in Timeline but not created before owner approval.\n\n## Handoff\n\nInspect Local Español and other locales from the ordinary language menu and the saved-language link after opening a card. If the original menu symptom persists in a particular browser or page, provide the initial URL, final URL, and visible error; this will be checked against the saved browser report. After owner visual acceptance, Production requires a separate instruction for Release #014 under `docs/RELEASE.md`.\n<\/pre><\/article><\/template>";
 const safeGet=(key,fallback)=>{try{return localStorage.getItem(key)||fallback}catch(_){return fallback}};
 const safeSet=(key,value)=>{try{localStorage.setItem(key,value)}catch(_){}};
 function activate(edition){
  const selected=edition==='en'?'en':'ru';
  document.documentElement.lang=selected;document.documentElement.dir='ltr';
  document.title=selected==='en'?'AIpediya history':'История AIpediya';
  root.replaceChildren(document.getElementById(`edition-${selected}`).content.cloneNode(true));
  root.insertAdjacentHTML('beforeend',sourceMarkup);
  root.querySelectorAll('a[data-history-source]').forEach(a=>a.addEventListener('click',event=>event.preventDefault()));
  const theme=safeGet('aipedia-history-theme','dark');document.documentElement.dataset.theme=theme==='light'?'light':'dark';
  const button=root.querySelector('#theme');
  const updateThemeLabel=()=>{const dark=document.documentElement.dataset.theme==='dark';button.querySelector('.ph-theme-label').textContent=dark?button.dataset.lightLabel:button.dataset.darkLabel;button.querySelector('.ph-theme-icon').textContent=dark?'☀':'☾';button.setAttribute('aria-pressed',String(!dark));button.setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему')};
  updateThemeLabel();button.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;safeSet('aipedia-history-theme',next);updateThemeLabel()});
  root.querySelector('#edition-toggle').addEventListener('click',()=>{safeSet('aipedia-history-edition',selected==='ru'?'en':'ru');activate(selected==='ru'?'en':'ru')});
  if(window.initAipediaProductHistory)window.initAipediaProductHistory(root);
 }
 activate(safeGet('aipedia-history-edition','ru'));
})();
