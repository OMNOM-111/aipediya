 этого файла только Git-коммит (поле `production_commit_from_docs` в\n  `AI_CONTEXT/MANIFEST.json`); release_id опубликованного пакета он не извлекает и\n  живой `/healthz` не запрашивает. Фактический выпуск сверять по release_id выше и\n  `/healthz`. Запрос исполнителю сборщика — `docs/EXECUTION_STATE.md`, блок v014.\nПредыдущий: commit `634778807b2e82ca52dea1de150ea0810950d644`\n(tag `release-2026-09-25-deploy-dispatch-lock`, 2026-09-25 22:54Z; отчёт —\n`docs/history/2026-09-25-naver-indexnow-activation.md`). Перед ним в тот же день:\n`386d4aaafd00` (`release-2026-09-25-indexnow-root-key`),\n`160be0f37037` (`release-2026-09-25-naver-verification`) и `ba93f7ddf690`\n(`release-2026-09-25-gsd-1-0`, отчёт `docs/history/2026-09-25-gsd-1-0-release.md`).\nПозднее код этой ветки публикуется только по отдельной команде владельца.\n\n`release-2026-09-25-naver-verification` (`160be0f37037`, meta-tag Naver) и\n`release-2026-09-25-indexnow-root-key` (`386d4aaafd00`, ключ IndexNow в корне сайта)\nвыпущены 2026-09-25 по команде владельца.\n\nGSD-1.0 выпущен (scope, зависимости и откат: `docs/history/GSD-1.0-release-scope.md`).\nПроверка после выпуска: `tools/gsd_production_qa.py https://aipediya.com --commit &lt;sha&gt;`\nи `tools/gsd_public_check.py https://aipediya.com` (старый `public_acceptance.mjs`\nпроверяет прежний `?lang=`-контракт).\n\n## Процесс выпуска (подтверждено владельцем 2026-09-25)\n\nDevelop on Local → QA Local → владелец утверждает выпуск → Production\nприводится к **утверждённому Local-состоянию** → выпуск получает commit, tag и\nchangelog.\n\n- Утверждение владельцем относится ко всему проверенному Local-состоянию:\n  что публично, скрыто, отсортировано, переведено и как отображается.\n  Отдельные внутренние изменения, уже входящие в это состояние, повторно не\n  согласуются.\n- Local SQLite на сервер **никогда** не копируется. Код переносится архивом,\n  схема — `migrate` существующей серверной БД, а публикационное состояние\n  (какие Models/Tools публичны, их постоянные номера) — манифестом\n  `data/release_state.json` из того же commit:\n  `manage.py sync_publication_state export data/release_state.json --release &lt;tag&gt;`\n  на Local, затем `deploy_code_release.py … --publication-state data/release_state.json`\n  на сервере. Шаг идёт после `migrate`, пока `aipedia` остановлена; меняет только\n  `published` через `save()` с записью `sync_release_state` в журнал; при любом\n  расхождении номера/slug ничего не пишет, и deploy откатывается к backup.\n- Перед выпуском: полный набор тестов PASS, Local QA PASS; после — public\n  HTTPS QA. Tag вида `release-YYYY-MM-DD-&lt;name&gt;`, changelog — ниже и в\n  `docs/history/`.\n\n## Changelog\n\n### release-2026-09-28-eval-evidence — Evaluation Evidence #012\n\n- 325/325 опубликованных Models получили статус оценок; публичные независимые\n  проверки есть у 159, любые проверенные численные результаты — у 280.\n- Во вкладке «Проверки» результаты разработчика явно отделены от независимых;\n  research-only баллы не раскрываются, MTEB свёрнут до трёх строк с раскрытием.\n- Production-план добавил 4 104 Evaluation, изменил видимость 16 существующих;\n  связанные Source +563, Benchmark +947. Models, Tools, Offers, Access,\n  номера, даты, цены и публикационное состояние не менялись.\n- Local и распакованный архив: 315 тестов OK (1 skip); серверный trial и\n  `verify-release` PASS; полный Public QA 1657/1657 и 34/34 PASS.\n\n### release-2026-09-27-tools-chronology-csp — Tools chronology и Cloudflare CSP\n\n- Утверждённый план изменил только 27 дат Tools и 140 Public Numbers; 143\n  опубликованных Tools имеют номера 1–143, 60 exact и 83 approximate дат.\n- Узкий CSP разрешил обычный и версионный Cloudflare beacon и same-origin RUM;\n  браузер Production получил beacon 200 и `/cdn-cgi/rum` 204.\n- Models, цены, оценки, описания и publication state не изменились.\n- Канонический серверный доступ через `python tools/server.py preflight` и\n  SSH alias `aipediya-prod` стандартизирован отдельно от состава опубликованного\n  архива; детали — `D-2026-09-27-canonical-production-server-access`.\n\n### release-2026-09-27-adaptive-ui — адаптивный интерфейс\n\n- Телефон: строки Models и Tools — карточки; панель записи — экран под шапкой (меню языка,\n  поиск и тема доступны); Фильтр и Сортировка — нижние sheet-окна; без горизонтальной\n  прокрутки страницы с 320 px.\n- Планшет и небольшой ноутбук: второстепенные колонки сворачиваются по ширине каталога,\n  панель — drawer под шапкой; desktop от 1280 px — таблица и панель; ultrawide ограничен\n  `max(2400px, 60vw)`.\n- Исправлено: подгрузка на телефоне доходит до полного списка (была 200 из 321), меню языка\n  следует за открытой записью, «назад» сохраняет вкладку, документ app-shell больше не\n  растягивается скрытыми подписями цены.\n- Code-only: миграций и изменений данных нет; публикация 321 Models / 143 Tools без изменений.\n\n### release-2026-09-27-catalog-master-v015-final — финальная синхронизация v015\n\n- Счётчики: у каталога пояснено, сколько записей имеют № (подтверждённая дата) и\n  сколько без даты — Tools 143 = 116 с № + 27 без даты (раньше «116» из колонки №\n  читалось как количество).\n- Страны и флаги с источниками: 11 моделей и 15 инструментов; валюта цены\n  показывается по строке (₹, ₽, $), сравнения — только в USD.\n- +70 официальных цен (GPT-5.x, Gemini 3.1 Flash-Lite Image, Qwen3-Coder, Qwen3.8-LiveTranslate,\n  Kimi K2.6/K2.7 Code/K3, Solar Pro 2, Sarvam Vision 2.1, Speech TTS Live, SourceCraft с 01.10);\n  +19 способов доступа; +25 независимых результатов Epoch AI (Claude Opus 5.5, GPT-6 Sol,\n  Qwen3.8-Max, Qwen3.8 Max (0902), DeepSeek V4 Flash 0731); 9 проверенных пробелов оценок.\n- Постоянная release-QA `catalog_master qa` (`D-2026-09-27-release-qa-gate`).\n  Даты выпуска и номера моделей не изменялись; 321 Models / 143 Tools. Миграций нет.\n\n### release-2026-09-26-catalog-master-v015 — новые модели 22–24 сентября\n\n- 11 новых моделей с ценами, доступом, датами и переводами на 22 языка: Claude Opus 5.5,\n  GPT-6 Sol, GPT-6 Luna, Gemini 3.8 Flash TTS, Gemini 3.8 Flash-Lite TTS, Nemotron 3\n  Diarization, Speech TTS Live, Sarvam Vision 2.1, GLiNER2.5-Decide, FLUX 3 Action DROID,\n  FLUX 3 Action SO-101 — номера 311–321 по подтверждённой дате выпуска; 1–310 без изменений.\n- 4 новых инструмента (Alice AI Pro for Business, Qwen Intelligence, Yandex AI Studio,\n  SourceCraft); 18 инструментов получили новый хронологический номер.\n- Исправлены категория/задачи 9 моделей (GPT-5.6, GPT-6 Astra, Claude 5-серия,\n  Claude Haiku 4.5 — контекст 200K); записи NEEDS_REVIEW не публикуются.\n- Публично 321 Models / 143 Tools (было 310 / 139). Миграций нет.\n\n### release-2026-09-26-search-visibility-optimization-v2 — Search Visibility Optimization\n\n- 45 известных Google Search Console старых URL: 25 одношаговых 301 на чистые\n  карточки, 19 корректных 404 для снятых сущностей, один технический ответ\n  `200` с `X-Robots-Tag: noindex`. Исключения robots конечны и точны; широкие\n  разрешения `?page=` на карточках удалены.\n- Убраны параметрические ссылки на карточки из SSR-строк каталога; сохранён\n  возврат к странице пагинации в интерфейсе. Две конечные EN/RU страницы\n  сравнения контекста и официальных API-цен используют только проверенные данные.\n- IndexNow-диспетчер принимает 301/302 для уведомлений о старых URL. После\n  выпуска штатный scheduler обработал 334 точечных уведомления (330 старых\n  redirect URL и четыре новые страницы); принятие не означает индексацию.\n- Local: 268 тестов (267 PASS, один ожидаемый skip), `seo_report` без проблем.\n  Production: 45/45 старых URL и 1657/1657 проверок публичного Search QA PASS.\n\n\n### release-2026-09-26-catalog-master-v014 — единая база каталога\n\n- Публично 310 моделей и 139 инструментов (было 304 / 138): 21 проверенное\n  дополнение (Gemma 1–3, SAM / SAM 2 / 2.1, Whisper large-v3-turbo, Janus-серия,\n  AlphaFold 3, MusicGen, AudioGen, ComfyUI, Google AI Studio), GPT-Live 1 в Models.\n- Скрыты 14 дублей той же модели с 301 на основную карточку (датированные ID\n  Claude, FLUX1.1 pro Raw, Nemotron 3 Super BF16); ошибочная карточка GPT-Live 1 в\n  Tools заменена 301 на модель.\n- Номера — хронологическая позиция публичной записи; порядок по номеру и по дате\n  строго монотонен в обе стороны (исправлен разворот записей одной даты).\n- Альтернативные названия находятся поиском; уточнены даты, лицензии, описания\n  30 инструментов, источники, платформы; 11 оценок Artificial Analysis скрыты до\n  подтверждения права показа.\n- Миграция `0019_catalog_master_aliases` (поля `aliases`, `redirect_to`).\n\n### release-2026-09-25-gsd-1-0 — «Глобальная поисковая доступность» (GSD-1.0)\n\n- Постоянные адреса на каждом из 22 языков (`/ru/…`, `/zh-hans/…`; английский на\n  корне); старые ссылки `?lang=` ведут на ту же страницу одним 301.\n- Карточки моделей и инструментов полностью доступны без JavaScript, с источниками\n  и датами проверки.\n- Локализованные заголовки и описания, взаимные hreflang, sitemap index и карта\n  сайта на каждый язык; фильтры и сортировки не индексируются.\n- Страница «Источники и методика», 10 тематических подборок (9 индексируются).\n- Открытые наборы данных подготовлены, но на Production выключены до решения о\n  лицензии (`AIPEDIA_DATASETS_PUBLIC=0`).\n- Журнал изменений для IndexNow (отправка выключена до ключа владельца).\n- В составе утверждённого Local-состояния: код catalog master и страница\n  «История сайта» (только Local; на Production — 404).\n- Публикационное состояние не меняется: 304 Models / 138 Tools; миграция\n  `0018_discovery_outbox` добавляет одну пустую таблицу.\n\n### release-2026-09-25-local-approved\n\n- Полная локализация интерфейса и каталога на 22 языка.\n- Корректный публичный счётчик каталога.\n- Проверенный набор из 304 публичных Models (Tools — 138).\n- Сортировка по умолчанию newest → oldest для Models и Tools.\n- Фильтры, поиск, клик по строке и правая панель (Escape / X / клик вне).\n- Улучшения responsive/mobile и RTL (ar, fa).\n- 459 внутренних research-моделей сохранены в базе вне публичного каталога\n  (без удаления данных, переводов и истории; постоянные номера 305–763 внутренние).\n\n## Общая серверная машина и SSH\n\n### Server access — единая точка входа\n\nВ начале server phase выполнить **`python tools/server.py preflight`**. При\n`SERVER ACCESS = PASS` использовать тот же wrapper для `health`, `status`,\n`upload &lt;archive&gt; --sha256 &lt;digest&gt;`, `release-preflight &lt;archive&gt; --sha256\n&lt;digest&gt; [--catalog-plan ... --publication-state ...]` и `deploy &lt;archive&gt;\n--sha256 &lt;digest&gt; [--catalog-plan ... --publication-state ...]`. `deploy` требует\nуспешный matching `release-preflight` report; `--dry-run` доступен отдельно.\nПосле выпуска `catalog` проверяет живые счётчики/целостность, а\n`verify-release &lt;aipedia-before-code-...sqlite3&gt;` сравнивает фактические данные\nс online backup до выпуска.\nДля code-only #014 `--catalog-plan` не передавать: серверный trial проверяет\nSHA-256 всех `catalog_*` таблиц до и после миграции на online backup, а\n`sync_publication_state apply` выполняется только в dry-run и должен показать\n0 изменений Models/Tools. План каталога указывается явно лишь для выпуска\nданных; wrapper не выбирает план прошлого выпуска по умолчанию.\nАрхив передаётся только в `/tmp/aipedia-*`, SHA-256 сверяется автоматически.\nНе собирать SSH/SCP-команду вручную и не искать credentials заново.\n\nНа этой Windows-машине пользовательский `~/.ssh/config` содержит alias\n`aipediya-prod`: `HostName ssh-canary.stratforges.com`, `User stratforge`,\n`IdentityFile ~/.ssh/codex_stratforge_stage9`, `IdentitiesOnly yes`,\n`ProxyCommand &quot;C:\\Program Files (x86)\\cloudflared\\cloudflared.exe&quot; access ssh\n--hostname %h`, `UserKnownHostsFile ~/.ssh/known_hosts`,\n`StrictHostKeyChecking yes`, `BatchMode yes`, `ConnectTimeout 20`. Это только\nпараметры транспорта, без содержимого ключа/секретов. Если alias отсутствует\nна новом компьютере, настроить его из этого контракта и проверить `ssh -G\naipediya-prod`; если он есть, сначала проверить его и вывести конкретную\nошибку, не подбирать альтернативные ключи. Не ослаблять host-key verification.\n\nФизическая машина общая; project scope AIpediya: `/srv/aipedia`, его\nbackups/releases/SQLite, программа `aipedia` и `/tmp/aipedia-*`. StratForge,\nTradeForge, будущие проекты и общесистемный tunnel вне scope AIpediya. Для\nнового проекта нужен отдельный alias/root/service/DB/backup namespace/tooling,\nа не повторный поиск транспорта.\n\nCodex выполняет эти команды напрямую в рамках разрешённого выпуска. Claude Code\nиспользует **тот же** wrapper и alias: если Auto блокирует серверную команду,\nсообщить владельцу `Server access is configured. Claude Auto blocked execution.\nSwitch Claude Code to Manual/Ask and rerun the same server command.` После\nпереключения повторить ту же команду. Handoff Codex — запасной путь.\n\n### Executor preflight (обязательно перед первой серверной командой)\n\n1. Определить исполнителя серверной фазы.\n2. Исполнитель Claude Code:\n   - Local/release preparation (тесты, tag, архив, SHA-256, `--dry-run`, публичная\n     базовая линия) может выполняться в `Auto`;\n   - если Auto блокирует wrapper, владелец переводит сессию в Manual / Default / Ask\n     (режим с подтверждением команд); затем повторить ту же команду и выполнять\n     серверные команды только через подтверждение интерфейса;\n   - если режим изменить нельзя или владелец не хочет — **STOP SERVER PHASE** и\n     подготовить handoff для Codex (ниже).\n3. Исполнитель Codex — обычный порядок этого документа.\n\nБлокировку SSH в Claude Code `Auto` не считать доказательством отсутствия\nдоступа или неправильного сервера. Не искать альтернативные credentials, не\nчитать private key, не расширять permissions исполнителем, не повторять SSH\nмногократно (`D-2026-09-27-claude-server-permission-mode`, `AGENTS.md`).\n\nHandoff серверной фазы для Codex (Codex не повторяет завершённую и проверенную\nLocal-работу, а продолжает с этого состояния): project AIpediya; release commit;\nprevious Production commit; release tag; путь/имя готового архива и SHA-256;\nрезультаты Local tests и тестов распакованного архива; результат `--dry-run`;\nProduction baseline (`/healthz`, штатные публичные проверки); требуемые server\npreflight checks; ограничения выпуска; ожидаемые counts Models/Tools и манифест\nпубликации; post-deploy QA; точный следующий шаг.\n\n### Граница и способ подключения\n\nAIpediya и StratForge размещены на одной серверной машине. Исполнителям\nAIpediya разрешено использовать существующий настроенный SSH-доступ к этой\nобщей машине для работ исключительно в контуре AIpediya. Запрет «не трогать\nStratForge» относится к файлам, данным, процессам, сервисам, туннелям,\nконфигурации и секретам StratForge, а не к самому факту SSH-подключения к общей\nмашине. Не читать, не копировать, не изменять и не раскрывать приватные\nSSH-ключи; разрешено использовать уже настроенную SSH identity для подключения\nк общей машине, если действия строго ограничены контуром AIpediya. После входа\nсначала read-only: hostname, пользователь, `/srv/aipedia`, состояние только\nпрограммы `aipedia`, текущий release (`/healthz`), серверный preflight.\nКаталоги StratForge не исследовать, его программы не трогать\n(`D-2026-09-26-shared-server-ssh`, `AGENTS.md`).\n\nКанонический способ подключения — `tools/server.py` и alias `aipediya-prod`\n(контракт выше). Проверка ключа сервера остаётся включённой. Каталоги AIpediya принадлежат пользователю `aipedia` —\nчтение и выпуск через `sudo -n` (без интерактива); выпускной скрипт запускается\n`sudo -n python3 …/tools/deploy_code_release.py`. Граница: `/srv/aipedia`, программа\n`aipedia` в `/srv/aipedia/supervisord.conf`, `/tmp/aipedia-*` для архивов и preflight.\nРазрешение среды (подтверждение команд в Claude Code) — отдельно от разрешения\nвладельца на выпуск; порядок — «Executor preflight» выше.\n\nСерверный preflight (перед боевым запуском, живую БД не меняет): онлайн-копия\n`/srv/aipedia/data/aipedia.sqlite3` в `/srv/aipedia/backups/aipedia-preflight-*.sqlite3`\n(sqlite backup API от `aipedia`), распаковка архива в `/tmp/aipedia-preflight-*`, на\nкопии `migrate` → `catalog_master apply-plan` (без `--apply`, затем с ним) →\n`import_translations` → `sync_publication_state apply` (dry-run) → повтор `apply-plan`.\n\n## Выпуск catalog-master-v014 (разрешён владельцем 2026-09-26)\n\nРазрешение: приёмка и разрешение владельца 2026-09-26\n(`D-2026-09-26-owner-acceptance-v014`) — кандидат `954db5a4586b` + исправление\nпорядка номеров + исправление классификации GPT-Live 1. Состав после выпуска:\n310 Models / 139 Tools (было 304 / 138). Отчёт —\n`docs/history/2026-09-26-catalog-master-v014-release.md`.\n\nДанные выпуска: `data/release/v014/catalog_plan.json`,\n`data/release/v014/translations.json`, `data/release_state.json`; список файлов\nкандидата — `data/release/v014/CANDIDATE_FILES.txt`. Архив собирается из\ncommit/tag выпуска обычной сборкой (`tools/build_code_release.py`); его\nсоответствие испытанному кандидату проверяется по манифестам (отличаются только\nдокументы), и распакованный архив проходит полный набор тестов заново.\n\nНа сервере (только контур AIpediya):\n1. read-only проверка (см. раздел выше) и `--dry-run`;\n2. `python3 tools/deploy_code_release.py &lt;archive&gt; --sha256 &lt;digest&gt; --catalog-plan data/release/v014/catalog_plan.json --translations data/release/v014/translations.json --publication-state data/release_state.json`.\n   Скрипт делает online-backup, `migrate`, `catalog_master apply-plan` (сначала\n   проверка всех ожидаемых старых значений по Record ID; любое несовпадение —\n   остановка и откат к backup, без принудительного применения и без\n   перестроения плана на сервере), `import_translations`,\n   `sync_publication_state` (контроль), переключение кода и проверку `/healthz`.\n3. Публичная проверка https://aipediya.com: версия, обе таблицы, порядок номеров\n   в обоих направлениях, подгрузка, фильтры, GPT-Live 1 в Models, 301 со старого\n   адреса Tools, поиск aliases, цены и единицы, sitemap (310/139), RU/EN.\n\nГраница проверки до выпуска: испытан исходный снимок Local, сверенный с\nпубличными данными Production построчно; не копия серверной БД — поэтому\nсерверный preflight обязателен.\n\nПредыдущий кандидат catalog-master-v013 (`954db5a4586b`) заменён этим выпуском и\nотдельно не публикуется.\n\n## Выпуск adaptive-ui\n\nСостав и проверки — `docs/history/2026-09-27-adaptive-ui-release.md`. Code-only: без\n`--catalog-plan`/`--translations`; `data/release_state.json` — контроль (0 изменений). Порядок:\nExecutor preflight (Claude Code — режим с подтверждением команд), read-only, preflight на\nонлайн-копии (migrate, integrity/foreign keys, `sync_publication_state apply` dry-run), серверный\n`--dry-run`, `deploy_code_release.py &lt;archive&gt; --sha256 &lt;digest&gt; --publication-state\ndata/release_state.json`; после — `final_check.py`, `gsd_production_qa --commit`,\n`gsd_public_check`, `catalog_master qa --production` и публичная responsive-проверка\n(`artifacts/adaptive-ui/qa-harness.mjs`, `qa-interactions.mjs`, обычный браузер).\n`tools/verify_isolated_release.py` — исторический инструмент выпуска 22.09, для текущих\nвыпусков не применяется и пересобирает архив по тому же пути.\n\n## Выпуск catalog-master-v015-final\n\nСостав и проверки — `docs/history/2026-09-27-catalog-master-v015-final.md`. Данные:\n`data/release/v015-final/catalog_plan.json` (план на исходном снимке Local, равном\nсостоянию Production после v015), `data/release_state.json`; переводы не требуются.\nПорядок на сервере — как для v015: read-only, preflight на онлайн-копии, `--dry-run`,\n`deploy_code_release.py &lt;archive&gt; --sha256 &lt;digest&gt; --catalog-plan\ndata/release/v015-final/catalog_plan.json --publication-state data/release_state.json`;\nпосле — `catalog_master qa --production` на Local и\n`artifacts/catalog-master-v015-final/final_check.py https://aipediya.com`.\n\n## Выпуск catalog-master-v015\n\nСостав и проверки — `docs/history/2026-09-26-catalog-master-v015.md`. Данные:\n`data/release/v015/catalog_plan.json`, `data/release/v015/translations.json`,\n`data/release_state.json` (321 / 143); список файлов — `data/release/v015/CANDIDATE_FILES.txt`.\nВетка `release/catalog-master-v015` продолжает опубликованную линию `0702405`\n(код `61adedd`), а не `main`. Порядок на сервере — как для v014: read-only проверка,\n`--dry-run`, затем `deploy_code_release.py &lt;archive&gt; --sha256 &lt;digest&gt; --catalog-plan\ndata/release/v015/catalog_plan.json --translations data/release/v015/translations.json\n--publication-state data/release_state.json`; публичная проверка —\n`artifacts/catalog-master-v015/v015_check.py https://aipediya.com`.\n\n## Reconciliation / cleanup #013 (`v0.13.0`)\n\nВладелец 28.09.2026 в поручении `закрыть все текущие хвосты` разрешил выпуск\nпроверенного Local-состояния этого этапа без повторного запроса. Точный состав и\nрешения: `docs/history/2026-09-28-reconciliation-cleanup.md`. План каталога —\n`data/release/reconciliation-20260928/catalog_plan.json` (11 Access URL, один Service provider,\nодна Benchmark category); публикационное состояние — `data/release_state.json`\nбез изменения числа записей (325 Models / 147 Tools). После Local gate: read-only\n`python tools/server.py preflight`, live baseline, `release-preflight` на online\nbackup, затем `deploy --dry-run`, `deploy` с этим планом и манифестом. После\nвыпуска: `/healthz`, `catalog`, `verify-release`, `catalog_master qa --production`,\npublic Checks и затронутые карточки, полный Public QA; только затем\n`finalize_release_history.py` и закрытие карточки. Local SQLite не передаётся.\n\n## Обязательный gate истории и версии\n\n**No Timeline → No Release.** Перед каждым новым пакетом зарезервировать\nследующий `Release #` и SemVer в `docs/timeline.json` без создания второй\nкарточки при переходе Local → Production. Состав изменений, итоговые счётчики,\nLocal QA, commit/build кандидата и source должны быть в карточке. Сначала\nперевести её в `review`, `local_verified=true`, показать владельцу\nпересобранный `timeline.html`; после отдельного решения владельца записать\n`owner_approved=true`. `current_local` указывает на кандидата,\n`current_production` остаётся на предыдущем подтверждённом выпуске.\n\nДля каждого следующего code release Local QA включает отдельный browser gate\nязыкового меню: `python tools/locale_switch_browser_qa.py --base http://127.0.0.1:18810`.\nОтчёт в `artifacts/locale-switch-browser-qa.json`\nдолжен иметь 88/88 PASS (22 локали × Models/Tools × desktop/375 px),\nнулевые ошибки консоли и критические failed requests. HTTP-проверка\n`gsd_production_qa` не заменяет этот интерактивный gate.\n\n```powershell\n.\\.venv\\Scripts\\python.exe tools/build_product_history.py\n.\\.venv\\Scripts\\python.exe tools/release_history.py --release-id &lt;release-id&gt; --html\n.\\.venv\\Scripts\\python.exe tools/build_code_release.py --release-id &lt;release-id&gt;\n```\n\nBuild gate и archive preflight проверяют версии и готовность карточки,\nотпечаток автономной истории, Local QA, approval и версию карточки.\nУ сборки нет режима обхода этого gate. Старые пакеты без метаданных версии\nновым серверным preflight отклоняются. Отменённые/superseded номера сохраняются\nв Timeline, следующий пакет получает следующий номер.\n\nПосле deploy и **успешных** `/healthz`, Production QA, сравнения БД и\nrelease report выполнить:\n\n```powershell\n.\\.venv\\Scripts\\python.exe tools/finalize_release_history.py --release-id &lt;release-id&gt; --commit &lt;healthz-commit&gt; --release-report docs/history/&lt;report&gt;.md --backup &lt;aipedia-before-code-...sqlite3&gt; --production-qa &lt;gsd-production-qa-report.json&gt;\n```\n\nКоманда сверяет публичный `/healthz`, помечает ту же карточку Production ✓,\nобновляет `current_production` и повторно собирает `timeline.html`. Пока это\nне выполнено и не проверено, выпуск не закрыт. Production HTML и SQLite\nисторией не заменяются; после закрытия фиксируются commit, tag и changelog\nпо обычному порядку этого документа.\n\n## Собрать архив кода\n\nИз корня проекта, на проверенном commit/tag:\n\n```powershell\n.\\.venv\\Scripts\\python.exe tools/build_code_release.py --release-id &lt;release-id&gt;\n```\n\nАрхив содержит только tracked Git-файлы. SQLite, `.env`, секреты, backups,\nartifacts и `.venv` туда не входят. Скрипт отказывается упаковывать базу.\n\n## Проверка на изолированной копии\n\nНе трогает `/srv/aipedia` и публичный сайт:\n\n```powershell\n.\\.venv\\Scripts\\python.exe tools/verify_isolated_release.py\n.\\.venv\\Scripts\\python.exe tools/deploy_code_release.py &lt;archive&gt; --sha256 &lt;digest&gt; --dry-run\n```\n\nСценарий копирует каталог во временный файл, применяет миграции, сверяет\nотпечаток карточек/цен/оценок и проверяет, что production-HTML не содержит\nгруппы Local/Production.\n\n## Публикация выбранной версии\n\nТолько на существующем хосте AIpedia, без изменения туннеля, секретов и StratForge.\n\n1. Зафиксировать commit/tag и прогнать `manage.py test catalog --settings=aipedia.test_settings`.\n2. Собрать архив `tools/build_code_release.py` и сохранить SHA256.\n3. Скопировать архив на сервер **без** Local SQLite.\n4. На сервере: `python3 tools/deploy_code_release.py /path/to/archive.zip --sha256 &lt;digest&gt; --publication-state data/release_state.json`\n   (сначала то же с `--dry-run`).\n5. Скрипт берёт блокировку `/srv/aipedia/data/indexnow-dispatch.lock` (плановая\n   отправка IndexNow `aipedia-indexnow` на это время пропускается; блокировка\n   снимается и после успеха, и после отката, и при аварийном завершении),\n   останавливает только программу `aipedia`, делает online-backup\n   `/srv/aipedia/data/aipedia.sqlite3`, переносит код и статику, выполняет\n   `migrate` существующей серверной БД, поднимает только `aipedia` и проверяет\n   `/healthz` на loopback.\n6. Он **никогда** не копирует локальную SQLite поверх серверной базы и не\n   удаляет `/srv/aipedia/data`, `/srv/aipedia/backups` и `/srv/aipedia/config`.\n\nПроверить манифест заранее на копии, приведённой к схеме Production:\n`manage.py sync_publication_state apply data/release_state.json` (dry-run) с\n`AIPEDIA_DB=&lt;копия&gt;`.\n\nНе использовать `tools/deploy_release.py` и `tools/deploy_chronology.py` для\nэтого изменения: они рассчитаны на прошлые выпуски с импортом источников /\nхронологии.\n\n## Откат кода\n\nЕсли приложение не успели запустить, `deploy_code_release.py` возвращает\nпредыдущий `/srv/aipedia/app` и восстанавливает БД из `aipedia-before-code-*.sqlite3`.\n\nЕсли приложение уже отвечало, база **не** откатывается автоматически — чтобы не\nстереть правки, сделанные после публикации. Откат кода: остановить только\n`aipedia`, вернуть предыдущий каталог приложения\n`/srv/aipedia/releases/before-code-*` на место `/srv/aipedia/app`, запустить\nтолько `aipedia`. Восстановление БД — отдельное решение владельца.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"search-discovery\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Поисковая доступность / Search discovery<\/p><pre># Search &amp; discovery contract (GSD-1.0)\n\nCanonical contract for how AIpediya is exposed to search engines and AI search.\nStatus of the version: `docs/timeline.json` (GSD-1.0), `docs/EXECUTION_STATE.md`,\nand `docs/RELEASE.md`. Decisions: `docs/DECISIONS.md`\n(`D-2026-09-25-locale-paths`, `D-2026-09-25-seo-readiness`,\n`D-2026-09-25-facets-pagination`, `D-2026-09-25-datasets-license-gate`,\n`D-2026-09-25-discovery-outbox`). GSD-1.0 was released on 2026-09-25. The\nSearch Visibility Optimization update follows that architecture; release state\nand public verification are recorded in `docs/RELEASE.md` and\n`docs/history/2026-09-26-search-visibility-release.md`.\nThe update was published on 2026-09-26 21:47 UTC at commit\n`61adedd6ea5e6a0955d51d87374fa2fa9bcc7799`; 45/45 legacy URLs and\n1657/1657 public Search checks passed. IndexNow accepted 334 targeted notices;\nsearch-engine recrawl, indexed-page counts and ranking growth remain unverified.\n\n## 1. Language URLs\n\n| Page | English (x-default) | Other locale (example `ru`, `zh-Hans`) |\n|---|---|---|\n| Models catalog | `/` | `/ru/`, `/zh-hans/` |\n| Tools catalog | `/tools/` | `/ru/tools/` |\n| Model card | `/models/&lt;record-id&gt;` | `/ru/models/&lt;record-id&gt;` |\n| Tool card | `/tools/&lt;record-id&gt;` | `/pt-br/tools/&lt;record-id&gt;` |\n| Methodology | `/methodology` | `/uk/methodology` |\n| Collections | `/collections/`, `/collections/&lt;slug&gt;` | `/ar/collections/&lt;slug&gt;` |\n| Open data | `/datasets/`, `/datasets/models`, `/datasets/tools` | `/ru/datasets/models` |\n| Privacy | `/privacy` | `/de/privacy` |\n| Context comparison | `/compare/model-context` | `/ru/compare/model-context` (EN/RU only) |\n| API token prices | `/api-pricing` | `/ru/api-pricing` (EN/RU only) |\n\n* Path codes are lower-case BCP-47 (`zh-hans`, `zh-hant`, `pt-br`); `hreflang` uses the\n  canonical tag (`zh-Hans`, `pt-BR`). One builder: `catalog/locale_urls.py`.\n* Language-neutral (never prefixed): `/robots.txt`, `/sitemap.xml`, `/sitemaps/&lt;code&gt;.xml`,\n  `/datasets/*.json|csv`, `/datasets/manifest.json`, `/indexnow/&lt;key&gt;.txt`, `/healthz`,\n  `/static/`, `/admin/`. `/&lt;locale&gt;/&lt;neutral endpoint&gt;` is 404.\n* The path alone decides the language. Cookie, Accept-Language, `CF-IPCountry` and the\n  User-Agent never change the language of a URL and never redirect. Responses do not vary\n  on Cookie/Accept-Language. A manual switcher choice is remembered only in the browser\n  (cookie written by `site.js`); on a page reached from outside the site in another\n  language, a small link offers the remembered language — never a redirect.\n* Historical GSD-1.0 redirect examples (the current full-card legacy redirect\n  strips presentation parameters; see the released P0 section below):\n\n| Old / non-canonical | New |\n|---|---|\n| `/?lang=ru` | `/ru/` |\n| `/?lang=en` | `/` |\n| `/?lang=ru&amp;kind=tool&amp;sort=name_asc` | `/ru/tools/?sort=name_asc` |\n| `/models/&lt;id&gt;?lang=de&amp;kind=model&amp;page=1&amp;tab=pricing` | `/de/models/&lt;id&gt;` |\n| `/tools/&lt;id&gt;?lang=zh-CN` | `/zh-hans/tools/&lt;id&gt;` |\n| `/privacy?lang=uk` | `/uk/privacy` |\n| `/zh-Hans/…`, `/pt_BR/…`, `/zh-cn/…`, `/pt/…` | `/zh-hans/…`, `/pt-br/…` |\n| `/en/…` | `/…` |\n| `/ru` | `/ru/` |\n| `/ru/?lang=de` (prefixed path + stray lang) | `/ru/` (path wins) |\n| `/?lang=zz` (unknown value) | `/` |\n| `/?page=1`, `/ru/?page=1` | `/`, `/ru/` |\n\n  On legacy full-card requests the presentation parameters (`page`, `sort`, `tab`,\n  `kind`, `lang`) are discarded in one 301 to the clean canonical card. A confirmed\n  hidden alias redirects directly to its published card. Listing filters and\n  pagination are retained for visitors but remain robots-blocked and noindex.\n  An old `partial=rows|panel` card request returns a fragment with `X-Robots-Tag:\n  noindex`, not a full-card redirect. Unknown or unpublished records answer **404** on every form of the\n  address (never a redirect to the home page). Region remaps to another language\n  (`/be/`, `/ca/`) are 404, not aliases.\n\n## 2. Publicity policy and readiness registry\n\n`catalog/readiness.py` is the only source for &quot;public&quot; and &quot;indexable&quot; used by pages,\nhreflang, sitemaps, collections, datasets and the IndexNow outbox.\n\n* Public = `published=True` (and `entry_type=&#x27;model&#x27;` for models). `published` is the\n  existing release contract synchronized from the catalog master through\n  `data/release_state.json`; the XLSX is never read at request time. Read-only check at\n  GSD baseline: manifest ↔ Local DB 0 mismatches (763 models / 138 tools).\n* Per entity × locale: `indexable` | `not-ready` | `not-public`, with a reason.\n  Primary text = `description` + (if an English source exists) `suitable`,\n  `limitations`. `en` needs the English text; `ru` needs the authored Russian text;\n  other locales need a `ContentTranslation` row whose `source_hash` matches the current\n  English source, state `current|reviewed`, and non-empty text in the field.\n* A field without English source is &quot;not applicable&quot;, never a missing translation.\n  Brands, IDs, URLs and numbers are not localized fields and do not count as fallback.\n* Secondary prose (origin, philosophy, evaluation-gap notes) may fall back to English;\n  it is marked `lang=&quot;en&quot;` in HTML and does **not** block indexing. The deferred\n  eval-gap translation (412,820 billable chars; previously recorded F0 shortfall 108,605\n  — historical, not a live quota check) therefore stays a separate item.\n* `not-ready` pages still render for people with `noindex,follow`, no canonical and no\n  alternates; they are excluded from sitemaps and from other pages&#x27; hreflang.\n* Registry export: `manage.py seo_report --registry-csv &lt;file&gt;`.\n\n## 3. Page signals\n\n* Localized `&lt;title&gt;` / meta description for catalogs, cards, collections, methodology\n  and datasets; one subject `&lt;h1&gt;` per page (catalog H1 is screen-reader visible; on a\n  card the card title is the only H1).\n* Self-canonical built from `AIPEDIA_PUBLIC_ORIGIN` (never the Host header); reciprocal\n  `hreflang` including self and `x-default` (= English, a 200 canonical page); only\n  indexable locales appear.\n* `html lang/dir` per locale (`ar`, `fa` are RTL).\n* JSON-LD: `Organization` (all pages), `BreadcrumbList` (cards, collections,\n  methodology, datasets — always paired with the same visible breadcrumb trail), `DataCatalog` (`/datasets/`), `Dataset` + `DataDownload`\n  (`/datasets/models|tools`). No ratings, reviews, prices, licenses or addresses are\n  asserted. Serialized with `&lt;`, `&gt;`, `&amp;` escaped.\n* Open Graph / Twitter card with `static/share-card.png` (1200×630, rendered from the\n  existing `brand.svg`) and `static/brand-512.png` as the Organization logo.\n\n## 4. Sitemaps\n\n`/sitemap.xml` is a sitemap index of `/sitemaps/&lt;locale&gt;.xml`. Each child lists every\nindexable URL of that locale with all its `xhtml:link` alternates + `x-default`, built\nfrom the registry (`catalog/seo.py:sitemap_urlsets`). `lastmod` = newest of the\neditorial check date, last publication change and (per locale) the last translation\nupdate; page views never change it. Limits checked by `seo_report`: ≤ 50,000 URLs and\n≤ 50 MB per file (Local 2026-09-25 after reconciliation: 10,035 `&lt;loc&gt;` in 22 files — cards 9,724 (models 6,688 + tools 3,036), ready collections 198 (9 × 22), collections index 22, models listing 22, tools listing 22, methodology 22, privacy 22, dataset pages 3 (English only; absent in Production while datasets are off); 230,742 alternate links; largest file ≈ 1.15 MB / 459 URLs). Plain `?page=N` listing pages are indexable but deliberately not in the sitemap (reached through `&lt;a href&gt;` pagination).\n\n## 5. Parameters, pagination and crawl\n\n| Parameter | Where | Crawl | Index |\n|---|---|---|---|\n| (path locale) | all | yes | per readiness |\n| `page=N` (N≥2, in range) | catalogs, collections | yes | yes, self-canonical, prev/next |\n| `page=1` | catalogs | — | 301 to clean URL |\n| `page` invalid / out of range | catalogs | — | 404 |\n| `tab` on a card; `page` + anything on a card | cards | robots-blocked unless an exact GSC migration exception | legacy `?lang=` full cards: one 301 to clean card; other duplicates: canonical = clean card |\n| `page=N` alone on a card (old panel link) | cards | robots-blocked unless an exact GSC migration exception | canonical = clean card; catalog row links now use the clean card URL |\n| `q`, `sort`, `category`, `task`, `developer`, `access`, `status`, `benchmark`, `configuration`, `snapshot`, `evaluated_only`, `price_*`, `platform`, `local`, `ecosystem`, `model`, `tool` | catalogs / cards | robots-blocked | listings: `noindex,follow`, no canonical (a filtered selection is never declared a copy of the root); cards: canonical = clean card |\n| `partial=rows|panel` | fragments | robots-blocked unless an exact GSC migration exception | `X-Robots-Tag: noindex`; never carried into links |\n| `lang`, `kind` | legacy | — | 301 (section 1) |\n\n`robots.txt` (Production) blocks only the parameters above (`/*?p=` and `/*&amp;p=`), any\nquery on card URLs (`/models/*?`, `/*/models/*?`, `/tools/*?`, `/*/tools/*?` — canonical\nduplicates such as `?tab=` or filters), plus `/admin/` and `/healthz`. Locale paths and\nplain listing `page=` stays crawlable. The tools listing uses the limited\n`Allow: /tools/?page=` and localized equivalent to distinguish it from tool\ncards; `…?page=*&amp;` remains blocked. **No card-wide `Allow: */?page=` rule**\nis present. Catalog row links use clean card URLs, while the browser preserves\nthe original listing URL when a panel is closed. The 45 exact GSC card URL\nstrings observed on 2026-09-26 have anchored\n`Allow: &lt;URL&gt;$` exceptions, so crawlers can read their 301/404/noindex response.\nThis list is finite; no wildcard `?lang=` permission opens arbitrary facet or\npagination combinations. The own crawler uses the same rules\n(`catalog.views.robots_allows`). Every public record\nis reachable through plain `&lt;a href&gt;` pagination without JavaScript (own crawler).\nLocal serves `Disallow: /`; content responses carry `X-Robots-Tag: noindex, nofollow`\n(middleware-issued redirects do not traverse `HeadersMiddleware`).\n\n### Released P0 URL migration (2026-09-26; Production verified)\n\nThe GSC Pages export contained 45 distinct old card URLs with `lang`, `page`,\n`sort`, `kind`, `tab` and/or `partial=rows`. Local DB checks found 25 full-page\nURLs that now answer one 301 to the clean locale card (including three confirmed\naliases), 19 withdrawn/unknown URLs that answer 404, and one public AJAX rows\nfragment that answers 200 with `X-Robots-Tag: noindex`. The two other fragment\nURLs belong to withdrawn records and answer 404. A path locale wins over a stray\n`lang` query, and noncanonical prefix spelling plus legacy query normalize in\none hop. No retired entry is redirected to a generic catalog or home page.\n\nFull-page legacy **card** redirects discard `sort`, `page`, `tab` and\nother presentation parameters rather than sending the crawler to another\nquery URL. Legacy catalog listings retain search/filter/sort/page values so\ntheir requested selection is not silently replaced by the whole catalog;\nfiltered listing destinations remain robots-blocked and `noindex`.\nExisting AJAX `partial` requests on card URLs still return fragments\nfor cached clients; public fragments carry `noindex` and no canonical/hreflang\nhead. Current SSR card links use clean URLs; JavaScript remembers a bounded\nlist-page context when closing a panel. Indexable listing\n`?page=N` and its self-canonical are unchanged.\n\nProduction robots rules add exactly 45 `Allow: &lt;observed URL&gt;$`\nexceptions from `catalog/legacy_search_urls.py` to the existing card-query\ndisallow rules. The `$` anchor prevents an exception matching extra parameters;\nnew `?lang`, facet, sort and fragment combinations remain blocked. This finite\nexception lets Google/Bing recrawl the known old URLs to see their 301, 404 or\n`noindex` response without opening thousands of query combinations. The Local\n`/robots.txt` response in Local continues to be `Disallow: /`; tests apply the\nProduction setting to inspect the rules. The GSC list is a dated\nobservation and must be reviewed before adding any further exceptions.\n\nThis design follows [Google&#x27;s robots matching rules](https://developers.google.com/crawling/docs/robots-txt/robots-txt-spec),\n[Google&#x27;s permanent redirect guidance](https://developers.google.com/search/docs/crawling-indexing/301-redirects),\n[Google&#x27;s faceted navigation guidance](https://developers.google.com/crawling/docs/faceted-navigation),\nand [Bing Webmaster Guidelines](https://www.bing.com/webmasters/help/bing-webmaster-guidelines-30fba23a):\nrobots controls crawl access, while a crawler must fetch an allowed legacy URL\nto observe its redirect or `noindex` response. Actual recrawl and index selection\nis pending fresh search-engine recrawl; public HTTP verification is complete.\n\n### Search Visibility Optimization v2: published additions\n\nThe public sitemap now has 10,190 URLs across 22 child maps (10,186 before\nthis release). Four new indexable URLs are the English/Russian finite\n`/compare/model-context` and `/api-pricing` pages. Context data covers 97\npublished models with verified context-window facts. API pricing compares seven\nsame-provider official standard primary text-token price pairs; unknown and\nnon-comparable prices are omitted. No mass-generated facet, model-pair or\nprice doorway pages were added. The SSR catalog rows link to clean card URLs.\nThe interface still restores the original `?page=N` listing state on panel close.\n\nThe IndexNow dispatcher accepts 301/302 when validating notices for removed\nold URLs, as permitted by the protocol. The existing Production scheduler\naccepted 330 redirected legacy URL notices and four new page notices; active\npending and unresolved queues are zero as of 2026-09-26 21:59 UTC. Google\nSearch Console and Bing Webmaster have not yet refreshed indexing/performance\ndata. Submission acceptance is not indexing or ranking evidence.\n\n## 6. Collections (hubs)\n\nFinite registry in `catalog/hubs.py` (10 entries, published records only, minimum\n5 records to be indexable, text localized in 22 locales):\n`coding-models`, `video-models`, `music-models` (not ready: 4 &lt; 5 records),\n`free-tier-models` (price 0 listed; not &quot;free API&quot;), `api-models`,\n`open-weight-models` (not &quot;open source&quot;), `models-from-china`,\n`models-released-2025` (exact dates only), `long-context-models` (≥ 1,000,000 tokens;\nnot &quot;better&quot;), `coding-tools`. No per-filter or per-country/year generator exists.\nAggregates for future reports: `manage.py catalog_stats` (current state only; no\nhistory, no rating).\n\n### Search reference pages (Search Visibility Optimization)\n\nTwo distinct EN/RU pages use only published records already checked in the\ncatalog master: `/compare/model-context` compares documented context-window\nsizes across models with a known value; `/api-pricing` pairs active primary\nstandard text-token input and output prices from the **same API service**,\nwith an official provider-domain price source and normalized scope. Third-party\nreseller prices and offers whose scope is explicitly unresolved are excluded.\nBoth explain their selection and limitations, link to each model card and\nsource, expose check dates, and link to the existing coding/API/long-context\ncollections and methodology. They require at least five qualifying rows.\nUnknown values are omitted, never zero. Batch/cache/audio/image and special\nlong-context rates do not enter the standard price comparison. No new model\ndata, benchmark rankings, country claims or pairwise doorway pages are created.\nThe other 20 locales have no authored page text and therefore no indexable\nversions, sitemap entries or language-switcher links for these two routes.\nCard metadata with the known generic “Exact version” wording is enriched for\nEN/RU from already published context/API/price-presence facts; master prose,\ncard data and design remain unchanged.\n\n## 7. Open datasets\n\n`AIpediya Global AI Models Dataset` and `AIpediya AI Tools Dataset` (JSON + CSV,\n`/datasets/manifest.json` with SHA-256), schema 1.0.0, dataset version =\n`&lt;latest check date&gt;+&lt;content digest&gt;`; allowlist in `catalog/datasets.py`. Excluded:\nunpublished records and their links, descriptive prose, third-party benchmark scores,\nnotes, research, history, translation state, wner report dated 2026-09-25: DNS verification and main sitemap added/queued. Public DNS check dated 2026-09-25 via 1.1.1.1 found the expected root TXT. No current cabinet/role check. | take first performance/indexing snapshot when Yandex console is available |\n| Cloudflare DNS verification records | DNS TXT at the domain apex | Zone supplies TXT for GSC/Yandex ownership | Public DNS evidence dated 2026-09-25 via 1.1.1.1 returned expected Google and Yandex root TXT values; Cloudflare zone UI was not freshly inspected. | preserve both records; no DNS change requested |\n| Seznam | IndexNow (`search.seznam.cz/indexnow`; one engine forwards to all participants) [S1] | outbox ready | No separate Search Advisor cabinet evidence; IndexNow activation is recorded in the prior activation report only. | none identified |\n| Naver Search Advisor | IndexNow participant with its own endpoint [I2]. Historical ownership used HTML meta-tag | SSR setting and conditional head output implemented; `217/217` catalog tests PASS | Production tag curl-verified in activation report 2026-09-25 22:02Z; owner screenshots confirm ownership and sitemap submitted (screenshot date not recorded). Owner report 2026-09-26: official overseas-user form opened by another browser helper; request was submitted and accepted by Naver. No case number was shown; email response expected; account recovery is not yet confirmed. Property/sitemap state after restriction remains unknown. | await Naver email and confirmed account recovery; prior Browser Use denial in this session remains a separate open incident |\n| Baidu (ziyuan) | Official: site must be verified before sitemap submission; ≤ 50,000 URLs and ≤ 10 MB per sitemap file; submission does not guarantee crawling/indexing [BD1]. Concrete verification methods and account requirements: **unverified** (secondary guides only) | `/sitemaps/zh-hans.xml` fits the limits (458 URLs, ≈ 1.2 MB) | no Baidu tab or authenticated session among the inspected Chrome tabs (2026-09-25) | if account is available, register/verify and submit the zh-hans sitemap; otherwise owner may face identity/phone requirements |\n| Brave Search | Crawler has no distinct UA; does not crawl what Googlebot may not crawl; noindex (not robots) delists; URL submission at `search.brave.com/submit-url` [BR1] | ready (Googlebot not blocked) | Owner report dated 2026-09-26: prior re-fetch request accepted; indexing status unknown. | none; do not resubmit without cause |\n| IndexNow protocol | Key file, batch POST ≤ 10,000 URLs, codes 200/202/400/403/422/429 [I1]; submission is shared with all participants; participants: Bing, Yandex, Seznam, Naver, Yep, Amazon (+ Internet Archive in the engines list); Google is not listed [I2][I3] | enabled on Production 2026-09-25; root key file `/&lt;key&gt;.txt` returns 200 | Activation report dated 2026-09-25: 10,032 URLs accepted (HTTP 200, 3 POSTs); at 22:54Z active pending/retry/unresolved all 0. Not queried from Production in current status update. | event-driven outbox and `aipedia-indexnow` scheduler every 300 s; deploy protected by shared lock; acceptance is not indexing |\n| OpenAI OAI-SearchBot | search crawler, honors robots; GPTBot = training; ChatGPT-User = user-triggered, robots may not apply; IP lists published [O1] | not blocked by current robots | spoofed-UA 200 only | none required for search visibility |\n| PerplexityBot | search (not training), honors robots; Perplexity-User user-triggered, generally ignores robots; IP lists published [P1] | not blocked | spoofed-UA 200 only | none |\n| Anthropic Claude-SearchBot | search; ClaudeBot = training; Claude-User = user-triggered; all honor robots.txt [A1] | not blocked | spoofed-UA 200 only | none |\n\nCrawler verification (real vs spoofed): Googlebot — reverse + forward DNS\n(`googlebot.com`, `google.com`, `googleusercontent.com`) or published IP JSON [G2];\nBingbot — Verify Bingbot tool [B3]; YandexBot — reverse + forward DNS (`yandex.ru/.net/.com`)\n[Y3]; OpenAI / Perplexity — published IP JSON [O1][P1]. None of this was possible from\nLocal (no server logs), so **real-bot access is unverified**.\nGoogle-Extended is a robots product token for Gemini training, not a crawler; it does not\naffect Google Search inclusion or ranking [G3].\n\n**Training-access policy: not defined by the owner.** No owner decision on training\ncrawlers (GPTBot, ClaudeBot, Google-Extended, …) exists in `docs/DECISIONS.md`. The\ncurrent robots.txt baseline has no AI-agent-specific lines; GSD-1.0 keeps that baseline\nunchanged (it adds only facet/parameter rules under `User-agent: *`). The absence of a\nblock is the inherited state, **not** an approved allow-all policy; choosing one is an\nowner decision outside GSD-1.0.\n\nOfficial sources (retrieved 2026-09-25):\n[G1] https://support.google.com/webmasters/answer/9008080 ·\n[G2] https://developers.google.com/crawling/docs/crawlers-fetchers/verify-google-requests ·\n[G3] https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers ·\n[G4] https://developers.google.com/search/docs/specialty/international/managing-multi-regional-sites ·\n[B1] https://www.bing.com/webmasters/help/add-and-verify-site-12184f8b ·\n[B2] https://www.bing.com/indexnow/getstarted ·\n[B3] https://www.bing.com/toolbox/verify-bingbot ·\n[Y1] https://yandex.com/support/webmaster/service/rights.html ·\n[Y2] https://yandex.com/support/webmaster/indexing-options/index-now.html ·\n[Y3] https://yandex.com/support/webmaster/robot-workings/check-yandex-robots.html ·\n[S1] https://o-seznam.cz/napoveda/vyhledavani/seznambot/protokol-indexnow/ ·\n[BD1] https://ziyuan.baidu.com/college/courseinfo?id=267&amp;page=2 ·\n[BR1] https://search.brave.com/help/brave-search-crawler ·\n[I1] https://www.indexnow.org/documentation ·\n[I2] https://www.indexnow.org/searchengines.json ·\n[I3] https://www.indexnow.org/faq ·\n[O1] https://developers.openai.com/api/docs/bots ·\n[P1] https://docs.perplexity.ai/docs/resources/perplexity-crawlers ·\n[A1] https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler\n\nProduction UA probe (2026-09-25, 12 GETs of `/` from one client IP): browser, Googlebot,\nbingbot, YandexBot, OAI-SearchBot, GPTBot, ChatGPT-User, PerplexityBot, ClaudeBot,\nClaude-SearchBot, Baiduspider and curl UAs all received 200 via Cloudflare. This proves\nonly that spoofed UAs from this IP are not blocked; real crawler access (verified IPs)\nand actual crawling are **unverified** (no logs / console access).\n\nPrepared Cloudflare scope (not applied; needs the owner): keep &quot;verified bots&quot; allowed\nfor search crawlers; if AI bot blocking is ever enabled, exempt `OAI-SearchBot`,\n`PerplexityBot`, `Claude-SearchBot` (search) separately from training bots; cache rule:\nHTML is not cached with cookies (the site sets no language cookie server-side).\n\n### IndexNow outbox\n\n* `DiscoveryEvent` (migration 0018) is written only by model signals: create / publish /\n  significant change (visible fields, prices, access, facts, evaluations) → `upsert` for\n  locales indexable now; unpublish / delete / slug change → `remove` for the locales that\n  were indexable *before* the change; translation change → `upsert` of that one locale URL.\n  One pending row per URL (dedup). Page views never write. Bulk `QuerySet.update` does not\n  emit events (by design of Django signals).\n* `manage.py indexnow_dispatch [--send]`: dry run unless `AIPEDIA_ENV=production`,\n  `AIPEDIA_INDEXNOW_ENABLED=1`, a key and `--send`. Host allowlist, live-state gate\n  (upsert URL must be 200, removed URL 301/302/404/410 on Production; the\n  probe does not follow a redirect to its canonical destination), batch ≤ 10,000,\n  200/202 → sent; 400/422 → failed; 403 → abort, keep pending; 429/5xx/network →\n  exponential backoff, `--max-attempts` (default 6) then failed. Acceptance ≠ indexing.\n* `manage.py notify_indexnow --url … | --all` only queues (no network).\n* Scheduler (Production, since 2026-09-25 22:41Z): supervisord program\n  `aipedia-indexnow` (same pattern as `aipedia-backup`) runs\n  `/srv/aipedia/bin/indexnow-dispatch-loop` (`deploy/indexnow-dispatch-loop.sh`):\n  `indexnow_dispatch --send --batch 1000` every 300 s\n  (`AIPEDIA_INDEXNOW_INTERVAL_SECONDS`), only pending events that are due, with the\n  normal live-state gate; never `--all`. `flock -n /srv/aipedia/data/indexnow-dispatch.lock`\n  prevents overlapping runs; a manual run must use the same lock. Logs:\n  `/srv/aipedia/logs/indexnow.log` (URLs and HTTP status only, never the key).\n  `--all` was used once, for the URL-architecture release (2026-09-25).\n  `tools/deploy_code_release.py` holds the same lock from before `stop aipedia` through\n  migrate, publication state, app switch, start/healthz and any rollback (released in\n  `finally`, and by the kernel on a crash), so dispatch never runs during a deploy; if a\n  dispatch is running, the deploy waits up to 600 s, otherwise aborts before any change.\n* Status: `manage.py indexnow_status` (also in `seo_report` → `outbox`): `active_pending`,\n  `active_retry` (need attention), `failed_unresolved` (really undelivered) versus\n  `failed_resolved_historical` (failed attempts whose URL was accepted later — audit only).\n\n## 9. Monitoring\n\n`manage.py seo_report --out &lt;json&gt; [--html all] [--crawl] [--registry-csv &lt;csv&gt;]`:\nregistry totals (entity URLs separate from translation rows), sitemap graph and limits,\nproduction-mode HTML audit (canonical/hreflang/noindex/lang/dir/H1/title/description vs\nsitemap), robots-respecting own crawl, outbox state. Server logs, search consoles and AI\nreferrals are reported as `not_connected` with `null` values — never zero.\n\n## 10. Owner actions (updated 2026-09-26)\n\n1. Google: Domain property verified and main sitemap Successful in the 2026-09-25\n   cabinet/release evidence. Bing: GSC import and sitemap Processing in the same da pected Google and\n  Yandex verification values. Cloudflare DNS dashboard itself was not accessible;\n  record counts and unrelated A/AAAA/CNAME/MX records were not audited in its UI.\n* Account evidence by source: Google and Bing statuses are from prior cabinet/activation\n  evidence, not a fresh browser audit. Yandex verification/sitemap status is owner-reported;\n  only its TXT was checked now via DNS. Naver verification and sitemap submission are\n  confirmed by the owner&#x27;s screenshot; the activation report independently curl-verified\n  the Production meta tag, while the current Naver page is signed out. Brave status is\n  prior submission evidence only. No account state is inferred from a missing session.\n* Current browser permission settings blocked access to Google, Bing, and Cloudflare;\n  no Yandex Browser session was available and Naver required sign-in. No restrictions\n  were bypassed. For fresh console checks, the owner needs to sign in to the respective\n  service in a browser session that can be controlled here (and authorize browser access\n  if prompted). No registrations, submissions, code, server, or DNS were changed.\n\n### Search launch and open incidents (2026-09-26)\n\n* Google, Bing and Yandex ownership/sitemap results remain supported by the dated\n  cabinet/activation evidence and owner report described in the matrix. They were not\n  freshly rechecked during this documentation update. Cloudflare Google/Yandex TXT\n  values were publicly checked on 2026-09-25 via resolver 1.1.1.1.\n* Naver: owner screenshots confirm prior ownership verification and sitemap submission;\n  Production meta tag was curl-verified in the activation report (2026-09-25 22:02Z).\n  The owner later reported `abnormal registration / mass-created ID`. Exact cause is\n  unknown; current rights and sitemap status after restriction are unverified. Owner\n  update (2026-09-26): another browser helper opened the official overseas-user recovery\n  form. The owner now алы, sitemap index + 22 дочерних sitemap, политика фасетов и\nпагинации, методика, 10 подборок, выгрузки данных (выключены флагом), журнал\nIndexNow и dispatcher (выключен), отчёты/проверки.\n\nНе входит (отдельные решения/задачи): незакоммиченная работа другого исполнителя\nпо catalog master (`catalog_master*`, `reconcile_catalog`, `restore_core_catalog`,\nXLSX, `data/research/`, `requirements-dev.txt`, соответствующие разделы\n`AGENTS.md`/`DECISIONS.md`/`AI_CONTEXT/README.md`) — владелец решает, включать ли\nеё в тот же commit. Для GSD-1.0 она не нужна. Публикационное состояние каталога\nне меняется (304/138, номера прежние) — манифест `data/release_state.json`\nостаётся тем же.\n\n## Зависимости\n\n1. Commit только файлов GSD-1.0 (архив `build_code_release.py` берёт лишь\n   tracked-файлы; новые файлы без commit в архив не попадут).\n2. Миграция `catalog/0018_discovery_outbox` (новая таблица, данные не меняет).\n3. `collectstatic` (новые `share-card.png`, `brand-512.png`, изменённые\n   `site.js`, `site.css`) — выполняется `deploy_code_release.py`.\n4. Переменные окружения Production (по умолчанию безопасны):\n   `AIPEDIA_DATASETS_PUBLIC=0` (по умолчанию для production),\n   `AIPEDIA_INDEXNOW_ENABLED` не задана (=выключено).\n5. `tools/public_acceptance.mjs` и `browser_check.py` проверяют старый\n   `?lang=`-контракт — для этого выпуска вместо них:\n   `python tools/gsd_public_check.py https://aipediya.com` (ожидается 32/32\n   после выпуска; до выпуска 8/32).\n\n## Выпуск (по `docs/RELEASE.md`, без изменений процесса)\n\n1. Полный `manage.py test catalog --settings=aipedia.test_settings` PASS (210).\n2. Commit + tag `release-YYYY-MM-DD-gsd-1-0`; `build_code_release.py`.\n3. `deploy_code_release.py &lt;archive&gt; --sha256 … --dry-run`, затем без `--dry-run`\n   (с `--publication-state data/release_state.json`, если владелец требует\n   повторного применения манифеста; изменений видимости нет).\n4. Post-deploy: `/healthz` = новый commit; `gsd_public_check.py` 32/32;\n   `/sitemap.xml` — index 22 дочерних; ограниченная ручная проверка\n   RU/EN/AR карточек.\n\n## Откат\n\nКод — как в `docs/RELEASE.md` (вернуть `/srv/aipedia/releases/before-code-*`).\nМиграция 0018 только добавляет таблицу; старый код её не читает, откат БД не\nнужен. После отката старые `?lang=` URL снова отвечают 200, новые `/ru/…` — 404\n(поисковики получат 404 на новых адресах до повторного выпуска; поэтому\nIndexNow `--all` запускать только после подтверждения, что выпуск остаётся).\n\n## Активация после выпуска (действия владельца)\n\nСм. `docs/SEARCH_DISCOVERY.md` §10: консоли Google/Bing/Yandex (+ по желанию\nNaver/Baidu), sitemap, ключ IndexNow и одноразовый `notify_indexnow --all` +\n`indexnow_dispatch --send`, решение о лицензии данных, проверка переводов.\n\n## Числа (Local, 2026-09-25)\n\n- Публичные записи: 304 модели, 138 инструментов (скрытые 459 — `not-public`).\n- Потенциальные entity×locale URL: 442 × 22 = 9 724; indexable: 9 724\n  (6 688 моделей + 3 036 инструментов); not-ready: 0 (все основные тексты\n  текущие). Строк переводов ContentTranslation: 42 260 — это не число URL.\n- Sitemap (после reconciliation): index + 22 дочерних; 10 035 `&lt;loc&gt;`:\n  карточки 9 724 (модели 6 688 + инструменты 3 036), готовые подборки 198\n  (9 × 22), индекс подборок 22, каталог моделей 22, каталог инструментов 22,\n  методика 22, конфиденциальность 22, страницы данных 3 (только en);\n  230 742 alternate-ссылки; крупнейший файл ≈ 1,15 МБ / 459 URL.\n  На Production (датасеты выключены) ожидается 10 032 `&lt;loc&gt;`.\n  На Production датасеты выключены → их 3 страницы (только `en`) не попадут в sitemap.\n- Тесты: 216 PASS. Аудит HTML: 10 013 страниц (полный) + 575 после reconciliation, 0 проблем.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-25-gsd-1-0-release\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Выпуск GSD-1.0 / GSD-1.0 release<\/p><pre># Выпуск release-2026-09-25-gsd-1-0 — «Глобальная поисковая доступность» (GSD-1.0)\n\n- Дата (UTC): 2026-09-25, deploy 16:08Z.\n- Commit / tag: `ba93f7ddf690f4a958405fbabfc65a59d3a9cfbf` /\n  `release-2026-09-25-gsd-1-0`. Предыдущий Production: `ed103a3ff163`.\n- Утверждение: владелец 2026-09-25 — выпуск полного текущего Local-состояния\n  (GSD-1.0 + код catalog master + Local-only «История сайта»); отдельное явное\n  разрешение на существующий SSH-канал только для операций AIpedia этого выпуска.\n- Архив: `aipedia-code-ba93f7ddf690.zip`, sha256\n  `5ed63075cb59e6bc97b05fe4e290c53b3a31202a043056aebb069dad8f8facc4`\n  (совпал локально и на сервере), 290 файлов, без SQLite/секретов/XLSX/research.\n\n## Шаги на сервере (только AIpedia)\n\n1. Baseline: `/healthz` = `ed103a3`; integrity ok; FK violations 0; Models 304\n   публичных из 763; Tools 138/138; ModelVersion 901; Offers 555; Evaluations 881;\n   Access 1205; ContentTranslation 42 260; Revision 4 813; последняя миграция 0017.\n2. Backup (online, sqlite backup API, integrity ok):\n   `/srv/aipedia/backups/aipedia-before-release-2026-09-25-gsd-1-0-20260925T160739Z.sqlite3`\n   + штатный `aipedia-before-code-20260925T160818Z.sqlite3`.\n3. Dry-run `deploy_code_release.py … --publication-state data/release_state.json` — OK.\n4. Deploy: остановлена только программа `aipedia`; `check`, `collectstatic`;\n   `migrate` — `0018_discovery_outbox`; `sync_publication_state apply --apply` —\n   models changed 0, tools changed 0 (304/138 = манифест); `aipedia` запущена;\n   статус `deployed-origin-verified`, `copied_sqlite=false`. Предыдущий код —\n   `/srv/aipedia/releases/before-code-20260925T160818Z`; после —\n   `aipedia-after-code-20260925T160818Z.sqlite3`.\n5. `aipedia-tunnel`, `aipedia-backup` не перезапускались; StratForge и чужие\n   процессы/конфигурация/секреты не затрагивались. Переменные окружения\n   Production не менялись (датасеты и IndexNow остаются выключенными).\n\n## Боевая БД до → после\n\nВсе счётчики выше без изменений; добавлена пустая таблица\n`catalog_discoveryevent`; integrity ok; FK violations 0; `BUILD.json` =\n`ba93f7ddf690`.\n\n## Проверки\n\n- Тесты (gate): 216 PASS, `check` OK, `makemigrations --check` — нет изменений.\n- Production GSD QA (`tools/gsd_production_qa.py`, 659 GET): **1596/1596 PASS** —\n  корень и 21 locale path, Tools в 22 локалях, 12 legacy-редиректов (один 301 +\n  200), SSR-карточки EN/RU/AR/ZH/UK/FA (модели и инструменты), canonical/hreflang/\n  x-default/lang/dir/одна H1/JSON-LD, методика ×22, индекс и 9 подборок в 4\n  локалях, тонкая подборка `music-models` — noindex, датасеты — 404 (выключены),\n  пагинация (page 2/5 = 200, 6/abc = 404, сортировка — noindex без canonical,\n  фрагмент — `X-Robots-Tag: noindex`), robots, sitemap index + 22 дочерних, все\n  459 скрытых NEEDS_REVIEW — 404 и отсутствуют в sitemap.\n  Первый прогон показал 13 ложных отказов из-за регистра имён заголовков в самом\n  скрипте QA (Cloudflare отдаёт `location` в нижнем регистре; curl подтвердил\n  верный ответ) — скрипт исправлен, регрессий сайта нет.\n- `tools/gsd_public_check.py https://aipediya.com`: 34/34.\n- Публичный sitemap: **10 032 `&lt;loc&gt;`** — карточки 9 724 (модели 6 688 +\n  инструменты 3 036), подборки 198, индекс подборок 22, каталог моделей 22,\n  каталог инструментов 22, методика 22, конфиденциальность 22.\n- Визуально (headless Chrome, `artifacts/…/screens/PROD-*`): EN desktop, RU/AR\n  карточки desktop (RTL), ZH подборка desktop, FA методика mobile, UK Tools mobile,\n  JA карточка mobile. Local-only навигация и «История сайта» на Production не\n  показываются.\n\n## Внешняя активация\n\n- Brave Search: запрос на повторную загрузку `https://aipediya.com/` принят формой\n  `search.brave.com/submit-url` (принятие ≠ индексация).\n- Google / Bing / Yandex / IndexNow / Naver / Baidu — требуют действий владельца,\n  см. `docs/SEARCH_DISCOVERY.md` §10.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-25-naver-indexnow-activation\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Активация поиска / Search activation<\/p><pre># Активация Naver и IndexNow — 2026-09-25\n\nРазрешение владельца: операции только AIpedia (`/srv/aipedia`, backup, выпуск кода и\nконфигурации, сервис `aipedia`, Production QA). StratForge, туннель и чужие сервисы не\nзатрагивались; Local SQLite не копировалась; перезапускалась только программа `aipedia`.\n\n## Выпуски\n\n| Commit / tag | Что | Backup перед выпуском | Результат |\n|---|---|---|---|\n| `160be0f37037` / `release-2026-09-25-naver-verification` | SSR meta `naver-site-verification` | `aipedia-before-release-2026-09-25-naver-verification-20260925T220148Z.sqlite3` + штатный `aipedia-before-code-20260925T220156Z` | `deployed-origin-verified`; миграций нет; публикация 304/138 без изменений |\n| `386d4aaafd00` / `release-2026-09-25-indexnow-root-key` | ключ IndexNow в корне (`/&lt;key&gt;.txt`) и `keyLocation` в корне | `aipedia-before-release-2026-09-25-indexnow-root-key-20260925T220707Z.sqlite3` + штатный `aipedia-before-code-20260925T220709Z` | `deployed-origin-verified`; миграций нет; 304/138 |\n\nGate: 217 и 219 тестов PASS соответственно.\n\n## Naver\n\n`curl https://aipediya.com/` содержит\n`&lt;meta name=&quot;naver-site-verification&quot; content=&quot;9c99ee04834598097c2ba9b6a809819418e5d74d&quot;&gt;`.\nНажатие Verify и отправка sitemap в Naver Search Advisor — за владельцем: авторизованной\nсессии Naver в доступных исполнителю браузерах не было (Claude in Chrome не подключён).\n\n## IndexNow\n\n- Конфигурация: `/srv/aipedia/supervisord.conf`, `[program:aipedia]` дополнен\n  `AIPEDIA_INDEXNOW_KEY` (32 hex, сгенерирован на хосте) и `AIPEDIA_INDEXNOW_ENABLED=&quot;1&quot;`;\n  копия прежнего файла — `/srv/aipedia/backups/supervisord.conf.before-indexnow-20260925T220242Z`;\n  `supervisorctl update aipedia` — перезапущена только `aipedia`.\n- Первая попытка: `keyLocation` в `/indexnow/&lt;key&gt;.txt` → HTTP 422 (ключ в подпапке\n  авторизует только URL этой подпапки). 5 016 событий помечены `failed`, вторая партия не\n  отправлялась. Исправлено выпуском `386d4aaafd00`.\n- После исправления: первая повторная партия → 403 (ключ ещё не принят сервисом; прямой\n  запрос к Bing с тем же ключом — 200). Малая партия через ~1 минуту — 200.\n- Итог: `notify_indexnow --all` поставил 10 032 URL (= публичный sitemap); отправлено тремя\n  POST (100 + 5 000 + 4 932) — **10 032 accepted (HTTP 200), 0 pending, 0 retry**;\n  5 016 строк `failed` (422) — история первой попытки, их URL затем приняты.\n  Для этой разовой начальной отправки использован `--no-live-check`: состояние\n  Production подтверждено сразу перед ней (QA 1596/1596, sitemap = реестр). Принятие ≠\n  индексация.\n\n## Проверки после\n\n`/healthz` = `386d4aaafd00`; integrity ok; FK 0; Models 304/763, Tools 138, Offers 555,\nEvaluations 881, ContentTranslation 42 260, Revision 4 813; outbox 15 048 строк;\nProduction GSD QA **1596/1596**; public sitemap 10 032.\n\n## Автоматическая отправка (2026-09-25 22:41Z)\n\n- Штатный механизм периодических задач AIpedia — программы собственного supervisord\n  (`aipedia-backup` = цикл `sleep`). Cron на хосте нет. Добавлена программа\n  `aipedia-indexnow` → `/srv/aipedia/bin/indexnow-dispatch-loop`\n  (`deploy/indexnow-dispatch-loop.sh`, владелец `aipedia`, 0700): каждые 300 с\n  `flock -n /srv/aipedia/data/indexnow-dispatch.lock … indexnow_dispatch --send --batch 1000`;\n  только pending/retry события, dedup/retry/live-gate диспетчера без изменений, без `--all`.\n  Окружение — копия `[program:aipedia]` + `AIPEDIA_INDEXNOW_INTERVAL_SECONDS=&quot;300&quot;`.\n- Конфигурация до изменения: `/srv/aipedia/backups/supervisord.conf.before-indexnow-scheduler-20260925T224101Z`.\n  `supervisorctl update aipedia-indexnow` запустил только новую программу; `aipedia`,\n  `aipedia-backup`, `aipedia-tunnel` не перезапускались.\n- End-to-end: `notify_indexnow --url https://aipediya.com/methodology` (реальная\n  публичная страница без изменений) → событие 15049 `pending` 22:41:37Z → очередной\n  плановый цикл 22:46:02Z → IndexNow HTTP 200, `sent`. Публичные данные не менялись;\n  строка журнала оставлена как аудит.\n- Лог: ключ IndexNow в `indexnow.log`/`indexnow-error.log` — 0 вхождений. Проверка\n  блокировки: вторая попытка при удержанной блокировке — `SECOND_RUN_BLOCKED`.\n- Outbox после теста: sent 10 033, failed 5 016 (история попытки с 422), pending 0.\n\n## Защита deploy от параллельной отправки (2026-09-25 22:54Z)\n\n- `634778807b2e` / `release-2026-09-25-deploy-dispatch-lock`: `deploy_code_release.py`\n  берёт `indexnow-dispatch.lock` до `stop aipedia` и держит его через migrate,\n  publication state, переключение, start/healthz и откат (`finally`; при аварии блокировку\n  снимает ядро). Частота scheduler не менялась.\n- Проверка: на Linux-хосте — scheduler `flock -n` не получает блокировку, пока её держит\n  deploy (1), второй deploy завершается до изменений, после снятия — 0; при реальном\n  deploy пробник видел блокировку ~6 с (12 × 0,5 с) и свободную до и после. Тесты: 223 PASS\n  (+1 POSIX-тест пропущен на Windows, выполнен на хосте). Backup\n  `aipedia-before-release-2026-09-25-deploy-dispatch-lock-20260925T225432Z.sqlite3`.\n- `indexnow_status` на Production: active_pending 0, active_retry 0, failed_unresolved 0,\n  failed_resolved_historical 5 016, urls_accepted 10 032. Integrity ok, FK 0, 304/138.\n\n## Последующее внешнее состояние (2026-09-26)\n\n- Naver: владелец ранее завершил verification сайта и отправил sitemap; источники —\n  скриншоты владельца (их дата в доступной записи не указана). Production meta tag\n  подтверждён curl в этом отчёте 2026-09-25 22:02Z. Позднее владелец сообщил, что Naver\n  ограничил вход с сообщениями `abnormal registration / mass-created ID`. Точная причина\n  неизвестна; страну проживания, способ входа или использование агента причиной не\n  считать. Текущее состояние права и sitemap после ограничения не перепроверено.\n  Recovery request не отправлен.\n- Browser Use: при разрешающих настройках интерфейса `mcp__cua_repl.js` отказал в доступе\n  к официальному `help.naver.com`, сославшись в сообщении инструмента на saved user\n  permission. Причина расхождения с интерфейсом не установлена; обход не выполнялся.\n  Диагностика подготовлена, владелец сообщил об отправке отзыва OpenAI. Case number и\n  подтверждение, что поддержка приняла обращение в работу, не представлены.\n- Это дополнение не изменяет исторические результаты release: 10 032 IndexNow URL\n  приняты, scheduler и общая deploy/dispatch lock реализованы и проверены согласно\n  разделам выше. Acceptance не доказывает индексацию. Baidu не запускался.\n\n## Naver recovery update (owner report, 2026-09-26)\n\n«Запрос на снятие ограничения входа отправлен и принят Naver. Номер обращения на\nэкране не показан. Ожидается ответ по email. Восстановление доступа ещё не\nподтверждено».\n\nЭто сообщение владельца; текущие Search Advisor ownership/sitemap статусы после\nограничения не перепроверены. Отдельный Browser Use denial в другой сессии остаётся\nоткрытым. Фото, реквизиты документа и персональные поля формы в отчёт не включаются.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-26-search-visibility-release\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Оптимизация поисковой видимости / Search visibility release<\/p><pre># Search Visibility Optimization — выпуск 2026-09-26\n\n**DEPLOYED AND VERIFIED**, 21:47 UTC. Основание: аудит\n`outputs/[идентификатор скрыт]/AIpediya_Search_Visibility_Audit_2026-09-26.xlsx`,\n45 URL из GSC и последующий Local P0. Разрешение владельца дано на этот\nзаконченный поисковый пакет. GSD-1.0, каталог, master и дизайн сохранены.\n\n## Что опубликовано\n\nCommit `61adedd6ea5e6a0955d51d87374fa2fa9bcc7799`, tag\n`release-2026-09-26-search-visibility-optimization-v2`, branch\n`codex/search-visibility-update`. Code-only архив\n`artifacts/code-release/aipedia-code-61adedd6ea5e.zip`, SHA-256\n`8b8f2fa4bac3b6edce0868e4a963a795111d45695341c869ed824186e9ee625f`.\nПромежуточный `7a582…` и первоначальный tag выпуска заменены финальной v2:\nпосле первой публичной проверки убрано слишком широкое robots Allow карточного\n`?page=`. Cloudflare Custom Purge применён **только** к `/robots.txt`, затем\nпублично подтверждён свежий ответ без широкого Allow.\n\nПакет содержит точные 45 GSC legacy исключений в robots (с `$`), 25\nодношаговых 301 на чистые опубликованные карточки, 19 ответов 404 для снятых\nили неизвестных сущностей, один `partial=rows` ответ 200 с `noindex`.\nЛюбое добавление параметра к исключению опять блокируется. Убраны\nпараметрические SSR-ссылки на карточки, при этом UI восстанавливает страницу\nсписка после закрытия карточки. Диспетчер IndexNow принимает 301/302 для\nуведомлений о прежних URL. Добавлены только четыре индексируемых URL: EN/RU\n`/compare/model-context` и `/api-pricing`. Первая страница использует\nподтверждённое окно контекста 97 опубликованных моделей, вторая — семь\nсопоставимых пар официальных стандартных цен primary text-token одного\nпровайдера. Неизвестные цены и несопоставимые тарифы исключены; массовых\nфасетных страниц нет.\n\n## Проверки и безопасность выпуска\n\n- Local: 268 catalog tests, 267 PASS и один ожидаемый skip; `node --check` PASS;\n  `seo_report` — 10 193 sitemap URL (три Local-only dataset URL), 359 HTML\n  страниц и 320 взятых в лимит обхода ответов без проблем. Лимит обхода не\n  является доказательством завершения всего графа. Все 45 старых URL дают\n  ожидаемые статусы. Браузерный сценарий `?page=2` → чистая карточка →\n  закрытие → `?page=2` прошёл.\n- Перед deploy: backup Production SQLite\n  `/srv/aipedia/backups/aipedia-before-code-20260926T214700Z.sqlite3`;\n  после — `/srv/aipedia/backups/aipedia-after-code-20260926T214700Z.sqlite3`;\n  rollback дерева кода `/srv/aipedia/releases/before-code-20260926T214700Z`.\n  Серверный preflight, целостность БД и FK проверены; миграций и изменений\n  состояния публикации не потребовалось (0), 310 Models / 139 Tools сохранены.\n  Local SQLite на сервер не переносилась. Затронут только контур AIpediya.\n- Production `/healthz` подтвердил commit, `status=ok`,\n  `environment=production`. `tools/search_visibility_qa.py`: 45/45 старых URL\n  (25 × 301, 19 × 404, 1 × 200/noindex) без ошибок.\n  `tools/gsd_public_check.py`: 34/34 PASS.\n  `tools/gsd_production_qa.py`: 697 HTTPS-запросов, 1657/1657 проверок PASS,\n  включая 22 локали, robots, sitemap, canonical/hreflang, JSON-LD, новые\n  страницы и скрытые записи. Публичный sitemap: 22 child XML, 10 190 URL.\n\n## До → после и поисковые кабинеты\n\n| Показатель | До (аудит) | После выпуска, 2026-09-26 | Вывод |\n|---|---:|---:|---|\n| Известные GSC legacy URL с неправильной миграцией/недоступными сигналами | 45 | 45/45 ожидаемых публичных ответов; 0 ошибок QA | Технически исправлено; поисковику нужен recrawl |\n| Публичные sitemap URL | 10 186 | 10 190 | +4 конечные EN/RU страницы, без фасетных дублей |\n| Публичный Search QA | 1596/1596 на прежнем GSD baseline | 1657/1657 | Новые проверки включают миграцию и страницы |\n| Local SEO report | P0: 10 189 URL, 355 HTML, 0 проблем | 10 193 URL, 359 HTML, 0 проблем | Local имеет ещё 3 выключенных на Production dataset URL |\n| IndexNow unresolved | 330 до исправления диспетчера | 0 | 330 старых 301 URL + 4 новые страницы приняты scheduler |\n| GSC performance | 41 impressions, 0 clicks, avg position 8.5 (24.09) | Те же последние доступные данные | Обновлённой статистики ещё нет |\n| GSC indexed pages | Отчёт обрабатывается | Отчёт обрабатывается | Нельзя утверждать рост индексации |\n| Bing performance | Подготовка данных | Подготовка данных | Нельзя утверждать рост кликов/позиций |\n\nIndexNow до отправки: `sent_events=14845`, `urls_accepted=10076`,\n`failed_unresolved=330`. Существующий Production scheduler обработал\n**ровно 334** точечных события (330 подтверждённых старых 301 URL и четыре\nновые страницы); после: `sent_events=15179`, `urls_accepted=10080`,\n`active_pending=0`, `active_retry=0`, `failed_unresolved=0`. Исторические\nошибки не удалены. Массовый `--all` не запускался. GSC/Bing sitemap повторно\nне отправлялись: они уже были зарегистрированы. GSC sitemap Success, но\nпоказывает старые 10 032 discovered; Bing sitemap Success, 22 карты,\nпорядка 1,4 тыс. discovered, 0 errors/warnings. Naver требует восстановить\nдоступ к кабинету; доступного свежего состояния Yandex/Baidu нет.\n\nКонтрольная Google выдача после выпуска всё ещё показывала по бренд-запросу\n`AIpediya AI models` на первом органическом месте старый `/?lang=en`, рядом\nчистый `/` и старую параметрическую карточку: Google ещё не обновил выбранные\nURL. Для `AI model comparison` AIpediya не было среди первых восьми видимых\nорганических результатов, как и в исходном замере. Это наблюдение, **не**\nутверждение роста ranking. Базовый аудит содержит 52 более широких SERP-замера.\n\nОсталось после повторного обхода снять в GSC/Bing выбор canonical, indexed\npages, ошибки, queries, страны, impressions, clicks и позиции; затем повторить\nте же SERP-запросы. Authority/backlinks и конкурентоспособность контента\nостаются отдельной долгосрочной задачей. Новые недоказанные страницы или\nмассовые doorway URL в этот выпуск не входят.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"2026-09-26-offline-product-history\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Автономный просмотр истории / Offline product history<\/p><pre># Автономный просмотр истории продукта — 2026-09-26\n\n## Ревизия 2 — Local-only, 2026-09-26\n\nВладелец не принял первую визуальную редакцию: она наследовала общий `base.html`\nи стили публичного каталога. Исправление выполнено отдельными\n`templates/product_history_standalone.html` и `static/product-history-offline.css`.\nАвтономный файл теперь рендерится без внешней оболочки: две равные карточки Local и\nProduction; GSD-01…GSD-10 как стабильные номера исходных возможнос
