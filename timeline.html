9-21T23:31Z | после infinite scroll | **PASS, 69 тестов** |\n| Покрытие published → mark | 2026-09-21T23:25Z | Local SQLite | **34/34**, 0 без знака |\n| Production | эта сессия | — | **не запускалось** |\n\n### Архивные расхождения документов\n\n- `docs/ACCEPTANCE.md` всё ещё пишет, что приёмка владельцем ожидается. Хронология 2026-09-20 опубликована; редизайн Local — к новой приёмке вида, не к публикации.\n- `docs/VERIFICATION.md` старше текущего GitHub (`7e66da2`) и незакоммиченных файлов.\n- Пустые рейтинг AIpedia, факты, аудиты и большинство контекстов — согласованное ограничение этого этапа, не дефект вёрстки.\n\n### Архивные ограничения предыдущего этапа\n\n- Рейтинг AIpedia не рассчитывается.\n- «Сохранить» неактивна.\n- 43 карточки без доказанной даты и номера остаются в конце хронологии.\n- У части моделей нет офферов (пример: GPT-4.1) — вкладка стоимости пустая, не «Бесплатно».\n- Знак — у разработчика, не у отдельной версии модели (так в эталоне и в `D-2026-09-21-developer-marks`).\n- Адрес с хвостовым слэшем `/models/&lt;slug&gt;/` по-прежнему 404 (было до редизайна).\n- Local слушает 127.0.0.1:18810; это не публичный сайт.\n- Грязные незакоммиченные файлы: редизайн, знаки, infinite scroll, docs, artifacts, AI_CONTEXT, data/research.\n- Без JS остаётся ссылка «Далее» на следующую порцию (полная перезагрузка страницы).\n\n### Доказательства предыдущего этапа\n\nОтносительные пути; сборщик копирует их в zip, если файл есть и не секрет:\n\n- docs/history/2026-09-20-chronology-release.md\n- docs/RELEASE.md\n- docs/DECISIONS.md\n- docs/visual-spec.md\n- tools/pack_ai_context.py\n- artifacts/reference-plan-design.png\n- artifacts/visual-rebuild/local-final-1672x941.png\n- static/marks/\n\n## Передача на Production (серверные шаги, выполняет владелец на хосте)\n\nРазвёртывание и перенос переводов запускаются **на самом сервере** `/srv/aipedia`\n(в этом окружении нет SSH к хосту AIpedia; [ЗАМЕНЕНО 2026-09-26: правило «StratForge-ключи не используются» неверно — см. AGENTS.md, раздел «Общая серверная машина и SSH»: разрешено использовать настроенную SSH identity к общей машине строго в контуре AIpediya, ключи не читать и не раскрывать]).\nПорядок строго по `docs/RELEASE.md`; Local SQLite на сервер не копируется;\nтуннель, секреты и StratForge не трогаются.\n\n1. Локально собрать архив на релизном commit и сохранить SHA256:\n   `.\\.venv\\Scripts\\python.exe tools/build_code_release.py`\n   (архив в `artifacts/code-release/aipedia-code-&lt;commit12&gt;.zip`, только\n   tracked-файлы, без SQLite/секретов).\n2. Локально проверить изолированно и dry-run:\n   `.\\.venv\\Scripts\\python.exe tools/verify_isolated_release.py`\n   `.\\.venv\\Scripts\\python.exe tools/deploy_code_release.py &lt;archive&gt; --sha256 &lt;digest&gt; --dry-run`\n3. Скопировать на сервер **два** файла (без Local SQLite): архив кода и\n   `artifacts/translation-data-release/translations-export.json` (42 260 записей,\n   15.3 MB, только переводы, без секретов).\n4. На сервере развернуть код:\n   `python3 tools/deploy_code_release.py /path/aipedia-code-&lt;commit12&gt;.zip --sha256 &lt;digest&gt;`\n   (останавливает только `aipedia`, online-backup серверной БД, перенос кода и\n   статики, `migrate` существующей БД, старт `aipedia`, проверка `/healthz`).\n5. На сервере перенести переводы в существующую серверную БД, идемпотентно и без\n   провайдера, сначала dry-run:\n   `python3 manage.py import_translations /path/translations-export.json --dry-run`\n   затем боевой прогон без `--dry-run`. Импорт применяет перевод только там, где\n   английский источник на сервере совпадает по sha256; несовпадения безопасно\n   пропускаются (остаётся английский), повторный запуск ничего не меняет.\n6. Публичная проверка `https://aipediya.com/`: `/healthz`, Модели и Инструменты,\n   карточка модели и инструмента, EN/UK/AR(RTL), локализованные описания и\n   страны, оригинальные бренды/ID/API/бенчмарки, правая панель (клик вне/Escape/\n   крестик), меню языков над панелью, смена языка сохраняет карточку, desktop и\n   mobile, защита числовых токенов (например «1M»).\n\nЭкспорт переводов проверен на Local: `import_translations --dry-run` против той\nже базы даёт applied=0, unchanged=42 260 (полная идемпотентность).\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"decisions\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Решения / Decisions<\/p><pre># Решения AIpedia\n\n## D-2026-09-28-reconciliation-natural-keys\n\n- Статус: подтверждено владельцем поручением о закрытии 1 067 расхождений (2026-09-28).\n- Решение: связанные строки Master ↔ Local ↔ Production сравниваются по Record ID и стабильным natural/composite keys; числовой SQLite PK конкретной базы не является идентичностью. Исследовательские и служебные различия с доказанным назначением получают `intentional_master_only` и причину, а не предупреждение о забытом дефекте.\n- Проверенные публичные значения переносятся только точным планом после backup, копии, Local QA и отдельно разрешённого выпуска. Для одной строки Access общий Service клонируется; провайдер общего Service и категория общего Benchmark меняются лишь при согласованности всех связанных опубликованных строк Master. Итог и исключения — `docs/history/2026-09-28-reconciliation-cleanup.md`.\n\n## D-2026-09-27-versioned-release-history\n\n- Статус: подтверждено владельцем (2026-09-27, задача о постоянной системе версий).\n- Решение: **No Timeline → No Release.** Каждому пакету заранее выделяются\n  неизменяемый Release # и SemVer, карточка существующей истории и точный состав.\n  До Production обязательны Local QA, автономная история для визуальной приёмки,\n  явное решение владельца и автоматический release gate. После публичного QA\n  та же карточка получает Production ✓; отменённые номера не используются снова.\n- Baseline: Release #011 · v0.11.0 · `release-2026-09-27-catalog-325-147`.\n- Приёмка Local: владелец в поручении по полному аудиту автономной истории\n  27.09.2026 явно подтвердил визуальный результат и завершённость системы\n  версий. Карточка `VERSION-HISTORY-2026-09-27` — Local ✓ / Owner ✓ /\n  Production —; отдельного deploy этой реализации не было.\n\nКанонический журнал решений. Идея в обсуждении **не** является требованием.\nСтатусы: `предложено`, `подтверждено владельцем`, `отклонено`, `заменено новым решением`.\nПодробности сравнения — `docs/COMPARISON_RULES.md`. Выпуски — `docs/history/`.\nПравила работы исполнителей — `AGENTS.md`, сюда не копировать.\n\n## D-2026-09-27-claude-server-permission-mode\n\n- Статус: подтверждено владельцем (2026-09-27, поручение закрепить ограничение\n  серверной работы Claude Code как каноническое правило)\n- Решение: Claude Code `Auto` используется для Local/GitHub работы. Для серверной\n  фазы AIpedia (SSH, preflight, backup, deploy, restart, server verification)\n  владелец переводит сессию Claude Code в режим с подтверждением команд\n  (Manual / Default / Ask); исполнитель повторяет read-only preflight и выполняет\n  серверные команды только через подтверждение интерфейса. Claude не расширяет\n  себе permissions и не обходит политику среды. Если переключение нежелательно\n  или невозможно, серверную фазу выполняет Codex по структурированному handoff\n  (`docs/RELEASE.md`, «Executor preflight»). Общая серверная машина не даёт права\n  изменять другие проекты: разрешены только пути и службы AIpedia по\n  `docs/RELEASE.md` (`D-2026-09-26-shared-server-ssh`).\n- Причина: в `Auto` Claude Code на этой машине воспроизводимо блокирует SSH с\n  существующей identity (выпуск `aa48e11`, 2026-09-27: «Credential Exploration»,\n  затем «Self-Modification» при попытке добавить правило и «Auto-Mode Bypass»\n  при повторе после разрешения в чате). Явное разрешение владельца в чате этого\n  не снимает. Это ограничение среды, а не проблема SSH, сервера или проекта; его\n  не диагностировать заново.\n\n## D-2026-09-27-owner-acceptance-adaptive-ui\n\n- Статус: подтверждено владельцем (2026-09-27: «Adaptive Interface / Mobile &amp; Tablet UX\n  утверждаю. Визуальная приёмка владельца PASS»; проверен Local `http://127.0.0.1:18811/`,\n  ветка `feature/adaptive-ui`)\n- Решение: этап завершён в Local, код объединяется с `main`, карточка Timeline —\n  `done`. Утверждение **не** разрешает выпуск Production: он выполняется только\n  отдельной командой владельца на конкретный commit по `docs/RELEASE.md`.\n\n## D-2026-09-26-adaptive-layout\n\n- Статус: подтверждено владельцем (2026-09-27, приёмка этапа\n  `D-2026-09-27-owner-acceptance-adaptive-ui`)\n- Решение: адаптивность каталога строится CSS по реальному месту, а не по моделям\n  устройств. `&lt;main&gt;` — size-контейнер `catalog`: второстепенные колонки\n  сворачиваются по ширине каталога (в т.ч. при открытой панели), ниже 720 px строки\n  становятся карточками. Панель: ≥ 1280 px — рядом с таблицей; 721–1279 px — drawer\n  под шапкой с затемнением; телефон в portrait — экран под шапкой (меню языка,\n  поиск и тема остаются доступны, позиция списка восстанавливается); короткий\n  landscape — полноэкранный sheet. Ultrawide-оболочка — `max(2400px, 60vw)`.\n  Фильтр/Сортировка на touch и узком каталоге — нативные `&lt;dialog&gt;`-sheets; фильтр\n  переносит существующие контролы заголовков (одна форма), закрытие применяет\n  несохранённый выбор.\n- Источник: `docs/EXECUTION_STATE.md` (Adaptive Interface), `artifacts/adaptive-ui/`.\n\n## D-2026-09-26-timeline-owner-review-state\n\n- Статус: подтверждено владельцем (2026-09-27: карточка этапа прошла путь\n  «В работе» → «Ожидает подтверждения владельца» → «Выполнено» после приёмки)\n- Решение: в `docs/timeline.json` у `progress` добавлено состояние `review` —\n  «Ожидает подтверждения владельца / Ready for owner review»: работа реализована и\n  проверена исполнителем в Local, но не утверждена. Маркер — жёлтое кольцо с «!»\n  (не синяя галочка `done`). Перевод в `done` делает только владелец после\n  визуальной приёмки.\n\n## D-2026-09-27-release-qa-gate\n\n- Статус: подтверждено владельцем (2026-09-27, поручение довести v015 до\n  завершённого состояния: «Зафиксируй как постоянное правило»)\n- Решение: перед каждым выпуском каталога `catalog_master qa` должен пройти без\n  блокирующих ошибок. Опубликованная сущность с известным происхождением без\n  страны/флага — блокирующая ошибка; счётчики вкладки, таблицы, строк после полной\n  загрузки и базы обозначают один набор; активная модель с коммерческим API без\n  текущей цены, $0 без бесплатного тарифа, разработческие результаты как\n  независимые, источники с запретом републикации, записи без источника, дубли и\n  расхождения master ↔ Local ↔ Production — блокирующие ошибки.\n- Применимость: действительно не установленное (страна, официальная цена,\n  публикуемая независимая оценка) оформляется в master фактом `*_status` с\n  причиной и источником и попадает в очередь качества данных, а не в пустое поле.\n  Retired/archived модели не требуют текущей цены; открытые веса без API — тоже.\n- Номер № получают только записи с подтверждённой датой; счётчик каталога\n  поясняет число записей с № и без даты.\n\n## D-2026-09-26-shared-server-ssh\n\n- Статус: подтверждено владельцем (2026-09-26)\n- Решение: AIpediya и StratForge размещены на одной серверной машине.\n  Исполнителям AIpediya разрешено использовать существующий настроенный\n  SSH-доступ к этой общей машине для работ исключительно в контуре AIpediya.\n  Запрет «не трогать StratForge» относится к файлам, данным, процессам,\n  сервисам, туннелям, конфигурации и секретам StratForge, а не к самому факту\n  SSH-подключения к общей машине. Не читать, не копировать, не изменять и не\n  раскрывать приватные SSH-ключи; разрешено использовать уже настроенную SSH\n  identity для подключения к общей машине, если действия строго ограничены\n  контуром AIpediya. После подключения — сначала read-only проверка (hostname,\n  пользователь, `/srv/aipedia`, программа `aipedia`, текущий release, preflight).\n  Подробно — `AGENTS.md`, раздел «Общая серверная машина и SSH».\n- Заменяет: неоднозначные записи «StratForge-ключи не используются» и\n  трактовку SSH-канала как запрета на доступ к серверу.\n- Источник: уточнение владельца 2026-09-26.\n\n## D-2026-09-26-number-order\n\n- Статус: подтверждено владельцем (2026-09-26, замечание приёмки)\n- Решение: сортировка по номеру — по числовому `public_number`, строго вверх\n  (1, 2, 3…) или вниз; хронологические режимы `release_asc`/`release_desc`\n  (по умолчанию — новые сверху) упорядочены по ключу (дата выпуска, номер),\n  то есть совпадают с порядком master (дата, имя, Record ID) и при обратном\n  направлении разворачивают и записи с одинаковой датой; номера при этом\n  строго убывают/возрастают. Точные и приблизительные даты не группируются:\n  приблизительная дата остаётся приблизительной и участвует своим началом\n  периода. Записи без номера — в конце обоих направлений. Порядок задаётся до\n  пагинации; порции подгрузки продолжают его; ответ устаревшего запроса\n  подгрузки не добавляет строки. Фильтры номера не пересчитывают.\n- Причина исправленного дефекта (200 → 197 → 198): ключ хронологической\n  сортировки был одной датой, а `sorted(reverse=True)` сохраняет исходный\n  (возрастающий по номеру) порядок равных элементов.\n- Заменяет: в `D-2026-09-24-permanent-catalog-numbers` абзац «Сортировка по\n  выпуску: точная дата → приблизительная дата → неизвестные в конце».\n- Реализация: `catalog/comparison.py` (`release_order_key`), `static/site.js`,\n  тесты `catalog/tests/test_number_order.py`.\n\n## D-2026-09-26-gpt-live-1-classification\n\n- Статус: подтверждено владельцем (2026-09-26, замечание приёмки)\n- Решение: GPT-Live 1 — голосовая модель; публичная карточка —\n  `Models:gpt-live-1-60f09da9` (выпуск в ChatGPT Voice 2026-07-08 и доступ в API\n  2026-09-10 — разные события с источниками; тариф API $0.05/мин сессии,\n  посекундно, backend-модель и инструменты отдельно). Запись\n  `Tools:gpt-live-1-e666ccf6` — ARCHIVE («ошибочная классификация: модель\n  представлена как отдельный инструмент»), связь `Models:gpt-live-1-60f09da9`,\n  301 со старого адреса; цена и доступ перенесены к модели без потерь. ChatGPT\n  остаётся инструментом. Связь с каноном в другом листе записывается как\n  `Models:&lt;Record ID&gt;` / `Tools:&lt;Record ID&gt;`.\n- Источник: приёмка владельца 2026-09-26; master v014.\n\n## D-2026-09-26-owner-acceptance-v014\n\n- Статус: подтверждено владельцем (2026-09-26)\n- Решение: визуальная приёмка рабочего Local подтверждена владельцем с двумя\n  замечаниями (порядок номеров, GPT-Live 1); после их исправления и успешных\n  проверок разрешён выпуск на https://aipediya.com принятой Local-версии —\n  продолжение кандидата `954db5a4586b` с этими исправлениями и сопутствующими\n  изменениями данных, тестов и документации, без посторонней и незавершённой\n  параллельной работы; по `docs/RELEASE.md`, с серверным preflight и\n  остановкой при несовпадении.\n- Источник: сообщение владельца 2026-09-26.\n\n## D-2026-09-26-catalog-master-package\n\n- Статус: подтверждено владельцем (объём, семантика, нумерация, оценки AA —\n  поручения 2026-09-25 и два уточнения 2026-09-26); пакет v013 принят как\n  кандидат и применён **только к рабочему Local** для визуальной приёмки;\n  разрешения на Production нет.\n- Дата: 2026-09-26\n- Решение: действующий master — v013 (схема `aipediya-catalog-master/4`) в\n  `AI_CONTEXT/`, v001–v012 — неактивные резервные копии. Пакет публикации =\n  ядро (опубликованное на 2026-09-26: 304/138) + явно отобранные проверенные\n  дополнения (21); остальной исследовательский запас хранится в той же книге\n  непубличным и отложенным. `Publication Decision` — редакционное решение,\n  `Status` — допуск в пакет, `On Local/On Production` — наблюдение. ARCHIVE —\n  только обоснованное исключение с кодом, комментарием, датой и источником;\n  закрытие продукта или нехватка сведений не основание. Одна сущность — одна\n  карточка: aliases в колонке `Aliases`, дубль остаётся архивной строкой со\n  ссылкой на канон, его URL ведёт 301 на канон; спорное объединение к\n  существующей публичной карточке не применяется. Пустая ячейка не стирает\n  значение, `&lt;CLEAR&gt;` — явная очистка. Синхронизация master → Local —\n  `catalog_master sync-local`; неподдерживаемые изменения выводятся\n  предупреждением (контракт — `docs/CATALOG_MASTER.md`).\n- Нумерация (владелец 2026-09-26): Record ID и URL постоянные; Public Number —\n  хронологическая позиция публичной датированной записи, Models и Tools\n  отдельно; резерв и записи без даты без номера (в конце сортировки); сдвиги —\n  в Changelog и ревизиях Local. Заменяет правило постоянных номеров Local\n  (`D-2026-09-24-permanent-catalog-numbers`) и снимает открытый вопрос о номерах.\n- Оценки: 11 результатов Artificial Analysis без задокументированного основания\n  показа — `Public=NO` (хранятся, исключены из выдачи и расчётов).\n- Применено к рабочему Local: 309/140 публично (14 объединений ядра, 21\n  дополнение), нумерация, 30 описаний инструментов, переводы 1 020 пар в\n  пределах бесплатного F0 (`docs/history/2026-09-26-catalog-master-v013.md`).\n- Выпуск (кандидат проверен, не выполнен; окончательный кандидат —\n  `artifacts/catalog-master-v013-final/FINAL_CANDIDATE.json`): перенос на Production — план\n  `catalog_master release-plan` / `apply-plan` по Record ID с проверкой ожидаемых\n  старых значений, итоговыми номерами, одной транзакцией и ревизиями; встроен в\n  `deploy_code_release.py` (`--catalog-plan`, `--translations`). Кандидат\n  идентифицируется базовым commit + sha256 файлов (`data/release/v013/CANDIDATE_FILES.txt`).\n- Открыто: визуальная приёмка и команда на выпуск; Kimi K3 (max) и Grok Voice\n  API; основание показа оценок AA; 30 публичных неподдерживаемых дополнений\n  (очередь с блокерами, `docs/CATALOG_MASTER.md`).\n- Отклонено: публиковать все строки с прежним PUBLIC; архивировать закрытые\n  продукты; отдельная база для архива.\n- Источник: поручения владельца 2026-09-25 и 2026-09-26.\n\n## D-2026-09-25-product-history-layout\n\n- Статус: подтверждено владельцем для композиции Local-страницы.\n- Дата: 2026-09-25.\n- Решение: сверху две карточки — Local и Production. Git/сохранённый код\n  описывается в деталях последней открытой карточки таймлайна, без третьей\n  верхней карточки. Ярлык запуска истории хранится в `AI_CONTEXT`; порядок\n  сопровождения — `docs/PRODUCT_HISTORY.md` и `docs/timeline.json`.\n- Граница: это решение о виде и документации Local, не разрешение на\n  публикацию нового выпуска в Production.\n\n## D-2026-09-25-locale-paths\n\n- Статус: предложено (инженерное решение делегировано исполнителю мандатом\n  GSD-1.0 и реализовано в Local; владелец отдельно этот вариант **не**\n  согласовывал; разрешения на Production нет — только по `docs/RELEASE.md`\n  после утверждения выпуска GSD-1.0)\n- Дата: 2026-09-25\n- Сравнение на проекте. A — индексируемый `?lang=` (как на Production\n  `ed103a3`): Google в руководстве по многоязычным сайтам помечает URL-параметры\n  как «Not recommended»; язык «голых» адресов у нас зависел от cookie /\n  Accept-Language / страны, т.е. один URL отдавал разные языки (нужен\n  `Vary: Cookie`, риск смешения кэша); подборки и датасеты пришлось бы тоже\n  держать на параметрах. B — пути локалей: один язык на адрес, простой кэш,\n  hreflang/sitemap без параметров, подборки и страницы данных без особых\n  правил; цена — одноразовый 301 для всех старых ссылок и сопровождение\n  таблицы редиректов. Известные проиндексированные адреса — только то, что\n  видно без консолей: sitemap Production (443 `?lang=en` + 22 alternates);\n  входящие ссылки неизвестны (нет Search Console) — это не «их нет».\n  Выигрыш в ранжировании не утверждается.\n- Решение: B. English — на корне без префикса и служит `x-default`\n  (страница 200, self-canonical); остальные 21 локаль — `/&lt;код-в-нижнем-регистре&gt;/`\n  (`zh-hans`, `zh-hant`, `pt-br`). Язык определяется только путём; cookie,\n  Accept-Language, страна и User-Agent его не меняют; языковых/IP-редиректов\n  нет (Google: избегать автоматического перенаправления между языковыми\n  версиями). Ручной выбор запоминается только в браузере; сервер не выставляет\n  языковую cookie и ответы не варьируются по ней. Старые `?lang=`/`?kind=`,\n  `/en/…`, не канонические написания кода — один 301 без цепочек; неизвестные и\n  скрытые записи — 404. Единый построитель: `catalog/locale_urls.py`.\n  Карта редиректов — `docs/SEARCH_DISCOVERY.md` §1. Ключи переводов не менялись.\n\n## D-2026-09-25-seo-readiness\n\n- Статус: предложено (реализовано в Local)\n- Дата: 2026-09-25\n- Решение: одна политика публичности (`catalog/readiness.py`) для страниц,\n  hreflang, sitemap, подборок, датасетов и IndexNow; источник — действующий\n  контракт `published` (манифест `data/release_state.json`), XLSX на запросах\n  не читается, статусы автоматически не повышаются. Результат для каждой пары\n  запись × локаль: indexable / not-ready (noindex, вне sitemap/hreflang) /\n  not-public (404) с причиной. Основной текст — description (+ suitable,\n  limitations при наличии английского источника); вторичная проза и заметки\n  eval-gap могут показываться на английском с `lang=&quot;en&quot;` и не блокируют\n  индексацию. Отложенный eval-gap (412,820 billable chars; ранее записанный\n  дефицит F0 108,605) остаётся отдельным пунктом.\n\n## D-2026-09-25-facets-pagination\n\n- Статус: предложено (реализовано в Local)\n- Дата: 2026-09-25\n- Решение: индексируются чистые каталоги и их `?page=N` (в диапазоне,\n  self-canonical); `page=1` → 301, вне диапазона/мусор → 404. Любые фильтры,\n  поиск, сортировка — `noindex,follow` без canonical на корень; на карточках\n  такие параметры канонизируются к чистой карточке. `robots.txt` Production\n  запрещает только перечисленные фасетные параметры и `partial`, не трогая\n  `page` и пути локалей. Фрагменты `partial` — `X-Robots-Tag: noindex`.\n\n## D-2026-09-25-datasets-license-gate\n\n- Статус: предложено; требуется решение владельца о лицензии\n- Дата: 2026-09-25\n- Решение: две выгрузки (модели, инструменты) по allowlist полей, без скрытых\n  записей, описательной прозы и сторонних оценок. Лицензия от имени владельца\n  не назначается (`license: not-granted`). На Production выгрузки выключены\n  (`AIPEDIA_DATASETS_PUBLIC=0`) до решения владельца о лицензии.\n\n## D-2026-09-25-discovery-outbox\n\n- Статус: предложено (реализовано в Local; отправки на Production не включены)\n- Дата: 2026-09-25\n- Решение: IndexNow через журнал `DiscoveryEvent` (миграция 0018) и команду\n  `indexnow_dispatch`, без брокера/Redis/планировщика. Реальная отправка —\n  только Production + `AIPEDIA_INDEXNOW_ENABLED=1` + ключ + `--send`, после\n  проверки, что Production уже отдаёт новое состояние. Local только пишет\n  журнал и делает dry-run. `notify_indexnow` больше не отправляет, а ставит в\n  журнал (исправлена ошибка `--all`, распаковывавшего словари как кортежи).\n\n## D-2026-09-25-training-crawlers-undefined\n\n- Статус: не определено владельцем (фиксация факта, не решение)\n- Дата: 2026-09-25\n- Факт: политики владельца о доступе training-краулеров (GPTBot, ClaudeBot,\n  Google-Extended и др.) в журнале нет. Текущий robots.txt не содержит правил\n  для отдельных AI-агентов; GSD-1.0 этот baseline не меняет (добавлены только\n  правила для параметров под `User-agent: *`). Отсутствие блокировки —\n  унаследованное состояние, а **не** утверждённая политика allow-all. Выбор\n  политики — отдельное решение владельца вне GSD-1.0.\n\n## D-2026-09-25-release-process\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-25\n- Решение: выпуск идёт по схеме Develop on Local → QA Local → владелец\n  утверждает выпуск → Production приводится к утверждённому Local-состоянию →\n  commit, tag и changelog. Утверждение относится ко всему проверенному\n  Local-состоянию (видимость, сортировка, переводы, отображение); отдельные\n  внутренние изменения внутри него повторно не согласуются. Local SQLite не\n  копируется: код — архивом, схема — `migrate` серверной БД, видимость и\n  постоянные номера — манифестом `data/release_state.json`\n  (`manage.py sync_publication_state`, через `save()` с журналом\n  `sync_release_state`, отказ при любом расхождении номеров).\n- Первое применение: `release-2026-09-25-local-approved` — на Production\n  304 публичные Models и 138 Tools; 459 research-моделей скрыты без удаления\n  (снимает открытый вопрос о 459 NEEDS_REVIEW на Production).\n- Источник: поручение владельца 2026-09-25; процесс — `docs/RELEASE.md`.\n\n## D-2026-09-24-catalog-master\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-24\n- Решение: `AI_CONTEXT/AIpediya_Model_Verification_Master.xlsx` — единая\n  каноническая база AIpediya и главный рабочий реестр, из которого в\n  дальнейшем синхронизируется сайт. Основные листы `Models` и `Tools` содержат\n  все записи без исключения (опубликованные, скрытые кандидаты, новые\n  находки) со всеми публичными данными и verification metadata; связанные\n  листы — Offers, Evaluations, Access, Facts, Origins, Tool Platforms; журнал —\n  `Changelog`. Status только `PUBLISHED` / `NEEDS_REVIEW`. `Record ID` (slug) не\n  меняется никогда. `Public Number` — хронологический номер по verified\n  release date среди `PUBLISHED` (точная, иначе `≈` дата; равные даты — по\n  имени, затем Record ID — как прежний `chronology_plan`); новая модель\n  получает следующий номер, найденная позже историческая встаёт на своё\n  место, последующие номера пересчитываются, изменения пишутся в\n  `Changelog`. Порядок: master → (PUBLISHED) → Local → Production по\n  `docs/RELEASE.md`.\n- Реализация: `catalog/catalog_master.py`, `manage.py catalog_master\n  import|check` (только чтение базы; `--production` читает публичный\n  sitemap). Импорт 2026-09-24: Models 763 (304 PUBLISHED + 459 NEEDS_REVIEW),\n  Tools 138 PUBLISHED, Offers 555, Evaluations 881, Access 1205, Facts 10,\n  Origins 812, Tool Platforms 224; drift с Local 0. Синхронизация master →\n  Local ещё не реализована.\n- Заменяет: `D-2026-09-24-model-verification-registry` (5 статусов) и\n  правило постоянных номеров из `D-2026-09-24-permanent-catalog-numbers`.\n- Отклонено: вести отдельный реестр только для кандидатов; хранить\n  непроверенные ссылки импорта как Official Source.\n- Источник: поручение владельца 2026-09-24.\n\n## D-2026-09-24-model-verification-registry\n\n- Статус: заменено новым решением (`D-2026-09-24-catalog-master`)\n- Дата: 2026-09-24\n- Решение: `AI_CONTEXT/AIpediya_Model_Verification_Master.xlsx` —\n  обязательный verification-layer перед публикацией модели в AIpediya. В нём\n  все скрытые модели Local (на 2026-09-24 — 459, все `TO_VERIFY`) и все\n  будущие кандидаты. Статусы `TO_VERIFY / VERIFIED / READY_FOR_SITE /\n  PUBLISHED / REJECTED`; публикация только после `VERIFIED` и только строк\n  `READY_FOR_SITE`. Exact date — только подтверждённая; иначе надёжная `≈`\n  дата первого публичного существования; `Exists` ≠ `YES` (future/rumor/\n  unconfirmed) — запись только в таблице. Опубликованная модель получает\n  постоянный `public_number` (см. `D-2026-09-24-permanent-catalog-numbers`).\n  Колонка `Missing Data` показывает недостающее до `VERIFIED`.\n- Реализация: `catalog/verification_master.py`, команда\n  `manage.py verification_master sync|check` (только чтение базы; ручные\n  колонки при sync не перезаписываются). Ссылки и даты из исследовательского\n  импорта **не** переносятся в Official Source / даты: они лежат в служебных\n  колонках `Import Sources (unverified)` / `Research Date Hint` (в 29 скрытых\n  записях импортный источник — заглушка Smithsonian Mark I Perceptron).\n- Отклонено: публиковать скрытые модели без строки в реестре; заполнять\n  Official Source/даты непроверенными значениями импорта.\n- Источник: поручение владельца 2026-09-24; порядок — `AGENTS.md`, раздел\n  «Реестр верификации моделей».\n\n## D-2026-09-23-controlled-term-localization\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-23\n- Решение: контролируемые человекочитаемые метки каталога (метки разработчика/\n  провайдера вроде «Самостоятельно», единицы биллинга, метки ценовых условий,\n  метки конфигурации/протокола оценок), исторически записанные по-русски,\n  локализуются детерминированно на все 22 локали в коде\n  (`catalog/controlled_terms.py`, `catalog/evaluation_labels.py`) — без Azure и\n  без изменения данных. Бренды, ID моделей, имена тарифов (`Pro`, `Max`,\n  `Standard`, `ChatGPT Pro`, `Pay-as-you-go`), API/SDK/IDE, разрешения и URL не\n  переводятся; английский — только аварийный fallback, не штатный результат для\n  поддерживаемой локали. Украинский переводится (кириллический алфавит — не\n  русская утечка).\n- Отклонено: оставлять русские метки или английский fallback как штатный\n  результат для 22 языков; использовать Azure для этих меток.\n- Источник: поручение владельца 2026-09-23 (после находки «Модель» на корейской\n  странице); аудит всех 22 локалей — 0 русских утечек, 0 английского fallback на\n  поддерживаемых локалях.\n\n## D-2026-09-23-brand-vs-tech-name\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-23\n- Решение: публичное имя и домен — **AIpediya** / `aipediya.com`. Внутренний\n  техкод остаётся **aipedia** (без `y`): Django-пакет, `/srv/aipedia`,\n  SQLite-имена, `AIPEDIA_*`, cookie/localStorage, unix-user, Supervisor,\n  ярлыки «AIpedia — Local», исторические имена файлов и research-batch.\n  Расхождение написания — намеренное; не считать ошибкой и не «выравнивать».\n- Отклонено: массовое переименование пакета, серверных путей, env, user и\n  Supervisor в `aipediya` ради единообразия; трогать туннель или StratForge.\n- Источник: уточнение владельца 2026-09-23; видимый бренд уже в UI с\n  2026-09-22; кратко в `AGENTS.md` («Имена: бренд и техкод»).\n\n## D-2026-09-23-panel-ui-and-translation-transfer\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-23\n- Решение: (1) правая панель каталога закрывается по клику вне её, по Escape и\n  по крестику; клики внутри панели, по шапке (язык/поиск/тема), по ссылке строки\n  и по фильтру колонки её не закрывают. (2) Слои z-index зафиксированы шкалой\n  (`--z-panel` 30 &lt; `--z-header` 40 &lt; `--z-popover` 50); на узких экранах панель\n  начинается ниже шапки (`--aip-header-h`), поэтому языковое меню и его список\n  всегда доступны и рисуются над панелью. (3) Перенос переводов между базами\n  выполняется идемпотентными командами `export_translations`/`import_translations`\n  по ключу slug+поле+язык+sha256(английского источника); импорт не вызывает\n  провайдер и применяет перевод только при совпадении английского источника.\n- Отклонено: закрывать панель добавлением затемняющего фона (меняет desktop-вид);\n  копировать Local SQLite поверх серверной базы для переноса переводов.\n- Источник: явный финальный мандат владельца 2026-09-23; `docs/RELEASE.md`.\n\n## D-2026-09-24-permanent-catalog-numbers\n\n- Статус: заменено новым решением (`D-2026-09-24-catalog-master`) в части\n  нумерации: номера снова хронологические и пересчитываются при вставке\n  исторической записи. Правило дат (`≈`, сортировка) остаётся в силе.\n  Незакоммиченный код Local ещё реализует постоянные номера.\n- Дата: 2026-09-24\n- Решение: публичный номер (`catalog/public number`) — постоянный идентификатор\n  каждой опубликованной записи, в двух независимых последовательностях (Модели,\n  Инструменты). Номер присваивается один раз и после присвоения **не меняется**\n  при правке даты, цены, оценки или смене сортировки; фильтры и сортировки его\n  не пересчитывают. Уже присвоенные номера сохраняются; недостающие\n  проставляются один раз детерминированно (по имени, затем slug), продолжая\n  каждую последовательность от текущего максимума; новая запись получает\n  следующий свободный номер. Снятая с публикации запись номер сохраняет.\n- Даты и сортировка: дата и номер разделены. Точная дата выпуска показывается\n  обычно; при отсутствии точной, но наличии надёжной приблизительной —\n  отдельная «приблизительная дата публикации/выпуска», рисуется с префиксом\n  `≈` по своей точности (`≈ сен 2024` для месяца, `≈ 21 сен 2024` для дня),\n  с источником и уверенностью, и **никогда** не выдаётся за точную; иначе поле\n  пустое. ~~Сортировка по выпуску: точная дата → приблизительная дата →\n  неизвестные в конце.~~ [ЗАМЕНЕНО `D-2026-09-26-number-order`: ключ (дата,\n  номер), точные и приблизительные даты не группируются.] Дату git-коммита/репозитория за дату выпуска без\n  доказательства не выдавать.\n- Заменяет: `D-2026-09-20-chronology-numbers` и `D-2026-09-20-undated-last`\n  (правило «номер только при подтверждённой дате; недатированные без номера»).\n- Источник: поручение владельца 2026-09-24; `catalog/chronology.py`,\n  `catalog/migrations/0016_approx_dates_and_permanent_numbers.py`,\n  `catalog/comparison.py`, `catalog/views.py` (чистый `/` по дате убыв.).\n\n## D-2026-09-18-two-page-catalog\n\n- Статус: заменено новым решением\n- Решение: публичный сайт — справочник из каталога (таблица) и карточки модели. RU/EN, без маркетингового блока и без третьего публичного шаблона.\n- Заменено: `D-2026-09-21-catalog-panel`. Старые адреса `/models/&lt;slug&gt;` сохраняются.\n- Источник: исходное поручение и `README.md`\n\n## D-2026-09-18-missing-not-zero\n\n- Статус: подтверждено владельцем\n- Решение: неизвестные значения оставлять пустыми, не подставлять ноль. Неизвестные в сортировке — в конце.\n- Источник: `README.md`, `docs/COMPARISON_RULES.md`\n\n## D-2026-09-20-chronology-numbers\n\n- Статус: заменено новым решением\n- Дата: 2026-09-20\n- Решение: публичные номера следуют подтверждённым датам выпуска точной версии (сначала старые). URL, pk и slug — идентичность, не номер.\n- Заменено: `D-2026-09-24-permanent-catalog-numbers` (постоянные номера, не зависящие от даты; сортировка по дате отдельно).\n- Источник: `docs/COMPARISON_RULES.md`, `docs/history/2026-09-20-chronology-release.md`\n\n## D-2026-09-20-undated-last\n\n- Статус: заменено новым решением\n- Решение: карточки без доказанной даты выпуска остаются доступны, без номера, в конце любого хронологического направления. Дату репозитория и дату проверки не выдавать за дату выпуска.\n- Заменено: `D-2026-09-24-permanent-catalog-numbers` (недатированные теперь тоже нумеруются; в конце сортировки по дате остаются только записи без точной и приблизительной даты).\n- Отклонено: выдуманная датировка, чтобы пронумеровать все 255.\n- Источник: `docs/history/2026-09-20-chronology-release.md`\n\n## D-2026-09-20-local-production-split\n\n- Статус: подтверждено владельцем\n- Решение: одна кодовая база, два окружения. Local — loopback и отдельная SQLite. Production — https://aipediya.com/. Кнопка Production только открывает публичный сайт.\n- Отклонено: считать commit, push или кнопку Production публикацией.\n- Источник: поручение владельца, `AGENTS.md`, `docs/RELEASE.md`\n\n## D-2026-09-20-no-sqlite-overwrite\n\n- Статус: подтверждено владельцем\n- Решение: локальную SQLite никогда не копировать поверх `/srv/aipedia/data/aipedia.sqlite3`. Code-only выпуск: `tools/build_code_release.py` и `tools/deploy_code_release.py`.\n- Отклонено: использовать `tools/deploy_release.py` / `tools/deploy_chronology.py` для обычного обновления кода.\n- Источник: `docs/RELEASE.md`\n\n## D-2026-09-20-keep-site-and-history\n\n- Статус: подтверждено владельцем\n- Решение: сайт не пересоздавать; сохранять git-историю, номера, цены, оценки и ссылки. StratForge, туннель и секреты Production не трогать.\n- Источник: поручения владельца, `AGENTS.md`\n\n## D-2026-09-22-publish-complete-local-state\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-22\n- Решение: опубликовать на `https://aipediya.com/` полное текущее состояние\n  Local после reconciliation, разделения моделей/инструментов, исправления\n  каталога и визуального бренда `AIpediya`; после deploy проверить данные,\n  версию и публичный интерфейс.\n- Ограничение: только code-only архив с data migration по `docs/RELEASE.md`;\n  Local SQLite не копировать, существующую серверную историю не удалять.\n- Источник: прямая команда владельца на публикацию текущей Local-версии.\n\n## D-2026-09-20-desktop-shortcuts\n\n- Статус: подтверждено владельцем\n- Решение: ярлыки «AIpedia — Local» и «AIpedia — Stop Local» размещать в фактической папке рабочего стола Windows (`DesktopDirectory`), не подставляя путь вручную. Папку рабочего стола не переносить, OneDrive не отключать.\n- Источник: поручение исправить размещение ярлыков\n\n## D-2026-09-21-transfer-pack\n\n- Статус: подтверждено владельцем\n- Решение: живой статус — `docs/EXECUTION_STATE.md`. Пакет нового чата собирается в `AI_CONTEXT/` из документов проекта. Исполнитель обязан обновлять статус и собирать пакет; скрипт пишет только факты.\n- Отклонено: вручную вести вторую независимую копию каждого документа; складывать в пакет секреты, `.env` и полные SQLite.\n- Источник: поручение организовать документацию состояния\n\n## D-2026-09-21-catalog-panel\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-21\n- Решение: основной сценарий Local — компактная таблица каталога и правая информационная панель. Старые адреса карточек открывают ту же запись в новом интерфейсе. Без React/Next.js, отдельного API-сервера, Node.js в runtime, Redis и очереди.\n- Заменяет: `D-2026-09-18-two-page-catalog` в части отдельной страницы карточки как основного вида.\n- Источник: поручение реализовать утверждённый макет в Local\n\n## D-2026-09-21-rating-and-cabinet-later\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-21\n- Решение: колонка и блок «Рейтинг AIpedia» есть, формула и расчёт не делаются. «Сохранить» неактивна до личного кабинета; избранное в localStorage не создавать. Новые данные, импорт и пересчёт оценок — отдельный следующий этап после визуальной приёмки.\n- Отклонено: подставлять Epoch ECI, чужой процент или «75%» из макета как рейтинг AIpedia; объявлять кабинет готовым.\n- Источник: поручение по редизайну, пп. 7–8\n\n## D-2026-09-21-approved-visual-reference\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-21\n- Решение: файл `artifacts/visual-polish-2026-09-20/approved-reference.png` — утверждённый визуальный эталон доводки Local. Сопоставлять композицию, графитовую палитру, орбитальную графику, типографику, геометрию таблицы и правой панели; не копировать демонстрационные числа и не использовать скриншот фоном страницы.\n- Контрольная сумма SHA-256: `D9F2689016703FDC8785A2CFA08657EF6532785ACC41E1263F0DAB2507EE5C50`.\n- Исходное состояние владельца: `artifacts/visual-polish-2026-09-20/before-user-current.png`, SHA-256 `66FCCB9F5A85334482593B9FFDC17D86882DBC6FAEA5C741DC5064AD53D377E2`.\n- Источник: прямое поручение владельца и приложенные изображения.\n\n## D-2026-09-21-developer-marks\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-21\n- Решение: рядом с названием модели показывать знак **разработчика** (организации),\n  а не отдельный логотип каждой версии. Файлы в `static/marks/`, сопоставление\n  в `catalog/marks.py`. Без знака — нейтральный инициал. Знак один на\n  организацию (GPT и DALL·E — OpenAI; все Gemini — Google).\n- Источник: прямое поручение исправить иконки по эталону макета.\n\n## D-2026-09-21-model-tool-catalog-split\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-21\n- Решение: публичный каталог имеет только две самостоятельные вкладки —\n  «Модели» и «Инструменты». Вкладки «Все» нет. Модели читаются из\n  `ModelVersion(entry_type=model)`, инструменты — из отдельной таблицы `Tool`;\n  для сохранения прежних цен, доступов и истории `Tool.legacy_version` защищённо\n  ссылается на исходную строку `ModelVersion`.\n- Нумерация: у моделей и инструментов две независимые последовательности\n  постоянных номеров (см. `D-2026-09-24-permanent-catalog-numbers`). Номер\n  присваивается один раз и не пересчитывается; сортировка по дате выпуска —\n  отдельный слой поверх постоянных номеров.\n- Представление: Models и Tools имеют разные query/view model, конфигурации\n  колонок, фильтры, строки и содержимое правой панели. Tool panel не показывает\n  контекст, model benchmark и AIpedia Model Rating.\n- Источник: прямое поручение владельца о разделении каталога.\n\n## D-2026-09-21-model-origin-country\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-21\n- Решение: происхождение модели хранится как нормализованная связь\n  `ModelOriginCountry` с ISO 3166-1 alpha-2, источником и датой проверки.\n  Связь допускает несколько стран. Неизвестная страна остаётся без связи и без\n  фиктивного флага. UI использует локальный SVG-спрайт `static/flags.svg`.\n- Источник: прямое поручение владельца; официальные профили организаций,\n  сохранённые как `Source`.\n\n## D-2026-09-21-tool-platform-evidence\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-21\n- Решение: платформы инструментов нормализованы через `Platform` / `ToolPlatform`.\n  Общее подтверждение Desktop/Mobile не расширяется до Windows/macOS/Linux или\n  iOS/Android без отдельного источника. Локальный клиент не считается локальным\n  inference; это отдельное поле `local_execution` (`Да` / `Нет` / `Гибрид` / пусто).\n- Источник: прямое поручение владельца не подменять неизвестные значения.\n\n## D-2026-09-22-i18n-22-languages\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-22\n- Решение: интерфейс и таксономия каталога локализованы на 22 языка. English —\n  канонический язык, `x-default` и итоговый fallback. Локаль в существующем\n  query-параметре `?lang=` (URL не меняются). Приоритет определения языка:\n  URL → cookie `aipedia_lang` → `Accept-Language` → слабый хинт `CF-IPCountry`\n  → English. Ручной выбор сохраняется в cookie и не переопределяется гео.\n  Статические переводы UI и категорий хранятся в коде\n  (`catalog/ui_translations.py`, резолвер `catalog/context.t`/`category_label`),\n  а не только в SQLite. Динамический контент каталога использует English\n  fallback при отсутствии перевода. `ar` и `fa` работают в RTL через логические\n  CSS-свойства. Фактические поля (названия, компании, URL, цены, числа, даты,\n  API identifiers) не переводятся.\n- Отклонено: 22 независимые копии каталога; переход на path-based `i18n_patterns`\n  с потерей старых URL; перевод фактических данных; дублирование канонических\n  данных ради каждого языка.\n- Источник: прямое поручение владельца полностью реализовать мультиязычность.\n\n## D-2026-09-22-dynamic-translation-pipeline\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-22\n- Решение: подготовлен provider-agnostic pipeline автоматического перевода\n  будущих динамических данных каталога. English — источник; перевод привязан к\n  sha-256 hash исходного английского текста (`catalog.ContentTranslation`),\n  состояния `current` / `outdated` / `missing` / `reviewed`. Изменение source\n  автоматически (сигнал `pre_save`) делает перевод устаревшим и возвращает\n  English fallback до повторного перевода. Перевод выполняется один раз при\n  добавлении/изменении данных (команда `translate_catalog`, backfill,\n  импорт-хук), не при просмотре. Provider абстрагирован; первый — Microsoft\n  Azure Translator (ключ только из env `AIPEDIA_AZURE_TRANSLATOR_KEY`), для\n  Local/тестов — offline mock. Ошибка провайдера не ломает сохранение модели и\n  сайт. Реальный внешний API в тестах не вызывается.\n- Отклонено: перевод через API на каждый просмотр; хранение ключа в коде/Git;\n  замена статических 22-язычных переводов UI runtime-переводом.\n- Ограничение: Production не публикуется; существующие данные не меняются.\n- Источник: прямое поручение владельца добавить независимый этап pipeline.\n\n## D-2026-09-23-dynamic-translation-finalization\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-23\n- Решение: локализация доведена до фактически законченного состояния — каждый из\n  22 языков отдаёт реально локализованный каталог, а не переведённые кнопки\n  вокруг английской карточки. Выполнен реальный Azure backfill (F0, eastus2):\n  901 объект, 360 запросов, 1 680 285 биллинг-символов (&lt; 2M бесплатного лимита),\n  42 260 `ContentTranslation` (все `current`), dedup через translation memory.\n  Страны локализованы детерминированным код-слоем `catalog/countries.py`\n  (ISO2 × 22 языка). Прозаические поля моделей/инструментов переведены; бренды,\n  model IDs, API/URL, цены, числа, `ecosystem` (бренд-названия) не переводятся.\n  `privacy.html` локализована на 22 языка (`catalog/static_pages.py` + overlay).\n- Штатный авто-перевод: `AIPEDIA_AUTO_TRANSLATE` — реальная включаемая функция\n  (не отключённый эксперимент): `post_save` хук переводит новый/изменённый\n  объект после commit; массовые импорты используют `suppress_auto_translation()`\n  и один пакетный `translate_catalog`. Включено в `deploy/aipedia.env.example`\n  (Production) и Local `.env.local`; в коде по умолчанию off (тесты/миграции).\n- Ревизии: удалены 765 технических translation-ревизий, созданных старым\n  процессом до guard (точная контент-сигнатура, id 4355–5119, с резервной копией\n  БД и доказательством сохранности реальной истории: baseline 4354 восстановлен,\n  ни одна модель не потеряла историю). Далее guard исключает машинные записи\n  перевода из журнала ревизий.\n- Защита технических токенов (`catalog/token_guard.py`): машиночитаемые токены\n  (`1M`/`128K`/`7B`/`405B`, версии/ID `gpt-5-pro`/`GPT-5.2`, `API`/`OCR`, URL)\n  оборачиваются в `translate=&quot;no&quot;` и провайдер шлёт `textType=html`, поэтому\n  Azure не превращает их в слова/единицы (реальный дефект `1M → ۱ متр`). Уже\n  сохранённые искажения класса «число+единица» (232 пары) отремонтированы\n  точечно `repair_token_distortions` (17 запросов, 23 396 символов, 0 ревизий);\n  транслитерации имён в индийских/CJK письменностях оставлены (смена письма, не\n  семантика; slug/ID/заголовки — латиница; полный ремонт вышел бы за F0).\n- `methodology.html` **не удалять**: сейчас orphaned/404, публичную локализованную\n  Methodology page отдельно сделает следующая задача Global Search &amp; Discovery.\n- Заметки покрытия оценок `evaluation_gap` (AIpediya-авторская проза) не\n  переведены: после классификации/dedup нужно **412 820** billable-символов, в\n  остатке F0 — **304 215**, дефицит **108 605**. Платные расходы и template-хак\n  запрещены. Очередь на следующий период F0 quota:\n  `AIpediya-authored eval-gap remaining: 412,820 billable chars; current shortfall: 108,605`.\n  Эта часть **НЕ считается завершённой**; всё остальное локализовано.\n- Хранилище переводов keyed by locale code и не привязано к URL-схеме: данные и\n  translation pipeline переживут смену URL без миграции переводов. Отдельный\n  этап Global Search &amp; Discovery позднее изменит routing, reverse, `canonical`,\n  `hreflang`, `sitemap`, переключатель и редиректы (`/uk/…`, `/de/…`) — это\n  работа того этапа, а не текущего pipeline.\n- Ограничение: Production не публикуется; commit/push — только по отдельной\n  команде владельца; тариф F0 не менялся, платные ресурсы не создавались.\n- Источник: прямое поручение владельца довести локализацию до 100 %.\n\n## Открыто, не требование\n\n- Лицензия нового кода пока не назначена владельцем (`README.md`).\n- Реклама выключена, пока нет одобрения и контакта (`docs/SEARCH_DISCOVERY.md`).\n- 43 карточки без доказанной даты выпуска: нумерация всех 255 без новых источников не заявляется.\n- (Заменено 2026-09-27, `D-2026-09-27-all-published-numbered`.) Прежнее\n  допущение о публичных Tools без номера больше не действует; 459 скрытых\n  моделей были сняты с Production выпуском 2026-09-25.\n\n## D-2026-09-27-all-published-numbered\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-27\n- Решение: каждая опубликованная Model и Tool с достоверной идентичностью\n  должна иметь хронологический Public Number. Точный день выпуска ставится\n  только по доказательству официального релиза. Иначе фиксируется лучшая\n  доказуемая приблизительная дата первого публичного существования с `≈` и\n  объяснением в evidence; датированная публикация может доказывать\n  существование к этой дате, но не становится точной датой релиза.\n  `catalog_master check` блокирует PUBLISHED без exact или approximate date.\n- Для текущего пакета Tools: 143 опубликованы, 143 пронумерованы 1–143,\n  60 точных и 83 приблизительных дат в master. Diff сначала проверен на копии,\n  затем принят владельцем и применён к рабочей Local штатным sync-local.\n  Владелец отдельно разрешил выпуск именно этого проверенного Local-состояния\n  на Production; серверный preflight и проверка после выпуска обязательны.\n- Источник: прямое уточнение владельца в задаче Tools 143 и targeted\n  verification 21 оставшейся записи.\n\n## D-2026-09-27-canonical-production-server-access\n\n- Статус: подтверждено владельцем\n- Дата: 2026-09-27\n- Решение: единый проверенный транспорт для AIpediya — SSH alias\n  `aipediya-prod` в пользовательском SSH config и project wrapper\n  `python tools/server.py`. Исполнители начинают с `preflight`, не ищут\n  credentials, не читают private key и не собирают вручную SSH/SCP для\n  регулярных операций. Host-key verification остаётся строгой.\n- Общая физическая машина разрешена; граница доступа определяется проектом:\n  `/srv/aipedia`, его БД/backups/releases, `/tmp/aipedia-*` и программа\n  `aipedia`. Другие приложения, включая StratForge и TradeForge, вне scope.\n  Новые проекты получают собственный alias, root, service, DB, backup namespace\n  и release tooling на том же транспорте.\n- Codex и Claude Code используют один wrapper. При блокировке Auto в Claude\n  владелец переключает Manual/Ask, исполнитель повторяет ту же команду;\n  повторная диагностика SSH и поиск другого ключа не требуются. Codex handoff\n  остаётся запасным вариантом.\n- Источник: прямое поручение владельца стандартизировать Production server\n  access перед продолжением утверждённого выпуска `cf4ac9a33f8d`.\n\n## D-2026-09-27-independent-evaluation-evidence-policy\n\n- Статус: подтверждено владельцем 2026-09-28 в части направления и политики «Результаты разработчика» (аудит `EVAL-EVIDENCE-AUDIT-2026-09-27`); выпуск на Production — только после визуальной приёмки Local\n- Дата: 2026-09-27\n- Решение (evidence-слой master для будущего AIpediya Rating):\n  `Independent=YES` — только если прогон сделан не разработчиком модели;\n  `Public=YES` — только при доказанной открытой лицензии на **сами результаты**\n  (лицензия кода репозитория не считается). Неясная лицензия → `Public=NO`.\n  Результаты разработчиков — `Result Kind=developer`, `Independent=NO`.\n  Таблицы конкурирующих разработчиков, бенчмарки, которые ведёт компания-разработчик\n  (GDPval/OpenAI, CRI с Anthropic, CL-bench/Tencent, CursorBench, FrontierCode,\n  ALE-Bench/Sakana), сохраняются с `rating_eligible=false`.\n- Точная версия: Record ID ↔ имя в источнике сопоставляется вручную\n  (`tools/eval_audit_2026_09_27_map.py`); другие API-снапшоты, base/instruct,\n  preview/GA, квантизации (FP8/NVFP4/GGUF) и сторонние хостеры open weights\n  не переносятся. Режимы effort/thinking/harness — это `Configuration`.\n- Нормализация: исходный score и шкала всегда в `Conditions Extra (JSON)`;\n  процент — только из ограниченной шкалы 0–1/0–100; Elo/Arena, WER, $, минуты,\n  speedup и корреляции не превращаются в %.\n- `independent_evaluation_status` есть у каждой модели master: available /\n  found_but_not_republishable / only_developer_reported / exact_version_not_found /\n  identity_ambiguous / not_applicable / gap, с проверенными источниками и следующим шагом.\n- Пересмотр прежнего ограничения: официальный датасет\n  `lmarena-ai/leaderboard-dataset` опубликован под CC BY 4.0 — это основание\n  показывать Arena-оценки **из этого датасета** (не с сайта arena.ai) с атрибуцией.\n  Artificial Analysis, LiveBench и SWE-bench остаются `Public=NO`. Epoch AI:\n  CC BY 4.0 только для собственных прогонов; внешние данные хаба сохраняют\n  исходные лицензии (страница use-this-data).\n- Источник: отчёт `artifacts/eval-audit-2026-09-27/REPORT.md`.\n- Дополнение этапа 2 (2026-09-28; политика результатов разработчика **подтверждена владельцем** 2026-09-28):\n  - Формулировка владельца: результаты разработчика разрешено публично показывать во вкладке «Проверки» с явной\n    маркировкой «Результаты разработчика» / `Developer-reported`; их нельзя выдавать за стороннюю независимую\n    оценку и нельзя смешивать с Independent Rating без отдельной будущей формулы AIpediya Rating.\n  - Итоговая классификация карточки (`final_class` в факте): independent_public / independent_and_developer /\n    independent_research_only / developer_reported / no_published_numerical_evaluation / exact_version_not_found /\n    identity_ambiguous / not_applicable. «Любая проверенная численная оценка» = карточка имеет хотя бы одну строку\n    независимого, research-only, developer или составного слоя, кроме строк-дублей и строк другой версии.\n  - **Слои не смешиваются:** Independent Evidence / Developer Evidence / AIpedia Rating /\n    Value Rating. Собственные цифры разработчика о своей точной версии (model/system card,\n    технический отчёт, статья, официальная таблица или подписанный график) показываются на\n    карточке с атрибуцией как «Результаты разработчика»: `Result Kind=developer`,\n    `Independent=NO`, `Public=YES`, `rating_eligible=false`; в сравнение и сортировку\n    каталога не входят. Значения с графиков переносятся только при подписанных числах;\n    неподписанные графики и относительные утверждения («+15%») не переносятся.\n  - **Замеры конкурентов** (разработчик A измерил модель B в своём материале) —\n    `Result Kind=independent`, `Public=NO`, `rating_eligible=false`, на карточке — только\n    имя без баллов в отдельной строке «замеры конкурентов».\n  - **Research-only:** независимые результаты без открытой лицензии показываются нейтральным\n    статусом с именами оценщиков, без баллов.\n  - **Статусы:** independent_public / independent_nonpublic / developer_reported /\n    no_published_numerical_evaluation / exact_version_not_found / identity_ambiguous /\n    not_applicable (список `statuses` в факте; `gap` — только у NEEDS_REVIEW вне проверки).\n  - **Разные продукты под одним именем группы:** «pro»-режимы с параллельными вычислениями\n    (например, GPT-5.6 Sol Pro) не прикрепляются к базовой модели; округлённые повторы\n    одного и того же наблюдения скрываются в пользу точного.\n  - Источник: `artifacts/eval-audit-2026-09-27/stage2/REPORT.md`.\n<\/pre><\/article><\/template>\n<template data-history-source-template=\"release\"><article class=\"ph-detail ph-source-document\"><p class=\"ph-lead\">Порядок выпуска / Release procedure<\/p><pre># Ручной выпуск AIpedia\n\nПорядок допуска исполнителей — корневой `AGENTS.md`; этот файл описывает выпуск,\nа не дублирует те правила. Текущая локальная работа — `docs/EXECUTION_STATE.md`;\nстрока ниже про опубликованный commit не означает, что GitHub и Local совпадают\nс Production.\n\nPush в GitHub **не** публикует сайт. Ярлык Local, кнопка Production, commit и push\nсами по себе не выполняют deploy.\n\nТекущий публичный выпуск — **Language switching, Release #014 · v0.13.1**,\n2026-09-29: проверенный исходный commit\n`77e7f53cd8aa621b392d52d5b5ae8851ab77456c`, deployed code-candidate id\n`1ac95d75b7a6d80eb24301f352a88275c28d4bce`. Архив\n`aipedia-code-1ac95d75b7a6.zip`, SHA-256\n`2d3859774837a7d9f4a256554b153811c3da8105195bb6afda0240da07e7588a`.\nIsolated suite 332 OK (1 skip), server preflight/trial/dry-run/deploy,\n`verify-release`, `catalog_master qa --production` и Public QA 1657/1657 PASS;\nпубличный браузер подтвердил Español через меню, открытые Model/Tool,\nBack/Forward, mobile 375 px и RTL ar/fa без ошибок console/network. Каталог\n325 Models / 147 Tools неизменен. Backup:\n`/srv/aipedia/backups/aipedia-before-code-20260929T130406Z.sqlite3`.\nОтчёт — `docs/history/2026-09-29-language-switch-release.md`; Timeline #014 закрыта.\nPerformance #015 ведётся отдельно и в этом архиве отсутствует.\n\n### Предыдущий публичный выпуск — Reconciliation / cleanup #013\n\nReconciliation / cleanup, Release #013 · v0.13.0,\n2026-09-28: deployed commit `5ba1e566338fc17d9b8965d3be180bc1df268e2e`,\ntag `release-2026-09-28-reconciliation-cleanup`. Архив\n`aipedia-code-5ba1e566338f.zip`, SHA-256\n`1ce9f36d3400785dc9c98fb6f8a71ce38c57048ae520bda919619f784bfd290d`.\nServer preflight, trial, deploy, `verify-release`, `catalog_master qa --production`\nи Public QA 1657/1657 PASS; 325 Models / 147 Tools сохранены, 13 точных\nизменений каталога. Backup:\n`/srv/aipedia/backups/aipedia-before-code-20260928T235552Z.sqlite3`.\nОтчёт — `docs/history/2026-09-28-reconciliation-cleanup.md`.\n\n### Предыдущий публичный выпуск — Evaluation Evidence #012\n\nEvaluation Evidence, Release #012 · v0.12.0, 2026-09-28\n16:37 UTC: deployed candidate/release id `d349d6de42cbe49dd55134a7ca792f6bce85ab7e`,\nархив `aipedia-code-d349d6de42cb.zip`, SHA-256\n`faf755db0497b0e3c718ab3b655edb46d51499936a7f247d8e93a280ed0b3127`.\nGit commit проверенного кандидата `655fb90185b76a8597b53a5829db4e8e8c63dc97`,\ntag `release-2026-09-28-eval-evidence`: 356 архивных файлов совпали с tag после\nштатной нормализации Git (0 несовпадений). `/healthz` подтвердил release id;\nserver preflight/trial/deploy/verify-release PASS, `catalog_master qa --production`\nPASS, GSD Production QA 1657/1657, публичный браузер RU/EN/ar/fa/de/zh-hans PASS.\n325 Models / 147 Tools сохранены; Evaluation 906 → 5 010. Rollback backup:\n`/srv/aipedia/backups/aipedia-before-code-20260928T163724Z.sqlite3`.\nОтчёт — `docs/history/2026-09-28-eval-evidence-release.md`.\n\n### Предыдущий публичный выпуск — Catalog 325 Models / 147 Tools\n\nCatalog 325 Models / 147 Tools, 2026-09-27\n22:00 UTC: commit `9ddba83c176aa3f6793362d6345b797c76ddf987`, tag\n`release-2026-09-27-catalog-325-147`. Архив `aipedia-code-9ddba83c176a.zip`,\nSHA-256 `7b8fa47b7c4da09f746b6ab17f4baa92efebab05bcebb140cefac94fb40020d7`.\n`/healthz`, серверная SQLite и публичный браузер подтвердили 325 Models / 147\nTools. `catalog_master qa --production`: PASS; полный GSD Production QA:\n1657/1657. Backups и отчёт — `docs/history/2026-09-27-catalog-325-147-release.md`.\n\n### Предыдущий публичный выпуск — Tools chronology + Cloudflare CSP\n\nTools chronology + Cloudflare CSP, 2026-09-27\n19:13 UTC: commit `cf4ac9a33f8d4467510d6b76ebe115ce7e1803d3`, tag\n`release-2026-09-27-tools-chronology-csp`. Архив\n`aipedia-code-cf4ac9a33f8d.zip`, SHA-256\n`8af0a16c7044a8208e5ac38aa1d6a156621c670ccbaeb17640895c7f6e46c7a0`.\n`/healthz` и серверная SQLite подтвердили 321 Models, 143 Tools, номера 1–143,\n60 точных и 83 приблизительные даты. Backup и отчёт —\n`docs/history/2026-09-27-tools-chronology-csp-release.md`.\n\n### Предыдущий публичный выпуск — adaptive-ui\n\nadaptive-ui, 2026-09-27 16:16 UTC: commit\n`aa48e11bad7326340463654e33ba5e89769042b9`, tag `release-2026-09-27-adaptive-ui`\n(`main` = опубликованная линия). По коду публичный сайт работает на commit `aa48e11bad7326340463654e33ba5e89769042b9`.\nАрхив `aipedia-code-aa48e11bad73.zip`, SHA-256\n`51d7a45239b26c5400f3c0187960c2227ae7a2f04864d47fb6311c0eb524b453`; `/healthz` подтвердил\ncommit и production; 321 Models / 143 Tools. Отчёт — `docs/history/2026-09-27-adaptive-ui-release.md`.\n\n### Предыдущий публичный выпуск — catalog-master-v015-final\n\ncatalog-master-v015-final, 2026-09-27 03:23 UTC: commit\n`a51c0a1aed2f63047b0203b208eccf8def458ae7`, tag `release-2026-09-27-catalog-master-v015-final`.\nНа дату этого выпуска код публичного сайта — commit `a51c0a1aed2f63047b0203b208eccf8def458ae7`.\nАрхив `aipedia-code-a51c0a1aed2f.zip`, SHA-256\n`e2f5485db53988bd7d66fd9fa5542665d2e232d157aa12071b1ae2446b3a92e1`; `/healthz` подтвердил\ncommit и production; 321 Models / 143 Tools. Отчёт — `docs/history/2026-09-27-catalog-master-v015-final.md`.\n\n### Предыдущий публичный выпуск — catalog-master-v015\n\ncatalog-master-v015, 2026-09-27 01:35 UTC: commit\n`e36acfa351b28f441ec7ad91587b67201cb8aa85`, tag `release-2026-09-26-catalog-master-v015`.\nНа дату этого выпуска код публичного сайта — commit `e36acfa351b28f441ec7ad91587b67201cb8aa85`.\nАрхив `aipedia-code-e36acfa351b2.zip`, SHA-256\n`d5225a113f5c48193bef5df508afac32829
